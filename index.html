<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유성클리닝 현장 출력 프로그램</title>
<style>
  :root {
    --navy: #1a3a5c;
    --blue: #2563eb;
    --blue-dark: #1d4ed8;
    --border: #e2e8f0;
    --bg: #f1f5f9;
    --text: #1e293b;
    --text-sub: #64748b;
    --green-bg: #ecfdf5;
    --green-border: #a7f3d0;
    --green-text: #047857;
    --red: #ef4444;
    --green-dot: #22c55e;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-width: 1080px;
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  /* Header */
  header {
    background: #fff;
    color: var(--text);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .title-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .title-group .icon {
    font-size: 20px;
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--blue);
    border-radius: 10px;
  }
  header h1 {
    font-size: 19px;
    margin: 0;
    font-weight: 700;
    color: var(--navy);
  }
  .status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-sub);
    padding: 7px 14px;
  }
  .status-pill .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--red);
  }
  .status-pill .dot.connected { background: var(--green-dot); }
  .status-pill .dot.running {
    background: #fbbf24;
    animation: pulse 1s infinite;
  }
  @keyframes pulse { 50% { opacity: 0.3; } }

  /* Banner */
  .banner {
    margin: 16px 24px 0;
    background: #fffbeb;
    border: 1px solid #fde68a;
    color: #92400e;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .banner.show { display: flex; }
  .banner button {
    background: #92400e;
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }

  /* Layout */
  .layout {
    display: grid;
    grid-template-columns: 300px 1fr 320px;
    gap: 16px;
    padding: 20px 24px;
    align-items: start;
  }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
  }
  .card-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 15px;
    font-weight: 700;
    color: var(--navy);
    margin: 0 0 14px;
  }

  /* Left column */
  .field-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-sub);
    margin-bottom: 6px;
  }
  .field-group { margin-bottom: 16px; }
  .field-group input[type="date"],
  .field-group input[type="text"] {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 14px;
    color: var(--text);
  }
  .day-selector {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .day-btn {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 0;
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
  }
  .day-btn:hover:not(:disabled) { background: #f1f5f9; }
  .day-btn.selected { background: var(--blue); border-color: var(--blue); color: #fff; }
  .day-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-primary {
    width: 100%;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .btn-primary:hover:not(:disabled) { background: var(--blue-dark); }
  .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; }

  .menu-list { display: flex; flex-direction: column; gap: 8px; }
  .menu-btn {
    width: 100%;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    text-align: left;
  }
  .menu-btn .icon { font-size: 16px; width: 18px; text-align: center; }
  .menu-btn:hover:not(:disabled) { background: #f1f5f9; border-color: #cbd5e1; }
  .menu-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .menu-btn.danger:hover:not(:disabled) { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }

  /* Center column: file list */
  .file-list-card { min-height: 480px; display: flex; flex-direction: column; }
  .file-list { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  .file-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
  }
  .file-item .fname {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-item .fname .pdf-icon { color: var(--red); font-size: 15px; flex-shrink: 0; }
  .file-item a {
    flex-shrink: 0;
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    white-space: nowrap;
  }
  .file-item a:hover { opacity: 0.9; }
  .file-item.merged {
    background: #eff6ff;
    border: 1.5px solid var(--navy);
  }
  .file-item.merged .fname { font-weight: 700; }
  .file-item.merged .fname .pdf-icon { color: var(--navy); }
  .file-item.merged a { background: var(--navy); font-weight: 700; }
  .file-list-divider {
    font-size: 11px;
    color: #94a3b8;
    margin: 2px 0;
    padding-top: 4px;
    border-top: 1px dashed var(--border);
  }
  .empty-state {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-sub);
    font-size: 14px;
    text-align: center;
    line-height: 1.6;
  }
  .error-banner {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 14px;
    margin-bottom: 12px;
  }

  /* Right column: progress */
  .progress-label {
    font-size: 13px;
    color: var(--text-sub);
    margin-bottom: 6px;
  }
  .progress-label b { color: var(--blue); font-weight: 700; }
  .progress-track {
    background: #e2e8f0;
    border-radius: 999px;
    height: 16px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--blue);
    transition: width 0.3s;
  }
  .progress-percent {
    text-align: right;
    font-size: 13px;
    font-weight: 700;
    color: var(--blue);
    margin-bottom: 10px;
  }
  .progress-remain {
    font-size: 12px;
    color: var(--text-sub);
  }
  .progress-idle {
    font-size: 13px;
    color: var(--text-sub);
    text-align: center;
    padding: 12px 0;
  }

  .guide-list { display: flex; flex-direction: column; gap: 10px; }
  .guide-item { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text); }
  .guide-num {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--blue);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Bottom bar */
  .bottom-bar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    padding: 0 24px 24px;
  }
  .bottom-btn {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .bottom-btn:hover { background: #f1f5f9; }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    width: 100%;
    max-width: 420px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
  }
  .modal h3 {
    margin: 0 0 6px;
    font-size: 16px;
    color: var(--navy);
  }
  .modal p {
    margin: 0 0 14px;
    font-size: 13px;
    color: var(--text-sub);
  }
  .modal input[type="text"], .modal input[type="url"] {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 14px;
    margin-bottom: 14px;
  }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .modal-actions button {
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: #fff;
  }
  .modal-actions .confirm {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
  }
  .modal-actions .confirm:hover { background: var(--blue-dark); }
  .modal-actions .cancel:hover { background: #f1f5f9; }

  .history-list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  .history-item {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    color: var(--text-sub);
  }
  .history-item .h-main { color: var(--text); font-weight: 600; }
  .history-empty {
    text-align: center;
    color: var(--text-sub);
    font-size: 13px;
    padding: 20px;
  }
</style>
</head>
<body>

<header>
  <div class="title-group">
    <span class="icon">🖨️</span>
    <h1>유성클리닝 현장 출력 프로그램</h1>
  </div>
  <div class="status-pill">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">연결 안됨</span>
  </div>
</header>

<div class="banner" id="setupBanner">
  <span>GAS Web App URL이 설정되지 않았어요. 설정 버튼을 눌러 URL을 입력해주세요.</span>
  <button id="bannerSettingsBtn">설정하기</button>
</div>

<div class="layout">

  <!-- Left column -->
  <div class="card">
    <div class="card-title">📅 출력 요일</div>
    <div class="field-group">
      <div class="day-selector" id="daySelector"></div>
    </div>

    <button class="btn-primary" id="btnTodayPackage">🖨️ 오늘 전체 출력</button>

    <div class="menu-list">
      <button class="menu-btn" id="btnCourses"><span class="icon">🧭</span> 코스별 출력</button>
      <button class="menu-btn" id="btnCloser"><span class="icon">👤</span> 마감자 출력</button>
      <button class="menu-btn danger" id="btnReset"><span class="icon">↺</span> 수정모드 복구</button>
    </div>
  </div>

  <!-- Center column -->
  <div class="card file-list-card">
    <div class="card-title" id="fileListTitle">📄 오늘 생성될 파일</div>
    <div class="error-banner" id="errorBanner" style="display:none;"></div>
    <div class="file-list" id="fileList"></div>
    <div class="empty-state" id="emptyState">출력 버튼을 누르면<br>여기에 생성된 파일 목록이 표시됩니다.</div>
  </div>

  <!-- Right column -->
  <div>
    <div class="card" style="margin-bottom:16px;">
      <div class="card-title">🕐 진행상황</div>
      <div id="progressIdle" class="progress-idle">대기 중</div>
      <div id="progressActive" style="display:none;">
        <div class="progress-label">현재 작업: <b id="progressLabelText">-</b></div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-percent" id="progressPercent">0%</div>
        <div class="progress-remain" id="progressRemain">예상 남은 시간: 계산 중</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">💡 빠른 안내</div>
      <div class="guide-list">
        <div class="guide-item"><span class="guide-num">1</span> 요일 확인 (오늘 자동 선택)</div>
        <div class="guide-item"><span class="guide-num">2</span> 오늘 전체 출력 클릭</div>
        <div class="guide-item"><span class="guide-num">3</span> PDF 확인</div>
      </div>
    </div>
  </div>

</div>

<div class="bottom-bar">
  <button class="bottom-btn" id="btnOpenFolder">📁 오늘 출력 폴더 열기</button>
  <button class="bottom-btn" id="btnHistory">🕐 최근 출력 내역</button>
  <button class="bottom-btn" id="btnSettings">⚙️ 설정</button>
</div>

<!-- Settings modal -->
<div class="modal-overlay" id="settingsModalOverlay">
  <div class="modal">
    <h3>GAS Web App URL 설정</h3>
    <p>Google Apps Script Web App 배포 URL을 입력하세요.</p>
    <input type="url" id="gasUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
    <div class="modal-actions">
      <button class="cancel" data-close="settingsModalOverlay">취소</button>
      <button class="confirm" id="gasUrlConfirmBtn">저장</button>
    </div>
  </div>
</div>

<!-- History modal -->
<div class="modal-overlay" id="historyModalOverlay">
  <div class="modal">
    <h3>최근 출력 내역</h3>
    <div class="history-list" id="historyList"></div>
    <div class="modal-actions" style="margin-top:14px;">
      <button class="cancel" data-close="historyModalOverlay">닫기</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var STORAGE_KEYS = {
    gasUrl: 'ysc_gas_url',
    history: 'ysc_print_history'
  };
  var DEFAULT_URL_PLACEHOLDER = '여기에_입력';
  var DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbx4L6ZiXjjKkQPo1vcGxp5iuP7MktAo30gn-fCRAQPCdrRb1VQ_yijQ6hvS21NoIrvM/exec';
  var FETCH_TIMEOUT_MS = 400000; // Apps Script 실행 자체가 6분 안에 끝나거나 에러로 끝나므로, 그보다 여유 있게 잡아 정상 완료를 "실패"로 잘못 표시하지 않게 한다.
  var PROGRESS_POLL_MS = 1500;

  var WEEKDAYS = ['월', '화', '수', '목', '금', '토', '일'];
  var WEEKDAY_FROM_JS_DAY = ['일', '월', '화', '수', '목', '금', '토']; // Date#getDay() 0=일 ~ 6=토

  var MENU_LABELS = {
    exportTodayPackage: '오늘 전체 출력',
    exportCloserByDate: '마감자 출력',
    exportByDateDriversOnly: '코스별 출력',
    resetViewMode: '수정모드 복구'
  };

  var state = {
    selectedDay: WEEKDAY_FROM_JS_DAY[new Date().getDay()],
    isRunning: false,
    lastFolderUrl: ''
  };

  var progressTimer = null;

  // ---------- DOM refs ----------
  var statusDot = document.getElementById('statusDot');
  var statusText = document.getElementById('statusText');
  var setupBanner = document.getElementById('setupBanner');
  var bannerSettingsBtn = document.getElementById('bannerSettingsBtn');

  var daySelector = document.getElementById('daySelector');

  var btnTodayPackage = document.getElementById('btnTodayPackage');
  var btnCloser = document.getElementById('btnCloser');
  var btnCourses = document.getElementById('btnCourses');
  var btnReset = document.getElementById('btnReset');
  var allActionButtons = [btnTodayPackage, btnCloser, btnCourses, btnReset];

  var fileListTitle = document.getElementById('fileListTitle');
  var errorBanner = document.getElementById('errorBanner');
  var fileList = document.getElementById('fileList');
  var emptyState = document.getElementById('emptyState');

  var progressIdle = document.getElementById('progressIdle');
  var progressActive = document.getElementById('progressActive');
  var progressLabelText = document.getElementById('progressLabelText');
  var progressFill = document.getElementById('progressFill');
  var progressPercent = document.getElementById('progressPercent');
  var progressRemain = document.getElementById('progressRemain');

  var btnOpenFolder = document.getElementById('btnOpenFolder');
  var btnHistory = document.getElementById('btnHistory');
  var btnSettings = document.getElementById('btnSettings');

  var settingsModalOverlay = document.getElementById('settingsModalOverlay');
  var gasUrlInput = document.getElementById('gasUrlInput');
  var gasUrlConfirmBtn = document.getElementById('gasUrlConfirmBtn');

  var historyModalOverlay = document.getElementById('historyModalOverlay');
  var historyList = document.getElementById('historyList');

  // ---------- Utility ----------
  function getGasUrl() {
    return localStorage.getItem(STORAGE_KEYS.gasUrl) || DEFAULT_GAS_URL;
  }
  function setGasUrl(url) {
    localStorage.setItem(STORAGE_KEYS.gasUrl, url);
  }
  function isGasUrlConfigured() {
    var url = getGasUrl();
    return !!url && url.indexOf(DEFAULT_URL_PLACEHOLDER) === -1;
  }

  function buildDaySelector() {
    daySelector.innerHTML = '';
    WEEKDAYS.forEach(function (d) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'day-btn';
      b.id = 'day-' + d;
      b.textContent = d;
      b.addEventListener('click', function () { selectDay(d); });
      daySelector.appendChild(b);
    });
    selectDay(state.selectedDay);
  }

  function selectDay(d) {
    state.selectedDay = d;
    WEEKDAYS.forEach(function (w) {
      var btn = document.getElementById('day-' + w);
      if (!btn) return;
      btn.classList.toggle('selected', w === d);
    });
  }

  function setStatus(mode, text) {
    statusDot.classList.remove('connected', 'running');
    if (mode === 'connected') statusDot.classList.add('connected');
    if (mode === 'running') statusDot.classList.add('running');
    statusText.textContent = text;
  }

  function updateConnectionStatus() {
    var configured = isGasUrlConfigured();
    if (configured) {
      setStatus('connected', '오늘 출력 준비 완료');
      setupBanner.classList.remove('show');
    } else {
      setStatus('idle', '연결 안됨');
      setupBanner.classList.add('show');
    }
  }

  function showModal(overlay) { overlay.classList.add('show'); }
  function hideModal(overlay) { overlay.classList.remove('show'); }

  function setRunning(running) {
    state.isRunning = running;
    allActionButtons.forEach(function (btn) { btn.disabled = running; });

    if (running) {
      setStatus('running', '출력 중...');
      errorBanner.style.display = 'none';
      startProgressPolling();
    } else {
      stopProgressPolling();
    }
  }

  function showError(message) {
    errorBanner.textContent = '⚠️ ' + message;
    errorBanner.style.display = 'block';
    fileList.innerHTML = '';
    emptyState.style.display = 'none';
    setStatus(isGasUrlConfigured() ? 'idle' : 'idle', '출력 실패');
  }

  function showResult(links, menuLabel) {
    errorBanner.style.display = 'none';
    fileListTitle.textContent = '📄 ' + (menuLabel || '생성된 파일');
    fileList.innerHTML = '';

    if (!links || links.length === 0) {
      emptyState.style.display = 'flex';
      emptyState.innerHTML = '완료되었습니다. (생성된 파일 없음)';
      return;
    }

    emptyState.style.display = 'none';

    var mergedLinks = links.filter(function (l) { return (l.fileType || '').indexOf('통합인쇄') !== -1; });
    var normalLinks = links.filter(function (l) { return (l.fileType || '').indexOf('통합인쇄') === -1; });

    function renderLink(link, isMerged) {
      var item = document.createElement('div');
      item.className = isMerged ? 'file-item merged' : 'file-item';

      var fname = document.createElement('span');
      fname.className = 'fname';
      fname.innerHTML = '<span class="pdf-icon">' + (isMerged ? '🖨️' : '📕') + '</span><span>' + escapeHtml(link.fileName || '(파일명 없음)') + '</span>';

      var a = document.createElement('a');
      a.href = link.url || '#';
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = isMerged ? '전체 인쇄' : '열기';

      item.appendChild(fname);
      item.appendChild(a);
      fileList.appendChild(item);
    }

    mergedLinks.forEach(function (link) { renderLink(link, true); });

    if (mergedLinks.length && normalLinks.length) {
      var divider = document.createElement('div');
      divider.className = 'file-list-divider';
      divider.textContent = '개별 파일';
      fileList.appendChild(divider);
    }

    normalLinks.forEach(function (link) { renderLink(link, false); });

    setStatus('connected', '오늘 출력 완료');
  }

  function escapeHtml(s) {
    var div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  // ---------- History ----------
  function getHistory() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEYS.history) || '[]');
    } catch (e) {
      return [];
    }
  }
  function addHistory(entry) {
    var hist = getHistory();
    hist.unshift(entry);
    hist = hist.slice(0, 10);
    localStorage.setItem(STORAGE_KEYS.history, JSON.stringify(hist));
  }
  function renderHistory() {
    var hist = getHistory();
    historyList.innerHTML = '';
    if (hist.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'history-empty';
      empty.textContent = '출력 기록이 없습니다.';
      historyList.appendChild(empty);
      return;
    }
    hist.forEach(function (h) {
      var item = document.createElement('div');
      item.className = 'history-item';
      var left = document.createElement('span');
      left.className = 'h-main';
      left.textContent = (h.weekday || h.date || '') + '요일 · ' + h.menuName;
      var right = document.createElement('span');
      right.textContent = h.duration;
      item.appendChild(left);
      item.appendChild(right);
      historyList.appendChild(item);
    });
  }

  btnHistory.addEventListener('click', function () {
    renderHistory();
    showModal(historyModalOverlay);
  });

  // ---------- Progress polling ----------
  function startProgressPolling() {
    stopProgressPolling();
    progressIdle.style.display = 'none';
    progressActive.style.display = 'block';
    pollProgressOnce();
    progressTimer = setInterval(pollProgressOnce, PROGRESS_POLL_MS);
  }

  function stopProgressPolling() {
    if (progressTimer) {
      clearInterval(progressTimer);
      progressTimer = null;
    }
    progressActive.style.display = 'none';
    progressIdle.style.display = 'block';
    progressIdle.textContent = '대기 중';
  }

  function formatSec(sec) {
    if (sec === null || sec === undefined) return '계산 중';
    sec = Number(sec);
    if (sec < 60) return sec + '초';
    var min = Math.floor(sec / 60);
    var remain = sec % 60;
    return min + '분 ' + remain + '초';
  }

  function pollProgressOnce() {
    var url = getGasUrl();
    fetch(url, {
      method: 'POST',
      body: JSON.stringify({ action: 'getProgress' })
    }).then(function (res) { return res.json(); })
      .then(function (p) {
        if (!state.isRunning) return;
        var percent = p.percent || 0;
        progressFill.style.width = percent + '%';
        progressPercent.textContent = percent + '%';
        progressLabelText.textContent = p.label || '-';
        progressRemain.textContent = '예상 남은 시간: ' + formatSec(p.remainSec);
      })
      .catch(function () {});
  }

  // ---------- GAS call ----------
  // payload는 { action, weekday, ... } 객체 전체를 그대로 JSON으로 보낸다.
  function callGAS(payload) {
    var url = getGasUrl();
    var controller = new AbortController();
    var timeoutId = setTimeout(function () { controller.abort(); }, FETCH_TIMEOUT_MS);

    return fetch(url, {
      method: 'POST',
      body: JSON.stringify(payload),
      signal: controller.signal
    }).then(function (res) {
      clearTimeout(timeoutId);
      if (!res.ok) {
        throw new Error('HTTP ' + res.status);
      }
      return res.json();
    }).finally(function () {
      clearTimeout(timeoutId);
    });
  }

  // exportTodayPackage 등은 코스 수가 많으면 한 번의 요청으로 처리할 때
  // Apps Script 웹앱의 6분 실행 제한에 걸려 강제 종료된다(실행 로그로 확인됨).
  // 그래서 "전체(마감자)"와 코스 하나하나를 각각 별도의 짧은 요청으로 순차
  // 호출하고, 모든 준비가 끝난 뒤 마지막 요청에서만 통합 인쇄용 PDF를 만든다.
  var EXPORT_CONF = {
    exportTodayPackage: { includeTotal: true, includeCourses: true },
    exportCloserByDate: { includeTotal: true, includeCourses: false },
    exportByDateDriversOnly: { includeTotal: false, includeCourses: true }
  };

  function runChunkedExport(action, weekday) {
    var conf = EXPORT_CONF[action];
    var label = MENU_LABELS[action] || action;
    var runId = weekday + '_' + Date.now() + '_' + Math.floor(Math.random() * 1000);

    return callGAS({
      action: 'exportGetOrder',
      weekday: weekday,
      label: label,
      includeTotal: conf.includeTotal,
      includeCourses: conf.includeCourses
    }).then(function (orderResult) {
      if (orderResult.status !== 'ok') {
        throw new Error(orderResult.message || '요일 데이터를 불러오지 못했습니다.');
      }

      var units = [];
      if (conf.includeTotal) units.push('__TOTAL__');
      if (conf.includeCourses) units = units.concat(orderResult.order || []);

      var totalUnits = units.length;
      var allLinks = [];

      var chain = Promise.resolve();
      units.forEach(function (unit, idx) {
        chain = chain.then(function () {
          return callGAS({
            action: 'exportPrepareUnit',
            weekday: weekday,
            label: label,
            runId: runId,
            unit: unit,
            unitIndex: idx + 1,
            totalUnits: totalUnits
          }).then(function (r) {
            if (r.status !== 'ok') {
              throw new Error(r.message || (unit + ' 준비 중 오류가 발생했습니다.'));
            }
            allLinks = allLinks.concat(r.links || []);
          });
        });
      });

      return chain
        .then(function () {
          return callGAS({ action: 'exportFinalize', weekday: weekday, label: label, runId: runId, totalUnits: totalUnits });
        })
        .then(function (finalResult) {
          if (finalResult.status !== 'ok') {
            throw new Error(finalResult.message || '통합 PDF 생성 중 오류가 발생했습니다.');
          }
          return {
            status: 'ok',
            links: (finalResult.links || []).concat(allLinks),
            folderUrl: finalResult.folderUrl
          };
        });
    });
  }

  function runAction(action) {
    if (!isGasUrlConfigured()) {
      showModal(settingsModalOverlay);
      return;
    }
    if (state.isRunning) return;

    var weekday = state.selectedDay;
    var startTime = Date.now();
    setRunning(true);

    var actionPromise = EXPORT_CONF[action]
      ? runChunkedExport(action, weekday)
      : callGAS({ action: action, weekday: weekday });

    actionPromise
      .then(function (result) {
        setRunning(false);
        var elapsedSec = Math.round((Date.now() - startTime) / 1000);
        var durationStr = elapsedSec < 60
          ? elapsedSec + '초'
          : Math.floor(elapsedSec / 60) + '분 ' + (elapsedSec % 60) + '초';

        if (result && result.status === 'ok') {
          if (result.folderUrl) state.lastFolderUrl = result.folderUrl;
          showResult(result.links || [], MENU_LABELS[action] || action);
          addHistory({
            weekday: weekday,
            menuName: MENU_LABELS[action] || action,
            duration: durationStr
          });
          updateConnectionStatus();
        } else {
          var msg = (result && result.message) ? result.message : '알 수 없는 오류가 발생했습니다.';
          showError(msg);
        }
      })
      .catch(function (err) {
        setRunning(false);
        if (err && err.name === 'AbortError') {
          showError('출력 시간이 너무 오래 걸려 중단되었어요. GAS 실행 상태를 확인해주세요.');
        } else if (err && err.message && !/^HTTP \d+$/.test(err.message)) {
          showError(err.message);
        } else {
          showError('출력에 실패했어요. GAS 연결을 확인해주세요.');
        }
      });
  }

  // ---------- Event bindings ----------
  btnTodayPackage.addEventListener('click', function () { runAction('exportTodayPackage'); });
  btnCloser.addEventListener('click', function () { runAction('exportCloserByDate'); });
  btnCourses.addEventListener('click', function () { runAction('exportByDateDriversOnly'); });

  btnReset.addEventListener('click', function () {
    if (state.isRunning) return;
    if (!confirm('수정모드로 복구하면 모든 행/열 숨김이 해제됩니다. 계속할까요?')) return;
    runAction('resetViewMode');
  });

  btnOpenFolder.addEventListener('click', function () {
    if (state.lastFolderUrl) {
      window.open(state.lastFolderUrl, '_blank');
    } else {
      alert('아직 오늘 생성된 출력 폴더가 없어요. 먼저 출력을 한 번 실행해주세요.');
    }
  });

  // Settings modal
  function openSettingsModal() {
    gasUrlInput.value = isGasUrlConfigured() ? getGasUrl() : '';
    showModal(settingsModalOverlay);
    setTimeout(function () { gasUrlInput.focus(); }, 50);
  }
  btnSettings.addEventListener('click', openSettingsModal);
  bannerSettingsBtn.addEventListener('click', openSettingsModal);

  gasUrlConfirmBtn.addEventListener('click', function () {
    var val = gasUrlInput.value.trim();
    if (!val) {
      gasUrlInput.focus();
      return;
    }
    setGasUrl(val);
    hideModal(settingsModalOverlay);
    updateConnectionStatus();
  });
  gasUrlInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') gasUrlConfirmBtn.click();
  });

  // Close modal on overlay click / cancel buttons
  document.querySelectorAll('.modal-overlay').forEach(function (overlay) {
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) hideModal(overlay);
    });
  });
  document.querySelectorAll('[data-close]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      hideModal(document.getElementById(btn.dataset.close));
    });
  });

  // ---------- Init ----------
  buildDaySelector();
  updateConnectionStatus();

})();
</script>

</body>
