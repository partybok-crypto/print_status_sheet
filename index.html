  // ================= 화면 미리보기 (실제 인쇄와 동일한 DOM을 별도로 렌더링, 화면 축소는 이 컨테이너에만 적용) =================
  function buildPageFrame(node, flow) {
    var frame = document.createElement('div');
    frame.className = 'page-frame' + (flow ? ' flow-frame' : '');
    node.classList.add('page-card');
    frame.appendChild(node);
    return frame;
  }

  function fitPreviewPages() {
    var frames = Array.prototype.slice.call(previewSurface.querySelectorAll('.page-frame'));
    if (!frames.length) return;
    var vpRect = previewViewport.getBoundingClientRect();
    var availW = Math.max(vpRect.width - 52, 100);
    var availH = Math.max(vpRect.height - 52, 100);
    var zoomMul = state.zoomPct / 100;

    var infos = frames.map(function (f) {
      var card = f.querySelector('.page-card');
      var w = card.scrollWidth, h = card.scrollHeight;
      return { frame: f, card: card, w: w, h: h };
    });

    infos.forEach(function (info) {
      var s = Math.min(availW / info.w, 1);
      if (infos.length === 1 && !info.frame.classList.contains('flow-frame')) s = Math.min(s, availH / info.h, 1);
      s = Math.max(s * zoomMul, MIN_SCALE);
      info.card.style.transform = 'scale(' + s + ')';
      info.frame.style.width = (info.w * s) + 'px';
      info.frame.style.height = (info.h * s) + 'px';
    });
  }

  function renderPreview() {
    previewSurface.innerHTML = '';
    if (!state.merged) {
      var loading = document.createElement('div'); loading.className = 'preview-empty';
      loading.appendChild(w2Loader(t('loadingDocs'), '', ['시트에서 거래처 목록 읽는 중', '코스·기사 정보 확인 중', '거의 다 됐습니다']));
      previewSurface.appendChild(loading); return;
    }
    if (state.merged.closedDay) {
      var closed = document.createElement('div'); closed.className = 'preview-empty'; closed.textContent = t('closedPreview');
      previewSurface.appendChild(closed); return;
    }
    if (state.docType === 'changes') {
      var msg = changesEmptyMessage();
      if (msg) {
        var note = document.createElement('div'); note.className = 'preview-empty'; note.textContent = msg;
        previewSurface.appendChild(note); return;
      }
      previewSurface.appendChild(buildPageFrame(buildChangesDoc(), true));
      requestAnimationFrame(fitPreviewPages);
      return;
    }
    if (state.docType === 'closer' || state.docType === 'closer_all_address') {
      var closerNode = buildCloserDoc(state.merged.courses.slice(), state.merged);
      previewSurface.appendChild(buildPageFrame(closerNode, true));
      requestAnimationFrame(fitPreviewPages);
      return;
    }
    if (state.docType === 'washCheck') {
      previewSurface.appendChild(buildPageFrame(buildWashCheckDoc(state.merged.courses.slice(), state.merged), true));
      requestAnimationFrame(fitPreviewPages);
      return;
    }
    if (state.docType === 'wash') {
      ensureWashHistory(false);
      previewSurface.appendChild(buildPageFrame(buildWashDoc(state.merged), true));
      requestAnimationFrame(fitPreviewPages);
      return;
    }
    if (state.docType === 'all_address') {
      var addrAllNode = buildAddressAllDoc(state.merged);
      previewSurface.appendChild(buildPageFrame(addrAllNode, true));
      requestAnimationFrame(fitPreviewPages);
      return;
    }
    var courses = getCoursesToPrint();
    if (!courses.length) {
      var none = document.createElement('div'); none.className = 'preview-empty'; none.textContent = t('pickCoursePreview');
      previewSurface.appendChild(none); return;
    }
    function appendDoc(kind) {
      courses.forEach(function (course) {
        var items = state.merged.byCourse[course];
        var driver = state.merged.drivers[course];
        var node = kind === 'status'
          ? buildStatusCourseBlock(course, items, driver, state.merged)
          : buildAddressCourseBlock(course, items, driver, state.merged);
        previewSurface.appendChild(buildPageFrame(node));
      });
    }
    if (state.docType === 'address') appendDoc('address');
    else if (state.docType === 'status') appendDoc('status');
    else { appendDoc('status'); appendDoc('address'); }
    if (state.docType === 'status_address_wash') { ensureWashHistory(false); previewSurface.appendChild(buildPageFrame(buildWashDoc(state.merged), true)); }

    requestAnimationFrame(fitPreviewPages);
  }

  zoomOut.addEventListener('click', function () { state.zoomPct = Math.max(50, state.zoomPct - 10); zoomLabel.textContent = state.zoomPct + '%'; fitPreviewPages(); });
  zoomIn.addEventListener('click', function () { state.zoomPct = Math.min(160, state.zoomPct + 10); zoomLabel.textContent = state.zoomPct + '%'; fitPreviewPages(); });

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitPreviewPages, 80);
  });

  // ================= 인쇄 기록 (관리 화면 출력기록 탭과 공유) =================
  // ================= 출력본 남기기 (마감 때 출력한 현황지를 서버에 한 벌 저장) =================
  function readJsonLS(key, fallback) {
    try { var v = JSON.parse(localStorage.getItem(key) || 'null'); return v == null ? fallback : v; } catch (e) { return fallback; }
  }
  function writeJsonLS(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }

  function buildSnapshot(kind, courses) {
    var m = state.merged;
    if (!m || m.closedDay || !courses || !courses.length) return null;
    var out = [];
    courses.forEach(function (course) {
      var arr = (m.byCourse && m.byCourse[course]) || [];
      if (!arr.length) return;
      out.push({
        course: course,
        driver: (m.drivers && m.drivers[course]) || '',
        items: arr.map(function (it) { return { seq: it.deliveryOrder || '', no: it.companyNumber || '', name: it.nickname || '' }; })
      });
    });
    if (!out.length) return null;
    return { date: isoDate(state.selectedDate), kind: kind, courses: out };
  }

  function postSnapshot(snap) {
    // text/plain으로 보내면 브라우저가 사전 확인(preflight) 없이 바로 전송한다.
    return fetch(SNAPSHOT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(snap) })
      .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); });
  }

  function flushPendingSnapshots() {
    var pending = readJsonLS(STORAGE_KEYS.snapshotPending, []);
    if (!pending.length) return;
    writeJsonLS(STORAGE_KEYS.snapshotPending, []);
    pending.forEach(function (snap) {
      postSnapshot(snap).catch(function () { queueSnapshot(snap); });
    });
  }
  function queueSnapshot(snap) {
    var pending = readJsonLS(STORAGE_KEYS.snapshotPending, []);
    pending.push(snap);
    if (pending.length > 5) pending = pending.slice(pending.length - 5);
    writeJsonLS(STORAGE_KEYS.snapshotPending, pending);
  }

  function saveSnapshot(kind, courses) {
    if (kind !== 'status' && kind !== 'closer') return;
    var snap = buildSnapshot(kind, courses);
    if (!snap) return;
    // 같은 날·같은 문서·같은 내용을 연속으로 다시 출력하면 중복으로 쌓지 않는다.
    var sig = snap.date + '|' + kind + '|' + JSON.stringify(snap.courses);
    var sigs = readJsonLS(STORAGE_KEYS.snapshotSig, {});
    var sigKey = snap.date + '|' + kind;
    if (sigs[sigKey] === sig) return;
    postSnapshot(snap).then(function () {
      sigs[sigKey] = sig;
      var keys = Object.keys(sigs);
      if (keys.length > 20) delete sigs[keys[0]];
      writeJsonLS(STORAGE_KEYS.snapshotSig, sigs);
      // 방금 출력한 내용이 새 기준이 되므로 변경내역을 다시 계산한다.
      if (snap.date === isoDate(state.selectedDate)) loadSnapshot(snap.date);
    }).catch(function () { queueSnapshot(snap); });
  }

  // ================= 출력 후 변경내역 (마지막 출력본 vs 지금 화면) =================
  var SNAPSHOT_TIMEOUT_MS = 12000;

  function loadSnapshot(dateIso) {
    state.snapshotStatus = 'loading';
    updateChangesUI();
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, SNAPSHOT_TIMEOUT_MS);
    return fetch(SNAPSHOT_URL + '?date=' + encodeURIComponent(dateIso), { signal: controller.signal })
      .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function (data) {
        if (isoDate(state.selectedDate) !== dateIso) return;  // 그 사이 날짜를 바꿨다
        if (!data || !data.ok) throw new Error('bad response');
        state.snapshot = data;
        state.snapshotStatus = 'ok';
        recomputeChanges();
      })
      .catch(function () {
        if (isoDate(state.selectedDate) !== dateIso) return;
        state.snapshot = null; state.snapshotStatus = 'error';
        state.changes = { items: [], drivers: [], printedAt: '' };
      })
      .then(function () {
        clearTimeout(timer);
        updateChangesUI();
        if (state.docType === 'changes') { renderPreview(); updatePrintButton(); }
      });
  }

  // 인쇄 모양 확인용 예시(실제 데이터가 아니다). 변경내역이 하나도 없는 날에도 출력물이 어떻게 나오는지 볼 수 있다.
  var SAMPLE_CHANGES = {
    printedAt: '2026-10-05 17:40:12',
    items: [
      { no: '24', name: '헬스코인', type: '코스 이동', from: 'B-02', to: 'C-01' },
      { no: '153', name: '비르덴', type: '코스 이동', from: 'E-03', to: 'C-05' },
      { no: '120', name: '더부즈', type: '추가', from: '-', to: 'F-13' },
      { no: '26', name: '보그', type: '제외', from: 'F-01', to: '제외' },
      { no: '61', name: '묘우', type: '순서 변경', from: 'F-05', to: 'F-02' }
    ],
    drivers: [{ course: 'F', from: '홍길동', to: '김철수' }]
  };
  function activeChanges() { return state.testMode ? SAMPLE_CHANGES : state.changes; }

  var CHANGE_TYPE_ORDER = { '코스 이동': 0, '추가': 1, '제외': 2, '순서 변경': 3 };

  function recomputeChanges() {
    var out = { items: [], drivers: [], printedAt: '' };
    var snap = state.snapshot, merged = state.merged;
    if (!snap || !snap.courses || !snap.courses.length || !merged || merged.closedDay) { state.changes = out; return; }

    var base = {}, baseCourses = {};
    snap.courses.forEach(function (c) {
      baseCourses[c.course] = c;
      if (c.printed_at && c.printed_at > out.printedAt) out.printedAt = c.printed_at;
      (c.items || []).forEach(function (it) { if (it.no) base[it.no] = { course: c.course, seq: it.seq, name: it.name }; });
    });
    var now = {};
    merged.courses.forEach(function (course) {
      (merged.byCourse[course] || []).forEach(function (it) {
        if (it.companyNumber) now[it.companyNumber] = { course: course, seq: it.deliveryOrder, name: it.nickname };
      });
    });

    // 같은 코스에 그대로 남은 업체끼리의 상대 순서(1등, 2등...)로 "순서 변경"을 판단한다.
    // 중간 업체 하나가 빠지거나 끼어들 때 뒤 업체 번호가 전부 밀려도 순서 변경으로 치지 않기 위해서다.
    var rankBase = {}, rankNow = {};
    Object.keys(baseCourses).forEach(function (course) {
      var common = (baseCourses[course].items || []).filter(function (it) { return it.no && now[it.no] && now[it.no].course === course; });
      common.forEach(function (it, i) { rankBase[it.no] = i; });
      var nowCommon = (merged.byCourse[course] || []).filter(function (it) { return base[it.companyNumber] && base[it.companyNumber].course === course; });
      nowCommon.forEach(function (it, i) { rankNow[it.companyNumber] = i; });
    });

    Object.keys(now).forEach(function (no) {
      var n = now[no], b = base[no];
      if (b) {
        if (b.course !== n.course) out.items.push({ no: no, name: n.name || b.name, type: '코스 이동', from: b.seq || b.course, to: n.seq || n.course });
        else if (rankBase[no] !== rankNow[no]) out.items.push({ no: no, name: n.name || b.name, type: '순서 변경', from: b.seq, to: n.seq });
      } else if (baseCourses[n.course]) {
        out.items.push({ no: no, name: n.name, type: '추가', from: '-', to: n.seq || n.course });
      }
    });
    Object.keys(base).forEach(function (no) {
      if (!now[no]) out.items.push({ no: no, name: base[no].name, type: '제외', from: base[no].seq || base[no].course, to: '제외' });
    });
    out.items.sort(function (a, b) {
      return (CHANGE_TYPE_ORDER[a.type] - CHANGE_TYPE_ORDER[b.type]) || (parseInt(a.no, 10) - parseInt(b.no, 10) || 0) || (a.no < b.no ? -1 : a.no > b.no ? 1 : 0);
    });

    snap.courses.forEach(function (c) {
      if (merged.courses.indexOf(c.course) === -1) return;
      var was = cleanDriverName(c.driver), is = cleanDriverName(merged.drivers[c.course]);
      if (was !== is) out.drivers.push({ course: c.course, from: was || '미배정', to: is || '미배정' });
    });
    state.changes = out;
  }

  function doPrint(bodyClass, afterFn) {
    if (state.isPrinting) return;
    state.isPrinting = true;
    document.body.classList.add(bodyClass);

    var cleanupDone = false, fallbackTimer = null;
    function cleanup() {
      if (cleanupDone) return;
      cleanupDone = true;
      if (fallbackTimer) clearTimeout(fallbackTimer);
      window.removeEventListener('afterprint', cleanup);
      document.body.classList.remove(bodyClass);
      state.isPrinting = false;
      if (afterFn) afterFn();
    }
    window.addEventListener('afterprint', cleanup);
    fallbackTimer = setTimeout(cleanup, 60000);

    var waitForRender = function () {
      return Promise.race([
        new Promise(function (resolve) { requestAnimationFrame(function () { requestAnimationFrame(resolve); }); }),
        new Promise(function (resolve) { setTimeout(resolve, 150); })
      ]);
    };
    var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready.catch(function () {}) : Promise.resolve();
    fontsReady.then(waitForRender).then(function () { window.print(); }).catch(function () { cleanup(); });
  }

  // ================= 이름표 출력 (포장기록 프로그램의 이름표 출력과 동일) =================
  // 그림 계산은 포장기록 static/js/app.js drawNameTag, 출력 앱 NameTagRenderer.kt 와 같다.
  // (한쪽을 바꾸면 여기도 같이 맞출 것) 업체 정보는 포장기록 서버 /api/name-tag/<번호> 에서 가져온다.
  var NAME_TAG_URL = 'https://yuseong-packing-production.up.railway.app/api/name-tag/';
  var NT = { LEFT: 2, RIGHT: 98, TOP_ROW_TOP: 7.5, TOP_ROW_BOTTOM: 13.6, RULE_TOP: 14.1, RULE_BOTTOM: 14.8,
    MAIN_TOP: 15.6, MAIN_BOTTOM: 46, TRADE_CENTER: 47.9, HALF: 50, NUMBER_BOX_MAX: 50, MIN_SCALE_X: 0.55 };
  var ntModal = $('nameTagModal'), ntBox = $('ntBox'), ntNo = $('ntNo'), ntMsg = $('ntMsg'), ntCanvas = $('ntCanvas');
  var ntType = $('ntType'), ntAddr = $('ntAddr'), ntShort = $('ntShort'), ntTrade = $('ntTrade');
  var ntPrint1 = $('ntPrint1'), ntPrint2 = $('ntPrint2');
  var ntCompanyNo = '';
  var ntOutline = true;

  function drawNameTag(canvas, tag) {
    var ctx = canvas.getContext('2d');
    var W = canvas.width;
    function mm(v) { return (v * W) / 100; }
    function font(px) { return 'bold ' + px + 'px Pretendard, "Malgun Gothic", sans-serif'; }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, W, W);

    function fitSize(text, maxW, maxPx, minPx) {
      var size = maxPx;
      ctx.font = font(size);
      while (size > minPx && ctx.measureText(text).width > maxW) { size -= 1; ctx.font = font(size); }
      return size;
    }
    function ellipsize(text, maxW) {
      if (ctx.measureText(text).width <= maxW) return text;
      var s = text;
      while (s.length > 1 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
      return s + '…';
    }
    var OUTLINE = mm(0.35);
    var ol = !!tag.o;
    function paintText(text, x, y, color, outline) {
      if (outline) {
        ctx.strokeStyle = color; ctx.lineWidth = OUTLINE; ctx.lineJoin = 'round';
        ctx.strokeText(text, x, y);
      } else {
        ctx.fillStyle = color;
        ctx.fillText(text, x, y);
      }
    }
    function drawText(text, x, cy, maxW, maxPx, minPx, color, align, outline) {
      if (!text || maxW <= 0) return 0;
      fitSize(text, maxW, maxPx, minPx);
      var s = ellipsize(text, maxW);
      ctx.textAlign = align;
      ctx.textBaseline = 'middle';
      paintText(s, x, cy, color, outline);
      return Math.min(ctx.measureText(s).width, maxW);
    }
    function fitFill(text, maxW, glyphH, stretch, maxStretch) {
      ctx.textBaseline = 'alphabetic';
      ctx.font = font(100);
      var m100 = ctx.measureText(text);
      var h = Math.max(1, m100.actualBoundingBoxAscent + m100.actualBoundingBoxDescent);
      var size = (100 * glyphH) / h;
      ctx.font = font(size);
      var w = ctx.measureText(text).width;
      var sx = 1;
      if (w > maxW) {
        sx = Math.max(NT.MIN_SCALE_X, maxW / w);
        if (w * sx > maxW) { size = (size * maxW) / (w * sx); ctx.font = font(size); w = ctx.measureText(text).width; }
      } else if (stretch && w > 0) {
        sx = Math.min(maxW / w, maxStretch || Infinity);
      }
      return { size: size, sx: sx, width: w * sx };
    }
    function drawFilled(text, fit, cx, top, bottom, color, outline) {
      ctx.textBaseline = 'alphabetic';
      ctx.font = font(fit.size);
      var m = ctx.measureText(text);
      ctx.textAlign = 'center';
      ctx.fillStyle = color;
      var baseline = (top + bottom) / 2 + (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;
      ctx.save();
      ctx.translate(cx, baseline);
      ctx.scale(fit.sx, 1);
      paintText(text, 0, 0, color, outline);
      ctx.restore();
    }
    // 띄어쓰기로 나눈 단어가 2개 이상이면 두 줄 길이가 가장 비슷해지는 곳에서 나눈다.
    // 안드로이드 출력 앱(NameTagRenderer.kt)은 아직 한 줄 방식이라, 앱으로 출력하는 안드로이드에서는 미리보기도 한 줄로 둔다.
    // 주소 끝의 "3층·지하1층·2F" 를 찾아 층수 글자와 나머지 주소로 나눈다(안드로이드 앱은 아직 안 하므로 안드로이드에서는 그대로)
    function extractFloor(addr) {
      if (!addr || /Android/i.test(navigator.userAgent)) return null;
      var re = /(지하\s*\d+\s*층|B\s*\d+\s*층?|\d+\s*층|\d+\s*F)/gi, m, last = null;
      while ((m = re.exec(addr)) !== null) last = m;
      if (!last) return null;
      var text = last[1].replace(/\s+/g, '').replace(/F$/i, '층').replace(/^B(\d+)층?$/i, '지하$1층');
      var rest = (addr.slice(0, last.index) + ' ' + addr.slice(last.index + last[0].length)).replace(/\s+/g, ' ').replace(/[\s\/,·\-]+$/, '').replace(/^[\s\/,·\-]+/, '');
      return { text: text, rest: rest };
    }
    function splitNameLines(text) {
      var words = String(text).trim().split(/\s+/);
      if (words.length < 2 || /Android/i.test(navigator.userAgent)) return [text];
      ctx.font = font(100);
      var best = null, bestCost = Infinity;
      for (var i = 1; i < words.length; i++) {
        var a = words.slice(0, i).join(' '), b = words.slice(i).join(' ');
        var cost = Math.max(ctx.measureText(a).width, ctx.measureText(b).width);
        if (cost < bestCost) { bestCost = cost; best = [a, b]; }
      }
      return best;
    }
    function drawHalf() {
      var topCenter = mm((NT.TOP_ROW_TOP + NT.TOP_ROW_BOTTOM) / 2);
      var typeW = drawText(tag.t, mm(NT.LEFT), topCenter, mm(36), mm(7), mm(4), '#000', 'left', ol);
      var addrLeft = mm(NT.LEFT) + typeW + mm(3);
      var addrRight = mm(NT.RIGHT), addrText = tag.a;
      var fl = extractFloor(tag.a);
      if (fl) {
        // 층수는 주소 줄에서 빼서 오른쪽 끝에 큰 둥근 상자로 따로 그린다
        var rowH = mm(NT.TOP_ROW_BOTTOM - NT.TOP_ROW_TOP);
        ctx.font = font(rowH * 0.78);
        var bw = ctx.measureText(fl.text).width + mm(3.2), bx = mm(NT.RIGHT) - bw, by = topCenter - rowH / 2;
        var lw = mm(0.5), r = rowH * 0.3;
        ctx.strokeStyle = '#000'; ctx.lineWidth = lw; ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(bx + r, by + lw / 2);
        ctx.arcTo(bx + bw - lw / 2, by + lw / 2, bx + bw - lw / 2, by + rowH - lw / 2, r);
        ctx.arcTo(bx + bw - lw / 2, by + rowH - lw / 2, bx + lw / 2, by + rowH - lw / 2, r);
        ctx.arcTo(bx + lw / 2, by + rowH - lw / 2, bx + lw / 2, by + lw / 2, r);
        ctx.arcTo(bx + lw / 2, by + lw / 2, bx + bw - lw / 2, by + lw / 2, r);
        ctx.closePath(); ctx.stroke();
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        paintText(fl.text, bx + bw / 2, topCenter, '#000', ol);
        addrRight = bx - mm(2);
        addrText = fl.rest;
      }
      drawText(addrText, addrRight, topCenter, addrRight - addrLeft, mm(4.2), mm(2.6), '#000', 'right');
      ctx.fillStyle = '#000';
      ctx.fillRect(0, mm(NT.RULE_TOP), W, mm(NT.RULE_BOTTOM - NT.RULE_TOP));

      var top = mm(NT.MAIN_TOP), bottom = mm(NT.MAIN_BOTTOM), mainH = bottom - top;
      var nameLeft = mm(NT.LEFT);
      if (tag.n) {
        var pad = mm(1.5);
        var fit = fitFill(tag.n, mm(NT.NUMBER_BOX_MAX) - pad * 2, mainH * 0.86);
        var boxRight = mm(NT.LEFT) + fit.width + pad * 2;
        if (ol) {
          ctx.strokeStyle = '#000';
          ctx.lineWidth = OUTLINE;
          ctx.strokeRect(mm(NT.LEFT) + OUTLINE / 2, top + OUTLINE / 2, boxRight - mm(NT.LEFT) - OUTLINE, mainH - OUTLINE);
          drawFilled(tag.n, fit, (mm(NT.LEFT) + boxRight) / 2, top, bottom, '#000', true);
        } else {
          ctx.fillStyle = '#000';
          ctx.fillRect(mm(NT.LEFT), top, boxRight - mm(NT.LEFT), mainH);
          drawFilled(tag.n, fit, (mm(NT.LEFT) + boxRight) / 2, top, bottom, '#fff', false);
        }
        nameLeft = boxRight + mm(1.5);
      }
      if (tag.m) {
        var nameW = mm(NT.RIGHT) - nameLeft;
        var nameLines = splitNameLines(tag.m);
        if (nameLines.length === 2) {
          // 약칭이 두 단어 이상이면 두 줄로 나눠 각 줄을 크게 채운다(예: 박승철 / 범계점)
          var midY = top + mainH / 2, lineH = mainH * 0.45;
          drawFilled(nameLines[0], fitFill(nameLines[0], nameW, lineH, true, 1.5), nameLeft + nameW / 2, top, midY, '#000', ol);
          drawFilled(nameLines[1], fitFill(nameLines[1], nameW, lineH, true, 1.5), nameLeft + nameW / 2, midY, bottom, '#000', ol);
        } else {
          drawFilled(tag.m, fitFill(tag.m, nameW, mainH * 0.96, true), nameLeft + nameW / 2, top, bottom, '#000', ol);
        }
      }
      drawText(tag.s, mm(50), mm(NT.TRADE_CENTER), mm(NT.RIGHT - NT.LEFT), mm(2.4), mm(2), '#000', 'center');
    }

    drawHalf();
    if (ol) drawText('출력 후 유성사인펜으로 덧대주세요', mm(50), mm(3.6), mm(NT.RIGHT - NT.LEFT), mm(4), mm(2.5), '#000', 'center');
    ctx.save();
    ctx.translate(W, W);
    ctx.rotate(Math.PI);
    drawHalf();
    ctx.restore();

    ctx.strokeStyle = '#000';
    ctx.lineWidth = mm(0.5);
    ctx.setLineDash([mm(2.5), mm(1.5)]);
    ctx.beginPath();
    ctx.moveTo(0, mm(NT.HALF));
    ctx.lineTo(W, mm(NT.HALF));
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function currentNameTag() {
    return { n: ntCompanyNo, m: ntShort.value.trim(), t: ntType.value.trim(), a: ntAddr.value.trim(), s: ntTrade.value.trim() };
  }
  function redrawNameTag() {
    var tag = currentNameTag();
    tag.o = ntOutline;
    drawNameTag(ntCanvas, tag);
  }
  function setNtPrintEnabled(on) { ntPrint1.disabled = !on; ntPrint2.disabled = !on; }

  function openNameTag() {
    ntModal.classList.add('show');
    ntBox.classList.remove('nt-loaded');
    ntNo.value = '';
    ntCompanyNo = '';
    setNtPrintEnabled(false);
    ntMsg.textContent = t('ntHint');
    ntNo.focus();
  }

  function loadNameTag() {
    var no = ntNo.value.trim();
    if (!no) return;
    setNtPrintEnabled(false);
    ntBox.classList.remove('nt-loaded');
    ntMsg.textContent = t('ntLoading');
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, FETCH_TIMEOUT_MS);
    fetch(NAME_TAG_URL + encodeURIComponent(no), { signal: controller.signal })
      .then(function (r) { return r.json().catch(function () { return null; }); })
      .then(function (data) {
        if (!data || !data.ok) { ntMsg.textContent = (data && data.error) || t('ntFail'); return; }
        if (!data.found) { ntMsg.textContent = t(data.inactive ? 'ntInactive' : 'ntNotFound', { n: no }); return; }
        ntCompanyNo = data.company_no;
        ntType.value = data.company_type || '';
        ntAddr.value = data.address || '';
        ntShort.value = data.company_name || '';
        ntTrade.value = data.trade_name || '';
        ntBox.classList.add('nt-loaded');
        redrawNameTag();
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(redrawNameTag);
        setNtPrintEnabled(true);
        ntMsg.textContent = data.address ? t('ntReady') : t('ntNoAddr');
      })
      .catch(function () { ntMsg.textContent = t('ntNet'); })
      .then(function () { clearTimeout(timer); });
  }

  // 라벨 출력 앱(yuseongprint://) 호출 — 포장기록 label.js openPrinterAppForNameTag 와 같은 방식
  function printNameTag(outline) {
    if (!ntCompanyNo) return;
    var tag = currentNameTag();
    if (outline) tag.o = 1;
    var obj = { kind: 'nametag', printJobId: (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : 'job-' + Date.now() + '-' + Math.random().toString(16).slice(2) };
    Object.keys(tag).forEach(function (k) { obj[k] = tag[k]; });
    var bytes = new TextEncoder().encode(JSON.stringify(obj));
    var binary = '';
    bytes.forEach(function (b) { binary += String.fromCharCode(b); });
    var payload = btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    // PC(윈도우)에서는 출력 앱을 부를 수 없으므로 100x100mm 그림을 브라우저 인쇄로 보낸다(TSC TTP-247 등 PC에 연결된 라벨 프린터)
    if (!/Android/i.test(navigator.userAgent)) {
      tag.o = !!outline;
      var fontsReady = document.fonts ? document.fonts.ready : Promise.resolve();
      fontsReady.then(function () {
        drawNameTag(ntCanvas, tag);
        var image = $('printNameTagImg');
        image.src = ntCanvas.toDataURL('image/png');
        return image.decode();
      }).then(function () {
        doPrint('printing-name-tag', function () { ntOutline = !!outline; redrawNameTag(); });
      });
      return;
    }
    var fallback = encodeURIComponent('https://yuseong-packing-production.up.railway.app/label-app-guide');
    window.location.href = 'intent://print?payload=' + payload +
      '#Intent;scheme=yuseongprint;package=kr.co.yuseong.labelprinter;S.browser_fallback_url=' + fallback + ';end';
  }

  [[ntPrint1, false], [ntPrint2, true]].forEach(function (p) {
    ['pointerenter', 'pointerdown', 'focus'].forEach(function (ev) {
      p[0].addEventListener(ev, function () { if (ntOutline !== p[1]) { ntOutline = p[1]; redrawNameTag(); } });
    });
    p[0].addEventListener('click', function () { printNameTag(p[1]); });
  });
  [ntType, ntAddr, ntShort, ntTrade].forEach(function (inp) { inp.addEventListener('input', redrawNameTag); });
  $('btnNameTag').addEventListener('click', openNameTag);
  $('ntClose').addEventListener('click', function () { ntModal.classList.remove('show'); });
  $('ntForm').addEventListener('submit', function (e) { e.preventDefault(); loadNameTag(); });

  init();
})();
</script>
</body>
