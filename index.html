<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>유성클리닝 현황지 출력</title>
<style>
  :root {
    --navy: #1a3a5c;
    --blue: #3b82f6;
    --blue-dark: #2563eb;
    --border: #e2e8f0;
    --bg: #f7f8fa;
    --text: #1e293b;
    --text-sub: #64748b;
    --green-bg: #ecfdf5;
    --green-border: #a7f3d0;
    --green-text: #047857;
    --red: #ef4444;
    --green-dot: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 40px;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 16px;
  }

  /* Header */
  header {
    background: var(--navy);
    color: #fff;
    padding: 18px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .header-inner {
    max-width: 720px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 700;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    background: rgba(255,255,255,0.1);
    padding: 5px 10px;
    border-radius: 999px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--red);
  }
  .dot.connected { background: var(--green-dot); }
  .gear-btn {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 6px;
    line-height: 1;
  }
  .gear-btn:hover { background: rgba(255,255,255,0.15); }

  /* Banner */
  .banner {
    margin-top: 16px;
    background: #fffbeb;
    border: 1px solid #fde68a;
    color: #92400e;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .banner.show { display: flex; }
  .banner button {
    background: #92400e;
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }

  /* Date section */
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    margin-top: 16px;
  }
  .date-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }
  .date-display {
    font-size: 17px;
    font-weight: 700;
    color: var(--navy);
  }
  .date-actions {
    display: flex;
    gap: 8px;
  }
  .btn-sm {
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
  }
  .btn-sm:hover { background: #f1f5f9; }
  .date-picker-row {
    margin-top: 10px;
    display: none;
  }
  .date-picker-row.show { display: block; }
  .date-picker-row input[type="date"] {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 14px;
  }

  /* Menu grid */
  .menu-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-sub);
    margin: 20px 0 10px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .menu-btn {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 12px;
    text-align: left;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: background 0.15s, transform 0.05s;
    min-height: 78px;
  }
  .menu-btn:hover:not(:disabled) { background: #f1f5f9; }
  .menu-btn:active:not(:disabled) { transform: scale(0.98); }
  .menu-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .menu-btn .name {
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
  }
  .menu-btn .desc {
    font-size: 12px;
    color: var(--text-sub);
  }
  .menu-btn.primary {
    background: var(--blue);
    border-color: var(--blue);
    grid-column: 1 / span 2;
  }
  .menu-btn.primary:hover:not(:disabled) { background: var(--blue-dark); }
  .menu-btn.primary .name { color: #fff; }
  .menu-btn.primary .desc { color: rgba(255,255,255,0.85); }

  /* Spinner in button */
  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(0,0,0,0.15);
    border-top-color: var(--navy);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
  }
  .menu-btn.primary .spinner {
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Progress */
  .progress-box {
    margin-top: 16px;
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 12px;
    padding: 14px 16px;
    display: none;
    align-items: center;
    gap: 12px;
    font-size: 14px;
    color: #1e40af;
  }
  .progress-box.show { display: flex; }
  .progress-box .spinner {
    border-color: rgba(30,64,175,0.2);
    border-top-color: #1e40af;
    width: 18px;
    height: 18px;
  }

  /* Error box */
  .error-box {
    margin-top: 16px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 12px;
    padding: 14px 16px;
    display: none;
    font-size: 14px;
    color: #b91c1c;
  }
  .error-box.show { display: block; }

  /* Result */
  .result-box {
    margin-top: 16px;
    background: var(--green-bg);
    border: 1px solid var(--green-border);
    border-radius: 12px;
    padding: 16px;
    display: none;
  }
  .result-box.show { display: block; }
  .result-box .title {
    font-weight: 700;
    color: var(--green-text);
    font-size: 14px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .link-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    border: 1px solid var(--green-border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 13px;
    gap: 10px;
  }
  .link-item .fname {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
  }
  .link-item a {
    background: var(--navy);
    color: #fff;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    white-space: nowrap;
  }
  .link-item a:hover { opacity: 0.9; }
  .more-toggle {
    text-align: center;
    font-size: 13px;
    color: var(--green-text);
    cursor: pointer;
    padding: 6px;
    font-weight: 600;
  }

  /* History */
  .history-toggle {
    margin-top: 16px;
    width: 100%;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-size: 13px;
    color: var(--text-sub);
    cursor: pointer;
    text-align: center;
    font-weight: 600;
  }
  .history-toggle:hover { background: #f1f5f9; }
  .history-list {
    display: none;
    margin-top: 10px;
    gap: 8px;
    flex-direction: column;
  }
  .history-list.show { display: flex; }
  .history-item {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    color: var(--text-sub);
  }
  .history-item .h-main { color: var(--text); font-weight: 600; }
  .history-empty {
    text-align: center;
    color: var(--text-sub);
    font-size: 13px;
    padding: 10px;
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: #fff;
    border-radius: 14px;
    padding: 20px;
    width: 100%;
    max-width: 360px;
  }
  .modal h3 {
    margin: 0 0 6px;
    font-size: 16px;
    color: var(--navy);
  }
  .modal p {
    margin: 0 0 14px;
    font-size: 13px;
    color: var(--text-sub);
  }
  .modal input[type="text"], .modal input[type="url"] {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    font-size: 14px;
    margin-bottom: 14px;
  }
  .modal-actions {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
  }
  .modal-actions button {
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: #fff;
  }
  .modal-actions .confirm {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
  }
  .modal-actions .confirm:hover { background: var(--blue-dark); }
  .modal-actions .cancel:hover { background: #f1f5f9; }

  @media (max-width: 420px) {
    .menu-btn { min-height: 72px; padding: 12px 10px; }
    .menu-btn .name { font-size: 13px; }
    .menu-btn .desc { font-size: 11px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>유성클리닝 현황지 출력</h1>
    <div class="header-right">
      <div class="status-pill">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">연결 안됨</span>
      </div>
      <button class="gear-btn" id="settingsBtn" title="설정" aria-label="설정">⚙</button>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="banner" id="setupBanner">
    <span>GAS Web App URL이 설정되지 않았어요. 설정 아이콘을 눌러 URL을 입력해주세요.</span>
    <button id="bannerSettingsBtn">설정하기</button>
  </div>

  <div class="card">
    <div class="date-row">
      <div class="date-display" id="dateDisplay">-</div>
      <div class="date-actions">
        <button class="btn-sm" id="todayBtn">오늘</button>
        <button class="btn-sm" id="changeDateBtn">날짜 변경</button>
      </div>
    </div>
    <div class="date-picker-row" id="datePickerRow">
      <input type="date" id="datePicker">
    </div>
  </div>

  <div class="menu-title">출력 메뉴</div>
  <div class="grid" id="menuGrid">
    <button class="menu-btn primary" data-action="exportTodayPackage">
      <span class="name">오늘 출력 패키지 ★</span>
      <span class="desc">마감자+포장+기사별 한번에</span>
    </button>
    <button class="menu-btn" data-action="exportCloserByDate">
      <span class="name">마감자 출력</span>
      <span class="desc">전체 현황지+주소지</span>
    </button>
    <button class="menu-btn" data-action="exportByDateDriversOnly">
      <span class="name">기사별 출력</span>
      <span class="desc">코스별 현황지+주소지</span>
    </button>
    <button class="menu-btn" data-action="exportPackingByDate">
      <span class="name">포장담당자 출력</span>
      <span class="desc">포장 작업 지시서</span>
    </button>
    <button class="menu-btn" data-action="exportByWeek" data-needs="week">
      <span class="name">주차 출력</span>
      <span class="desc">화~일 6일치 일괄</span>
    </button>
    <button class="menu-btn" data-action="exportTestByJ1" data-needs="course">
      <span class="name">테스트 출력</span>
      <span class="desc">코스 하나만 선택 출력</span>
    </button>
  </div>

  <div class="progress-box" id="progressBox">
    <span class="spinner"></span>
    <span id="progressText">출력 중... (1~3분 소요)</span>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="result-box" id="resultBox">
    <div class="title">✅ 출력 완료</div>
    <div id="linkList"></div>
    <div class="more-toggle" id="moreToggle" style="display:none;"></div>
  </div>

  <button class="history-toggle" id="historyToggle">출력 기록 보기</button>
  <div class="history-list" id="historyList"></div>

</div>

<!-- Week modal -->
<div class="modal-overlay" id="weekModalOverlay">
  <div class="modal">
    <h3>주차 출력</h3>
    <p>출력할 주차 번호를 입력하세요 (예: 32)</p>
    <input type="text" id="weekInput" placeholder="예: 32" inputmode="numeric">
    <div class="modal-actions">
      <button class="cancel" data-close="weekModalOverlay">취소</button>
      <button class="confirm" id="weekConfirmBtn">확인</button>
    </div>
  </div>
</div>

<!-- Course modal -->
<div class="modal-overlay" id="courseModalOverlay">
  <div class="modal">
    <h3>테스트 출력</h3>
    <p>출력할 코스명을 입력하세요 (예: B, C, D, Z)</p>
    <input type="text" id="courseInput" placeholder="예: B">
    <div class="modal-actions">
      <button class="cancel" data-close="courseModalOverlay">취소</button>
      <button class="confirm" id="courseConfirmBtn">확인</button>
    </div>
  </div>
</div>

<!-- Settings modal -->
<div class="modal-overlay" id="settingsModalOverlay">
  <div class="modal">
    <h3>GAS Web App URL 설정</h3>
    <p>Google Apps Script Web App 배포 URL을 입력하세요.</p>
    <input type="url" id="gasUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
    <div class="modal-actions">
      <button class="cancel" data-close="settingsModalOverlay">취소</button>
      <button class="confirm" id="gasUrlConfirmBtn">저장</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var STORAGE_KEYS = {
    gasUrl: 'ysc_gas_url',
    history: 'ysc_print_history'
  };
  var DEFAULT_URL_PLACEHOLDER = '여기에_입력';
  var DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbxJqi62_b869ZWCBLgO_YzrZFBT2C2TnGWpmmgTtD2vh0zTYeA-UfHkHSo6gGfU1591/exec';
  var FETCH_TIMEOUT_MS = 300000; // 5 minutes

  var MENU_LABELS = {
    exportTodayPackage: '오늘 출력 패키지',
    exportCloserByDate: '마감자 출력',
    exportByDateDriversOnly: '기사별 출력',
    exportPackingByDate: '포장담당자 출력',
    exportByWeek: '주차 출력',
    exportTestByJ1: '테스트 출력'
  };

  var state = {
    selectedDate: new Date(),
    isRunning: false
  };

  // ---------- DOM refs ----------
  var statusDot = document.getElementById('statusDot');
  var statusText = document.getElementById('statusText');
  var setupBanner = document.getElementById('setupBanner');
  var bannerSettingsBtn = document.getElementById('bannerSettingsBtn');
  var settingsBtn = document.getElementById('settingsBtn');

  var dateDisplay = document.getElementById('dateDisplay');
  var todayBtn = document.getElementById('todayBtn');
  var changeDateBtn = document.getElementById('changeDateBtn');
  var datePickerRow = document.getElementById('datePickerRow');
  var datePicker = document.getElementById('datePicker');

  var menuGrid = document.getElementById('menuGrid');
  var progressBox = document.getElementById('progressBox');
  var progressText = document.getElementById('progressText');
  var errorBox = document.getElementById('errorBox');
  var resultBox = document.getElementById('resultBox');
  var linkList = document.getElementById('linkList');
  var moreToggle = document.getElementById('moreToggle');

  var historyToggle = document.getElementById('historyToggle');
  var historyList = document.getElementById('historyList');

  var weekModalOverlay = document.getElementById('weekModalOverlay');
  var weekInput = document.getElementById('weekInput');
  var weekConfirmBtn = document.getElementById('weekConfirmBtn');

  var courseModalOverlay = document.getElementById('courseModalOverlay');
  var courseInput = document.getElementById('courseInput');
  var courseConfirmBtn = document.getElementById('courseConfirmBtn');

  var settingsModalOverlay = document.getElementById('settingsModalOverlay');
  var gasUrlInput = document.getElementById('gasUrlInput');
  var gasUrlConfirmBtn = document.getElementById('gasUrlConfirmBtn');

  var allResultLinks = [];
  var resultsExpanded = false;

  // ---------- Utility ----------
  function getGasUrl() {
    return localStorage.getItem(STORAGE_KEYS.gasUrl) || DEFAULT_GAS_URL;
  }
  function setGasUrl(url) {
    localStorage.setItem(STORAGE_KEYS.gasUrl, url);
  }
  function isGasUrlConfigured() {
    var url = getGasUrl();
    return !!url && url.indexOf(DEFAULT_URL_PLACEHOLDER) === -1;
  }

  function formatDateDisplay(date) {
    var days = ['일', '월', '화', '수', '목', '금', '토'];
    var y = date.getFullYear();
    var m = date.getMonth() + 1;
    var d = date.getDate();
    var w = days[date.getDay()];
    return y + '년 ' + m + '월 ' + d + '일 ' + w + '요일';
  }
  function formatDateForGas(date) {
    var y = date.getFullYear();
    var m = String(date.getMonth() + 1).padStart(2, '0');
    var d = String(date.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + d;
  }
  function formatDateForInput(date) {
    return formatDateForGas(date);
  }

  function updateDateDisplay() {
    dateDisplay.textContent = formatDateDisplay(state.selectedDate);
    datePicker.value = formatDateForInput(state.selectedDate);
  }

  function updateConnectionStatus() {
    var configured = isGasUrlConfigured();
    if (configured) {
      statusDot.classList.add('connected');
      statusText.textContent = '연결됨';
      setupBanner.classList.remove('show');
    } else {
      statusDot.classList.remove('connected');
      statusText.textContent = '연결 안됨';
      setupBanner.classList.add('show');
    }
  }

  function showModal(overlay) {
    overlay.classList.add('show');
  }
  function hideModal(overlay) {
    overlay.classList.remove('show');
  }

  function setRunning(running, activeBtn) {
    state.isRunning = running;
    var btns = menuGrid.querySelectorAll('.menu-btn');
    btns.forEach(function (btn) {
      btn.disabled = running;
      var nameEl = btn.querySelector('.name');
      if (btn === activeBtn) {
        if (running) {
          btn.dataset.originalName = nameEl.textContent;
          nameEl.innerHTML = '<span class="spinner"></span> 처리 중...';
        } else if (btn.dataset.originalName) {
          nameEl.textContent = btn.dataset.originalName;
        }
      }
    });
    if (running) {
      progressBox.classList.add('show');
      errorBox.classList.remove('show');
      resultBox.classList.remove('show');
    } else {
      progressBox.classList.remove('show');
    }
  }

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.add('show');
    resultBox.classList.remove('show');
  }

  function showResult(links) {
    allResultLinks = links || [];
    resultsExpanded = false;
    renderResultLinks();
    resultBox.classList.add('show');
    errorBox.classList.remove('show');
  }

  function renderResultLinks() {
    linkList.innerHTML = '';
    var limit = 5;
    var toShow = resultsExpanded ? allResultLinks : allResultLinks.slice(0, limit);

    toShow.forEach(function (link) {
      var item = document.createElement('div');
      item.className = 'link-item';
      var fname = document.createElement('span');
      fname.className = 'fname';
      fname.textContent = link.fileName || '(파일명 없음)';
      var a = document.createElement('a');
      a.href = link.url || '#';
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = '열기';
      item.appendChild(fname);
      item.appendChild(a);
      linkList.appendChild(item);
    });

    if (allResultLinks.length > limit) {
      moreToggle.style.display = 'block';
      if (resultsExpanded) {
        moreToggle.textContent = '접기';
      } else {
        moreToggle.textContent = '외 ' + (allResultLinks.length - limit) + '개 · 전체 보기';
      }
    } else {
      moreToggle.style.display = 'none';
    }
  }

  moreToggle.addEventListener('click', function () {
    resultsExpanded = !resultsExpanded;
    renderResultLinks();
  });

  // ---------- History ----------
  function getHistory() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEYS.history) || '[]');
    } catch (e) {
      return [];
    }
  }
  function addHistory(entry) {
    var hist = getHistory();
    hist.unshift(entry);
    hist = hist.slice(0, 5);
    localStorage.setItem(STORAGE_KEYS.history, JSON.stringify(hist));
    renderHistory();
  }
  function renderHistory() {
    var hist = getHistory();
    historyList.innerHTML = '';
    if (hist.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'history-empty';
      empty.textContent = '출력 기록이 없습니다.';
      historyList.appendChild(empty);
      return;
    }
    hist.forEach(function (h) {
      var item = document.createElement('div');
      item.className = 'history-item';
      var left = document.createElement('span');
      left.className = 'h-main';
      left.textContent = h.date + ' · ' + h.menuName;
      var right = document.createElement('span');
      right.textContent = h.duration;
      item.appendChild(left);
      item.appendChild(right);
      historyList.appendChild(item);
    });
  }

  historyToggle.addEventListener('click', function () {
    historyList.classList.toggle('show');
    historyToggle.textContent = historyList.classList.contains('show') ? '출력 기록 접기' : '출력 기록 보기';
  });

  // ---------- GAS call ----------
  function callGAS(action, date, extra) {
    var url = getGasUrl();
    var controller = new AbortController();
    var timeoutId = setTimeout(function () { controller.abort(); }, FETCH_TIMEOUT_MS);

    return fetch(url, {
      method: 'POST',
      body: JSON.stringify({ action: action, date: date, extra: extra }),
      signal: controller.signal
    }).then(function (res) {
      clearTimeout(timeoutId);
      if (!res.ok) {
        throw new Error('HTTP ' + res.status);
      }
      return res.json();
    }).finally(function () {
      clearTimeout(timeoutId);
    });
  }

  function runAction(action, extra, activeBtn) {
    if (!isGasUrlConfigured()) {
      showModal(settingsModalOverlay);
      return;
    }
    if (state.isRunning) return;

    var dateStr = formatDateForGas(state.selectedDate);
    var startTime = Date.now();
    setRunning(true, activeBtn);

    callGAS(action, dateStr, extra)
      .then(function (result) {
        setRunning(false, activeBtn);
        var elapsedSec = Math.round((Date.now() - startTime) / 1000);
        var durationStr = elapsedSec < 60
          ? elapsedSec + '초'
          : Math.floor(elapsedSec / 60) + '분 ' + (elapsedSec % 60) + '초';

        if (result && result.status === 'ok') {
          showResult(result.links || []);
          addHistory({
            date: dateStr,
            menuName: MENU_LABELS[action] || action,
            duration: durationStr
          });
          statusDot.classList.add('connected');
          statusText.textContent = '연결됨';
        } else {
          var msg = (result && result.message) ? result.message : '알 수 없는 오류가 발생했습니다.';
          showError('출력에 실패했어요. GAS 연결을 확인해주세요. (' + msg + ')');
        }
      })
      .catch(function (err) {
        setRunning(false, activeBtn);
        statusDot.classList.remove('connected');
        statusText.textContent = '연결 안됨';
        if (err && err.name === 'AbortError') {
          showError('출력 시간이 너무 오래 걸려 중단되었어요. GAS 실행 상태를 확인해주세요.');
        } else {
          showError('출력에 실패했어요. GAS 연결을 확인해주세요.');
        }
      });
  }

  // ---------- Event bindings ----------

  todayBtn.addEventListener('click', function () {
    state.selectedDate = new Date();
    updateDateDisplay();
    datePickerRow.classList.remove('show');
  });

  changeDateBtn.addEventListener('click', function () {
    datePickerRow.classList.toggle('show');
  });

  datePicker.addEventListener('change', function () {
    if (datePicker.value) {
      var parts = datePicker.value.split('-');
      state.selectedDate = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
      updateDateDisplay();
    }
  });

  var pendingBtn = null;

  menuGrid.addEventListener('click', function (e) {
    var btn = e.target.closest('.menu-btn');
    if (!btn || btn.disabled) return;
    var action = btn.dataset.action;
    var needs = btn.dataset.needs;

    if (needs === 'week') {
      pendingBtn = btn;
      weekInput.value = '';
      showModal(weekModalOverlay);
      setTimeout(function () { weekInput.focus(); }, 50);
      return;
    }
    if (needs === 'course') {
      pendingBtn = btn;
      courseInput.value = '';
      showModal(courseModalOverlay);
      setTimeout(function () { courseInput.focus(); }, 50);
      return;
    }
    runAction(action, null, btn);
  });

  weekConfirmBtn.addEventListener('click', function () {
    var val = weekInput.value.trim();
    if (!val) {
      weekInput.focus();
      return;
    }
    hideModal(weekModalOverlay);
    runAction('exportByWeek', val, pendingBtn);
  });
  weekInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') weekConfirmBtn.click();
  });

  courseConfirmBtn.addEventListener('click', function () {
    var val = courseInput.value.trim();
    if (!val) {
      courseInput.focus();
      return;
    }
    hideModal(courseModalOverlay);
    runAction('exportTestByJ1', val, pendingBtn);
  });
  courseInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') courseConfirmBtn.click();
  });

  // Settings modal
  function openSettingsModal() {
    gasUrlInput.value = isGasUrlConfigured() ? getGasUrl() : '';
    showModal(settingsModalOverlay);
    setTimeout(function () { gasUrlInput.focus(); }, 50);
  }
  settingsBtn.addEventListener('click', openSettingsModal);
  bannerSettingsBtn.addEventListener('click', openSettingsModal);

  gasUrlConfirmBtn.addEventListener('click', function () {
    var val = gasUrlInput.value.trim();
    if (!val) {
      gasUrlInput.focus();
      return;
    }
    setGasUrl(val);
    hideModal(settingsModalOverlay);
    updateConnectionStatus();
  });
  gasUrlInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') gasUrlConfirmBtn.click();
  });

  // Close modal on overlay click / cancel buttons
  document.querySelectorAll('.modal-overlay').forEach(function (overlay) {
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) hideModal(overlay);
    });
  });
  document.querySelectorAll('[data-close]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      hideModal(document.getElementById(btn.dataset.close));
    });
  });

  // ---------- Init ----------
  updateDateDisplay();
  updateConnectionStatus();
  renderHistory();

})();
</script>

</body>
</html>
