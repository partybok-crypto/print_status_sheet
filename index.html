<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유성클리닝 현황지 출력 프로그램</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1a3a5c;
    --blue: #2563eb;
    --blue-dark: #1d4ed8;
    --border: #d7dde5;
    --bg: #f1f5f9;
    --text: #1e293b;
    --text-sub: #64748b;
    --red: #dc2626;
    --green-dot: #22c55e;
    --red-dot: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-width: 1080px;
    font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  button, select, input { font-family: inherit; }

  /* ---------- 화면 레이아웃 (인쇄 시에는 .no-print 전부 숨김) ---------- */
  header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .brand { font-size: 18px; font-weight: 700; color: var(--navy); white-space: nowrap; }
  .field-group { display: flex; align-items: center; gap: 6px; }
  .field-group label { font-size: 12px; color: var(--text-sub); white-space: nowrap; }
  header select, header input[type="date"] {
    height: 40px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    background: #fff;
    color: var(--text);
  }
  .weekday-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 40px;
    height: 40px;
    padding: 0 10px;
    border-radius: 8px;
    background: var(--navy);
    color: #fff;
    font-weight: 700;
    font-size: 15px;
  }
  .btn {
    height: 40px;
    padding: 0 16px;
    border: 0;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-blue { background: var(--blue); color: #fff; }
  .btn-blue:hover:not(:disabled) { background: var(--blue-dark); }
  .btn-gray { background: #eef1f5; color: var(--text); }
  .btn-gray:hover:not(:disabled) { background: #e2e6ec; }
  .btn-outline { background: #fff; color: var(--blue); border: 1px solid var(--blue); }

  .meta-text { font-size: 12px; color: var(--text-sub); white-space: nowrap; }
  .spacer { flex: 1; }

  .status-line {
    padding: 8px 20px;
    font-size: 13px;
    color: var(--text-sub);
    background: #fff;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; }
  .status-dot.ok { background: var(--green-dot); }
  .status-dot.err { background: var(--red-dot); }

  .error-banner {
    display: none;
    margin: 10px 20px 0;
    padding: 10px 14px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: var(--red);
    border-radius: 8px;
    font-size: 14px;
    align-items: center;
    gap: 10px;
  }
  .error-banner.show { display: flex; }
  .error-banner button { margin-left: auto; }

  .tabs {
    display: flex;
    gap: 8px;
    padding: 12px 20px 0;
  }
  .tab-btn {
    height: 40px;
    padding: 0 18px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    border-radius: 8px 8px 0 0;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    border-bottom: 0;
  }
  .tab-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }

  .actions-bar {
    display: flex;
    gap: 10px;
    padding: 12px 20px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    align-items: center;
    flex-wrap: wrap;
  }

  .preview-wrap {
    padding: 20px;
    overflow-x: auto;
  }
  .preview-shell {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 4px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    padding: 14mm;
    margin: 0 auto;
  }
  .doc-status .preview-shell { width: 210mm; min-width: 210mm; }
  .doc-address .preview-shell { width: 297mm; min-width: 297mm; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-sub);
    font-size: 15px;
  }

  /* ---------- 문서 공통 표 스타일 (화면/인쇄 공용) ---------- */
  .doc-head-table { width: 100%; border-collapse: collapse; margin-bottom: 0; }
  .doc-head-table td {
    border: 1px solid #000;
    padding: 6px 10px;
    font-size: 13pt;
    vertical-align: middle;
  }
  .doc-head-table .label-cell { background: #ffe000; font-weight: 700; text-align: center; width: 60px; }
  .doc-head-table .title-cell { font-weight: 700; text-align: center; font-size: 16pt; }

  table.doc-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.doc-table thead { display: table-header-group; }
  table.doc-table th, table.doc-table td {
    border: 1px solid #000;
    padding: 6px 8px;
    text-align: center;
    overflow-wrap: break-word;
  }
  table.doc-table th { background: #f3f4f6; font-weight: 700; }
  table.doc-table tr { break-inside: avoid; page-break-inside: avoid; }

  /* 현황지 전용 */
  .status-table .col-order { width: 11%; }
  .status-table .col-companyno { width: 10%; }
  .status-table .col-nickname { width: 14%; }
  .status-table .col-biztype { width: 12%; }
  .status-table .col-bag { width: 16%; }
  .status-table .col-towel { width: 16%; }
  .status-table .col-qty { width: 9%; }
  .status-table .col-shipno { width: 12%; }

  .status-table td.col-companyno,
  .status-table td.col-nickname { font-weight: 700; font-size: 13pt; }
  .status-table td.col-shipno { font-weight: 700; font-size: 20pt; }
  .status-table td, .status-table th { font-size: 14pt; }
  .status-table td.col-qty { border: 2px solid #1d4ed8; }
  .status-table td.has-note { background: #fff59d; color: var(--red); font-weight: 700; }

  /* 주소지 전용 */
  .address-table .col-order { width: 8%; background: #f2eaff; }
  .address-table .col-companyno { width: 8%; }
  .address-table .col-nickname { width: 10%; }
  .address-table .col-address { width: 34%; text-align: left; }
  .address-table .col-method { width: 12%; }
  .address-table .col-comment { width: 20%; text-align: left; }
  .address-table .col-phone { width: 8%; }

  .address-table td, .address-table th { font-size: 12.5pt; }
  .address-table td.col-companyno,
  .address-table td.col-nickname { font-weight: 700; }
  .address-table td.col-method { color: var(--blue); font-weight: 700; }
  .address-table td.col-phone { font-weight: 700; font-size: 15pt; }
  .address-table td.col-comment {
    background: #eafbea;
    outline-offset: -2px;
  }
  .address-table td.col-comment[contenteditable="true"]:focus { outline: 2px solid var(--blue); background: #e0f2ff; }
  .address-table td.col-comment.edited { background: #fff3cd; }
  .address-table tr.missing-field { background: #fff1f1; }

  .address-footnote {
    margin-top: 10px;
    text-align: center;
    font-size: 12pt;
    font-weight: 700;
    border: 1px solid #000;
    padding: 8px;
  }

  /* ---------- 인쇄 전용 ---------- */
  @page portraitPage { size: A4 portrait; margin: 8mm; }
  @page landscapePage { size: A4 landscape; margin: 7mm; }

  @media print {
    .no-print { display: none !important; }
    body { background: #fff; }
    .preview-wrap { padding: 0; overflow: visible; }
    .preview-shell { box-shadow: none; border: 0; padding: 0; width: auto !important; min-width: 0 !important; margin: 0; }
    .doc-status, .doc-address { display: none !important; }

    body.printing-status .doc-status { display: block !important; page: portraitPage; }
    body.printing-address .doc-address { display: block !important; page: landscapePage; }

    table.doc-table, table.doc-table th, table.doc-table td,
    .doc-head-table td { color: #000 !important; }
    .status-table td.has-note { color: var(--red) !important; }
    .address-table td.col-method { color: var(--blue) !important; }

    /* 인쇄 결과는 확대/축소 없이 CSS에 지정한 실제 pt 크기 그대로 나가야 한다 */
    table.doc-table, table.doc-table * { transform: none !important; zoom: 1 !important; }
  }
</style>
</head>
<body>

<header class="no-print">
  <div class="brand">유성클리닝 | 현황지 출력 프로그램</div>

  <div class="field-group">
    <label for="datePicker">날짜</label>
    <input type="date" id="datePicker">
  </div>

  <div class="weekday-badge" id="weekdayBadge">-</div>

  <div class="field-group">
    <label for="driverSelect">기사</label>
    <select id="driverSelect"><option value="">-</option></select>
  </div>

  <div class="field-group">
    <label for="courseSelect">코스</label>
    <select id="courseSelect"><option value="">-</option></select>
  </div>

  <button class="btn btn-blue" id="btnLoad">데이터 불러오기</button>
  <button class="btn btn-gray" id="btnRefresh" title="원본 데이터 다시 불러오기">새로고침</button>

  <div class="spacer"></div>

  <span class="meta-text" id="lastFetchedText">불러온 적 없음</span>
  <button class="btn btn-outline" id="btnSettings" style="height:32px;padding:0 10px;font-size:12px;">설정</button>
</header>

<div class="status-line no-print">
  <span class="status-dot" id="statusDot"></span>
  <span id="statusText">준비됨</span>
  <span class="spacer"></span>
  <span class="meta-text" id="companyCountText"></span>
</div>

<div class="error-banner no-print" id="errorBanner">
  <span id="errorText"></span>
  <button class="btn btn-gray" id="btnRetry" style="height:30px;">재시도</button>
</div>

<div class="tabs no-print" id="tabBar">
  <button class="tab-btn active" data-tab="status">배송 현황지 (A4 세로)</button>
  <button class="tab-btn" data-tab="address">주소지 (A4 가로)</button>
</div>

<div class="actions-bar no-print">
  <button class="btn btn-blue" id="btnPrintStatus">배송 현황지 인쇄</button>
  <button class="btn btn-blue" id="btnPrintAddress">주소지 인쇄</button>
  <button class="btn btn-gray" id="btnSaveComments">배송 코멘트 저장</button>
  <span class="meta-text" id="editCountText"></span>
</div>

<div class="preview-wrap">
  <div id="emptyState" class="empty-state">날짜·코스를 선택하고 "데이터 불러오기"를 눌러주세요.</div>

  <div class="doc-status" id="docStatus" style="display:none;">
    <div class="preview-shell">
      <table class="doc-head-table">
        <tr>
          <td class="label-cell">주차</td>
          <td id="hdStatusDriver"></td>
          <td class="title-cell" colspan="2" id="hdStatusWeekday"></td>
        </tr>
        <tr>
          <td class="label-cell">&nbsp;</td>
          <td id="hdStatusDate"></td>
          <td colspan="2" style="text-align:center;font-weight:700;">세탁물 현황</td>
        </tr>
      </table>
      <table class="doc-table status-table">
        <thead>
          <tr>
            <th class="col-order">배송순서</th>
            <th class="col-companyno">업체번호</th>
            <th class="col-nickname">약칭</th>
            <th class="col-biztype">업종</th>
            <th class="col-bag">포대 배송</th>
            <th class="col-towel">수건 배송</th>
            <th class="col-qty">수거량<br>(중요!)</th>
            <th class="col-shipno">출고</th>
          </tr>
        </thead>
        <tbody id="statusTbody"></tbody>
      </table>
    </div>
  </div>

  <div class="doc-address" id="docAddress" style="display:none;">
    <div class="preview-shell">
      <table class="doc-head-table">
        <tr>
          <td class="label-cell" id="hdAddressDate" style="width:110px;"></td>
          <td class="title-cell" colspan="2">배송코스 (사용 후 폐기)</td>
        </tr>
      </table>
      <table class="doc-table address-table">
        <thead>
          <tr>
            <th class="col-order">배송순서</th>
            <th class="col-companyno">업체번호</th>
            <th class="col-nickname">약칭</th>
            <th class="col-address">배송 주소</th>
            <th class="col-method">수거방식</th>
            <th class="col-comment">배송 코멘트</th>
            <th class="col-phone">거래처 번호</th>
          </tr>
        </thead>
        <tbody id="addressTbody"></tbody>
      </table>
      <div class="address-footnote">【메모란】 위치 꿀팁(주차/비번 등) · 배송코멘트를 남겨주시면 차주 현황지에 반영됩니다.</div>
    </div>
  </div>
</div>

<!-- 설정 모달 -->
<div id="settingsOverlay" class="no-print" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); align-items:center; justify-content:center; z-index:50;">
  <div style="background:#fff; border-radius:12px; padding:20px; width:480px; max-width:92vw;">
    <div style="font-weight:700; font-size:16px; margin-bottom:10px;">GAS 배포 URL 설정</div>
    <input id="gasUrlInput" type="text" style="width:100%; height:40px; padding:0 10px; border:1px solid var(--border); border-radius:8px; font-size:14px;">
    <div style="display:flex; gap:8px; margin-top:14px; justify-content:flex-end;">
      <button class="btn btn-gray" id="btnSettingsCancel">취소</button>
      <button class="btn btn-blue" id="btnSettingsSave">저장</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ---------- 설정 ----------
  var STORAGE_KEYS = { gasUrl: 'ysc_gas_url_v2' };
  var DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbx4L6ZiXjjKkQPo1vcGxp5iuP7MktAo30gn-fCRAQPCdrRb1VQ_yijQ6hvS21NoIrvM/exec';
  var FETCH_TIMEOUT_MS = 30000; // 순수 JSON 조회이므로 몇 초면 끝남 — 30초면 충분히 넉넉함

  var WEEKDAY_FROM_JS_DAY = ['일', '월', '화', '수', '목', '금', '토'];
  var WEEKDAYS = ['월', '화', '수', '목', '금', '토', '일'];

  // 업종별 색상 (요청사항: 미용실=주황, 헬스장=연주황/빨강, 병원=파랑, 그 외 구분)
  var BIZ_TYPE_STYLE = {
    '미용실':   { bg: '#ffb74d', color: '#4a2600' },
    '헬스장':   { bg: '#ffe0b2', color: '#c62828' },
    '병원':     { bg: '#90caf9', color: '#0d47a1' },
    '사우나':   { bg: '#81d4fa', color: '#01579b' },
    '모텔':     { bg: '#ce93d8', color: '#4a148c' },
    '마사지':   { bg: '#f48fb1', color: '#880e4f' },
    '만화책방': { bg: '#212121', color: '#ff4081' }
  };
  function bizTypeStyle(t) {
    return BIZ_TYPE_STYLE[t] || { bg: '#e0e0e0', color: '#333' };
  }

  // ---------- 상태 ----------
  var state = {
    weekday: WEEKDAY_FROM_JS_DAY[new Date().getDay()],
    dayData: null,       // 서버에서 받은 그날 전체 데이터 (요일 하나 = 1회 조회, 이후 재사용)
    selectedCourse: '',
    activeTab: 'status',
    isLoading: false,
    isPrinting: false,
    pendingEdits: {},    // { row: newComment }
    lastFetchedAt: null
  };

  // ---------- DOM refs ----------
  var datePicker = document.getElementById('datePicker');
  var weekdayBadge = document.getElementById('weekdayBadge');
  var driverSelect = document.getElementById('driverSelect');
  var courseSelect = document.getElementById('courseSelect');
  var btnLoad = document.getElementById('btnLoad');
  var btnRefresh = document.getElementById('btnRefresh');
  var lastFetchedText = document.getElementById('lastFetchedText');
  var statusDot = document.getElementById('statusDot');
  var statusText = document.getElementById('statusText');
  var companyCountText = document.getElementById('companyCountText');
  var errorBanner = document.getElementById('errorBanner');
  var errorText = document.getElementById('errorText');
  var btnRetry = document.getElementById('btnRetry');
  var tabBar = document.getElementById('tabBar');
  var btnPrintStatus = document.getElementById('btnPrintStatus');
  var btnPrintAddress = document.getElementById('btnPrintAddress');
  var btnSaveComments = document.getElementById('btnSaveComments');
  var editCountText = document.getElementById('editCountText');
  var emptyState = document.getElementById('emptyState');
  var docStatus = document.getElementById('docStatus');
  var docAddress = document.getElementById('docAddress');
  var statusTbody = document.getElementById('statusTbody');
  var addressTbody = document.getElementById('addressTbody');
  var hdStatusDriver = document.getElementById('hdStatusDriver');
  var hdStatusWeekday = document.getElementById('hdStatusWeekday');
  var hdStatusDate = document.getElementById('hdStatusDate');
  var hdAddressDate = document.getElementById('hdAddressDate');
  var settingsOverlay = document.getElementById('settingsOverlay');
  var gasUrlInput = document.getElementById('gasUrlInput');
  var btnSettings = document.getElementById('btnSettings');
  var btnSettingsCancel = document.getElementById('btnSettingsCancel');
  var btnSettingsSave = document.getElementById('btnSettingsSave');

  // ---------- 설정 저장소 ----------
  function getGasUrl() {
    return localStorage.getItem(STORAGE_KEYS.gasUrl) || DEFAULT_GAS_URL;
  }
  function setGasUrl(url) {
    localStorage.setItem(STORAGE_KEYS.gasUrl, url);
  }

  btnSettings.addEventListener('click', function () {
    gasUrlInput.value = getGasUrl();
    settingsOverlay.style.display = 'flex';
  });
  btnSettingsCancel.addEventListener('click', function () { settingsOverlay.style.display = 'none'; });
  btnSettingsSave.addEventListener('click', function () {
    var v = gasUrlInput.value.trim();
    if (v) setGasUrl(v);
    settingsOverlay.style.display = 'none';
  });

  // ---------- 날짜/요일 ----------
  function isoDate(d) {
    var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  function weekdayFromDate(d) { return WEEKDAY_FROM_JS_DAY[d.getDay()]; }

  function initDatePicker() {
    var today = new Date();
    datePicker.value = isoDate(today);
    state.weekday = weekdayFromDate(today);
    weekdayBadge.textContent = state.weekday;
  }

  datePicker.addEventListener('change', function () {
    var d = new Date(datePicker.value + 'T00:00:00');
    if (isNaN(d.getTime())) return;
    state.weekday = weekdayFromDate(d);
    weekdayBadge.textContent = state.weekday;
  });

  // ---------- GAS 호출 ----------
  function callGAS(payload) {
    var url = getGasUrl();
    var controller = new AbortController();
    var timeoutId = setTimeout(function () { controller.abort(); }, FETCH_TIMEOUT_MS);

    return fetch(url, {
      method: 'POST',
      body: JSON.stringify(payload),
      signal: controller.signal
    }).then(function (res) {
      clearTimeout(timeoutId);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).finally(function () { clearTimeout(timeoutId); });
  }

  // ---------- 상태 표시 ----------
  function setStatus(kind, text) {
    statusDot.className = 'status-dot' + (kind === 'ok' ? ' ok' : kind === 'err' ? ' err' : '');
    statusText.textContent = text;
  }
  function showError(msg) {
    errorText.textContent = msg;
    errorBanner.classList.add('show');
  }
  function hideError() { errorBanner.classList.remove('show'); }

  // ---------- 데이터 불러오기 ----------
  function hasUnsavedEdits() { return Object.keys(state.pendingEdits).length > 0; }

  function confirmDiscardEditsIfNeeded() {
    if (!hasUnsavedEdits()) return true;
    return confirm('저장하지 않은 배송 코멘트 수정 내용이 있습니다. 다시 불러오면 사라집니다. 계속할까요?');
  }

  function loadData(force) {
    if (state.isLoading) return;
    if (!force && !confirmDiscardEditsIfNeeded()) return;

    state.isLoading = true;
    btnLoad.disabled = true;
    btnRefresh.disabled = true;
    setStatus('', '불러오는 중...');
    hideError();

    var startedAt = Date.now();

    callGAS({ action: 'getData', weekday: state.weekday })
      .then(function (data) {
        if (!data || !data.success) {
          throw new Error((data && data.message) || '데이터를 불러오지 못했습니다.');
        }
        state.dayData = data;
        state.pendingEdits = {};
        state.lastFetchedAt = new Date();

        rebuildCourseAndDriverSelects();
        renderDocuments();

        var elapsedSec = ((Date.now() - startedAt) / 1000).toFixed(1);
        setStatus('ok', '데이터 로드 완료 (' + elapsedSec + '초)');
        lastFetchedText.textContent = '마지막 불러온 시간: ' + state.lastFetchedAt.toLocaleTimeString('ko-KR');
        companyCountText.textContent = '불러온 업체 수: ' + data.count + '개';
      })
      .catch(function (err) {
        setStatus('err', '불러오기 실패');
        var msg = (err && err.name === 'AbortError')
          ? '요청이 너무 오래 걸려 중단됐어요. 다시 시도해주세요.'
          : (err && err.message) ? err.message : 'GAS 연결을 확인해주세요.';
        showError(msg);
        // 실패 시 기존 화면 데이터는 그대로 유지 (덮어쓰지 않음)
      })
      .finally(function () {
        state.isLoading = false;
        btnLoad.disabled = false;
        btnRefresh.disabled = false;
      });
  }

  btnLoad.addEventListener('click', function () { loadData(false); });
  btnRefresh.addEventListener('click', function () { loadData(true); });
  btnRetry.addEventListener('click', function () { loadData(true); });

  // ---------- 코스/기사 선택 ----------
  function rebuildCourseAndDriverSelects() {
    var data = state.dayData;
    if (!data) return;

    var prevCourse = state.selectedCourse;

    courseSelect.innerHTML = '';
    driverSelect.innerHTML = '';

    var driverSeen = {};

    data.courses.forEach(function (c) {
      var opt = document.createElement('option');
      opt.value = c;
      opt.textContent = c + '코스';
      courseSelect.appendChild(opt);

      var driver = data.drivers[c] || '';
      var key = driver || ('__' + c);
      if (!driverSeen[key]) {
        driverSeen[key] = true;
        var dOpt = document.createElement('option');
        dOpt.value = c; // 기사 선택도 결국 해당 코스를 선택하는 것과 동일
        dOpt.textContent = driver ? (driver + ' (' + c + '코스)') : (c + '코스');
        driverSelect.appendChild(dOpt);
      }
    });

    var courseToUse = data.courses.indexOf(prevCourse) !== -1 ? prevCourse : (data.courses[0] || '');
    state.selectedCourse = courseToUse;
    courseSelect.value = courseToUse;
    driverSelect.value = courseToUse;
  }

  courseSelect.addEventListener('change', function () {
    if (!confirmDiscardEditsIfNeeded()) { courseSelect.value = state.selectedCourse; return; }
    state.selectedCourse = courseSelect.value;
    driverSelect.value = courseSelect.value;
    state.pendingEdits = {};
    renderDocuments();
  });

  driverSelect.addEventListener('change', function () {
    if (!confirmDiscardEditsIfNeeded()) { driverSelect.value = state.selectedCourse; return; }
    state.selectedCourse = driverSelect.value;
    courseSelect.value = driverSelect.value;
    state.pendingEdits = {};
    renderDocuments();
  });

  // ---------- 탭 ----------
  tabBar.addEventListener('click', function (e) {
    var btn = e.target.closest('.tab-btn');
    if (!btn) return;
    state.activeTab = btn.dataset.tab;
    Array.prototype.forEach.call(tabBar.querySelectorAll('.tab-btn'), function (b) {
      b.classList.toggle('active', b === btn);
    });
    updateTabVisibility();
  });

  function updateTabVisibility() {
    docStatus.style.display = state.activeTab === 'status' ? 'block' : 'none';
    docAddress.style.display = state.activeTab === 'address' ? 'block' : 'none';
  }

  // ---------- 렌더링 (XSS 방지: textContent만 사용, innerHTML로 데이터 삽입 안 함) ----------
  function td(text, className) {
    var cell = document.createElement('td');
    if (className) cell.className = className;
    cell.textContent = text === undefined || text === null ? '' : String(text);
    return cell;
  }

  function renderDocuments() {
    var data = state.dayData;
    if (!data) { emptyState.style.display = 'block'; docStatus.style.display = 'none'; docAddress.style.display = 'none'; return; }

    var items = data.items.filter(function (it) { return it.course === state.selectedCourse; });

    emptyState.style.display = items.length ? 'none' : 'block';
    if (!items.length) { docStatus.style.display = 'none'; docAddress.style.display = 'none'; return; }

    updateTabVisibility();

    var driverName = data.drivers[state.selectedCourse] || '';

    // 현황지 헤더
    hdStatusDriver.textContent = driverName;
    hdStatusWeekday.textContent = data.dayOfWeek + ' 세탁물 현황';
    hdStatusDate.textContent = data.requestedDate + ' (' + data.weekNumber + ')';

    // 주소지 헤더
    hdAddressDate.textContent = data.requestedDate.slice(5).replace('-', '월 ') + '일 ' + data.dayOfWeek;

    renderStatusTable(items);
    renderAddressTable(items, data.origin);
    updateEditCountText();
  }

  function renderStatusTable(items) {
    statusTbody.innerHTML = '';
    items.forEach(function (it) {
      var tr = document.createElement('tr');
      var missing = !it.nickname || !it.companyNumber;
      if (missing) tr.classList.add('missing-field');

      tr.appendChild(td(it.deliveryOrder, 'col-order'));
      tr.appendChild(td(it.companyNumber, 'col-companyno'));
      tr.appendChild(td(it.nickname, 'col-nickname'));

      var bizCell = td(it.businessType, 'col-biztype');
      var style = bizTypeStyle(it.businessType);
      bizCell.style.background = style.bg;
      bizCell.style.color = style.color;
      bizCell.style.fontWeight = '700';
      tr.appendChild(bizCell);

      var bagCell = td(it.bagDelivery, 'col-bag');
      if (it.bagDelivery) bagCell.classList.add('has-note');
      tr.appendChild(bagCell);

      var towelCell = td(it.towelDelivery, 'col-towel');
      if (it.towelDelivery) towelCell.classList.add('has-note');
      tr.appendChild(towelCell);

      tr.appendChild(td(it.collectionQuantity, 'col-qty'));
      tr.appendChild(td(it.shippingNumber, 'col-shipno'));

      statusTbody.appendChild(tr);
    });
  }

  function renderAddressTable(items, origin) {
    addressTbody.innerHTML = '';

    if (origin && (origin.name || origin.address)) {
      var originTr = document.createElement('tr');
      originTr.appendChild(td('출발', 'col-order'));
      originTr.appendChild(td('', 'col-companyno'));
      originTr.appendChild(td(origin.name || '유성(출발지)', 'col-nickname'));
      originTr.appendChild(td(origin.address, 'col-address'));
      originTr.appendChild(td('', 'col-method'));
      originTr.appendChild(td(origin.comment, 'col-comment'));
      originTr.appendChild(td('', 'col-phone'));
      addressTbody.appendChild(originTr);
    }

    items.forEach(function (it) {
      var tr = document.createElement('tr');
      var missing = !it.address;
      if (missing) tr.classList.add('missing-field');

      tr.appendChild(td(it.deliveryOrder, 'col-order'));
      tr.appendChild(td(it.companyNumber, 'col-companyno'));
      tr.appendChild(td(it.nickname, 'col-nickname'));
      tr.appendChild(td(it.address, 'col-address'));
      tr.appendChild(td(it.collectionMethod, 'col-method'));

      var commentCell = td(it.deliveryComment, 'col-comment');
      commentCell.contentEditable = 'true';
      commentCell.dataset.row = it.row;
      commentCell.addEventListener('input', function () {
        var newVal = commentCell.textContent;
        if (newVal === it.deliveryComment) {
          delete state.pendingEdits[it.row];
          commentCell.classList.remove('edited');
        } else {
          state.pendingEdits[it.row] = newVal;
          commentCell.classList.add('edited');
        }
        updateEditCountText();
      });
      tr.appendChild(commentCell);

      tr.appendChild(td(it.phone, 'col-phone'));

      addressTbody.appendChild(tr);
    });
  }

  function updateEditCountText() {
    var n = Object.keys(state.pendingEdits).length;
    editCountText.textContent = n > 0 ? ('저장 안 된 코멘트 수정: ' + n + '건') : '';
  }

  // ---------- 배송 코멘트 저장 ----------
  btnSaveComments.addEventListener('click', function () {
    var rows = Object.keys(state.pendingEdits);
    if (!rows.length) { alert('저장할 변경사항이 없습니다.'); return; }

    var updates = rows.map(function (r) { return { row: Number(r), deliveryComment: state.pendingEdits[r] }; });

    btnSaveComments.disabled = true;
    btnSaveComments.textContent = '저장 중...';

    callGAS({ action: 'saveComments', updates: updates })
      .then(function (res) {
        if (!res || !res.success) throw new Error((res && res.message) || '저장에 실패했습니다.');

        // 로컬 데이터에도 반영해서 재조회 없이 최신 상태 유지
        updates.forEach(function (u) {
          var item = state.dayData.items.find(function (it) { return it.row === u.row; });
          if (item) item.deliveryComment = u.deliveryComment;
        });
        state.pendingEdits = {};
        Array.prototype.forEach.call(addressTbody.querySelectorAll('.col-comment.edited'), function (c) {
          c.classList.remove('edited');
        });
        updateEditCountText();
        setStatus('ok', res.updated + '건 저장 완료');
      })
      .catch(function (err) {
        alert('저장 실패: ' + (err && err.message ? err.message : '알 수 없는 오류'));
      })
      .finally(function () {
        btnSaveComments.disabled = false;
        btnSaveComments.textContent = '배송 코멘트 저장';
      });
  });

  // ---------- 인쇄 ----------
  function printDoc(kind) {
    if (state.isPrinting) return;
    if (!state.dayData || !state.selectedCourse) { alert('먼저 데이터를 불러와주세요.'); return; }

    state.isPrinting = true;
    document.body.classList.add(kind === 'status' ? 'printing-status' : 'printing-address');

    var run = function () {
      window.print();
      document.body.classList.remove('printing-status', 'printing-address');
      state.isPrinting = false;
    };

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(run).catch(run);
    } else {
      run();
    }
  }

  btnPrintStatus.addEventListener('click', function () { printDoc('status'); });
  btnPrintAddress.addEventListener('click', function () { printDoc('address'); });

  // ---------- 초기화 ----------
  initDatePicker();
  updateTabVisibility();
  loadData(true);
})();
</script>
</body>
</html>
