<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유성클리닝 현황지 출력</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #16324a;
    --blue: #2563eb;
    --blue-dark: #1d4ed8;
    --blue-bg: #eef4ff;
    --border: #e2e6ec;
    --bg: #f4f6f8;
    --text: #1e293b;
    --text-sub: #64748b;
    --red: #dc2626;
    --green: #16a34a;
    --left-w: 420px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg); color: var(--text);
  }
  button, select, input { font-family: inherit; }
  button { cursor: pointer; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  /* ================= 전체 셸 ================= */
  .field-shell { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .app-header {
    flex: 0 0 64px; height: 64px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 26px; background: #fff; border-bottom: 1px solid var(--border);
  }
  .app-header-left { font-size: 22px; font-weight: 900; color: var(--navy); letter-spacing: -.2px; }
  .app-header-right { display: flex; align-items: center; gap: 18px; }
  .conn-text { font-size: 14.5px; font-weight: 700; }
  .conn-text.ok { color: var(--green); }
  .conn-text.err { color: var(--red); }
  .conn-text.pending { color: var(--text-sub); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border);
    background: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { background: #f1f5f9; }

  .field-body { flex: 1; min-height: 0; display: flex; }

  /* ================= 왼쪽 패널 ================= */
  .left-panel {
    flex: 0 0 var(--left-w); width: var(--left-w); background: #fff; border-right: 1px solid var(--border);
    padding: 7px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px;
  }
  @media (max-width: 1100px) { :root { --left-w: 360px; } }

  .section-label { font-size: 12px; font-weight: 800; color: var(--text-sub); margin-bottom: 4px; letter-spacing: .2px; }

  .inline-error {
    display: none; align-items: center; gap: 10px; background: #fef2f2; border: 1px solid #fecaca;
    color: var(--red); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; font-weight: 600; margin-bottom: 4px;
  }
  .inline-error.show { display: flex; }
  .inline-error button { margin-left: auto; height: 30px; padding: 0 10px; border-radius: 7px; border: 1px solid #fecaca; background: #fff; color: var(--red); font-weight: 700; font-size: 12.5px; }

  .date-box {
    width: 100%; min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 16px;
    border: 1.5px solid var(--border); border-radius: 12px; background: #fff; font-size: 17px; font-weight: 800;
    color: var(--navy); text-align: left;
  }
  .date-box:hover { border-color: var(--blue); }
  .date-box .ic { font-size: 18px; }
  .date-sub-row { display: flex; gap: 8px; margin-top: 4px; }
  .sub-btn {
    flex: 1; min-height: 34px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg);
    font-size: 13.5px; font-weight: 700; color: var(--navy); display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .sub-btn:hover:not(:disabled) { background: #e9edf2; }
  .sub-btn:disabled { opacity: .5; cursor: not-allowed; }

  .course-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .course-btn {
    min-height: 34px; border-radius: 10px; border: 1.5px solid var(--border); background: #fff;
    font-size: 14.5px; font-weight: 800; color: var(--navy); white-space: nowrap;
  }
  .course-btn:hover { border-color: var(--blue); }
  .course-btn.selected { background: var(--blue); border-color: var(--blue); color: #fff; }

  .info-card {
    margin-top: 5px; padding: 6px 14px; background: var(--blue-bg); border: 1px solid #cfe0ff; border-radius: 10px;
    font-size: 13.5px; font-weight: 700; color: var(--navy); display: flex; align-items: center; gap: 8px;
  }

  /* 자주 사용하는 출력 — 큰 주요 버튼 2개 */
  .primary-doc-list { display: flex; flex-direction: column; gap: 8px; }
  .primary-doc-btn {
    width: 100%; min-height: 64px; border: 1.5px solid var(--blue); border-radius: 14px; background: #fff;
    color: var(--blue); text-align: left; padding: 8px 16px; display: flex; flex-direction: column;
    justify-content: center; gap: 2px;
  }
  .primary-doc-btn .pdb-title { font-size: 17.5px; font-weight: 800; color: inherit; }
  .primary-doc-btn .pdb-sub { font-size: 12.5px; font-weight: 600; color: var(--text-sub); }
  .primary-doc-btn:hover { background: var(--blue-bg); }
  .primary-doc-btn.selected { background: var(--blue-dark); border-color: var(--blue-dark); color: #fff; }
  .primary-doc-btn.selected .pdb-sub { color: rgba(255,255,255,.85); }
  .primary-doc-btn.selected:hover { background: var(--blue-dark); }
  /* 출력본과 달라진 내용이 있을 때 눈에 띄게 */
  .primary-doc-btn.has-changes { border-color: #ea580c; background: #fff7ed; color: #c2410c; }
  .primary-doc-btn.has-changes .pdb-sub { color: #9a3412; }
  .primary-doc-btn.has-changes.selected { background: #c2410c; border-color: #c2410c; color: #fff; }
  .primary-doc-btn.has-changes.selected .pdb-sub { color: rgba(255,255,255,.9); }
  .pdb-badge { margin-left: 4px; font-size: 14px; font-weight: 800; color: #64748b; }
  .primary-doc-btn.has-changes .pdb-badge { color: #c2410c; }
  .primary-doc-btn.selected .pdb-badge { color: rgba(255,255,255,.9); }

  /* 기타 출력 — 작은 단독 출력 버튼 4개 */
  .other-doc-head { display: flex; align-items: baseline; gap: 8px; margin-top: 3px; }
  .other-doc-title { font-size: 12.5px; font-weight: 800; color: var(--text-sub); }
  .other-doc-sub { font-size: 11px; font-weight: 600; color: #94a3b8; }
  .other-doc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; margin-top: 4px; }
  .other-doc-btn {
    min-height: 38px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: 10px; background: #fafbfc; font-size: 13px; font-weight: 700;
    line-height: 1.15; text-align: center; color: var(--text-sub); padding: 2px 6px; white-space: nowrap;
  }
  .other-doc-btn:hover { background: #f1f5f9; }
  .other-doc-btn.selected { border-color: var(--blue); background: var(--blue-bg); color: var(--navy); }

  .print-section { margin-top: auto; padding-top: 2px; }
  .print-btn {
    width: 100%; min-height: 48px; background: var(--blue); color: #fff; border: 0; border-radius: 14px;
    font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .print-btn:hover:not(:disabled) { background: var(--blue-dark); }
  .print-btn:disabled { opacity: .45; cursor: not-allowed; }
  .print-sub-row { display: flex; gap: 8px; margin-top: 4px; }
  .print-caption { text-align: center; font-size: 11px; color: var(--text-sub); margin-top: 2px; }

  .admin-open-btn {
    width: 100%; min-height: 34px; margin-top: 4px; border: 1.5px solid var(--blue); background: #fff;
    color: var(--blue); border-radius: 12px; font-weight: 700; font-size: 13.5px;
  }
  .admin-open-btn:hover { background: var(--blue-bg); }

  /* ================= 오른쪽 미리보기 패널 ================= */
  .right-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
  .preview-head {
    flex: 0 0 56px; height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 22px;
    background: #fff; border-bottom: 1px solid var(--border);
  }
  .preview-title { font-size: 17px; font-weight: 900; color: var(--navy); white-space: nowrap; }
  .preview-badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .preview-badge { padding: 4px 11px; border-radius: 20px; font-size: 12.5px; font-weight: 700; background: #eef1f5; color: var(--text-sub); }
  .preview-badge.b-solid { background: var(--blue); color: #fff; }
  .preview-badge.b-soft { background: var(--blue-bg); color: var(--blue); }
  .zoom-controls { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .zoom-controls button {
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: #fff;
    font-size: 16px; font-weight: 800; color: var(--navy);
  }
  .zoom-controls button:hover { background: #f1f5f9; }
  .zoom-controls #zoomLabel { min-width: 48px; text-align: center; font-weight: 800; font-size: 13.5px; color: var(--navy); }

  .preview-viewport { flex: 1; min-height: 0; overflow: auto; display: flex; justify-content: center; padding: 26px; }
  .preview-surface { display: flex; flex-direction: column; align-items: center; gap: 18px; margin: auto 0; }
  .page-frame { position: relative; overflow: hidden; }
  .page-card { position: absolute; top: 0; left: 0; transform-origin: top left; background: #fff; outline: 1px solid var(--border); box-shadow: 0 1px 5px rgba(16,24,40,.07); }
  .preview-empty { padding: 70px 30px; text-align: center; color: var(--text-sub); font-size: 16px; font-weight: 700; }

  /* ================= 문서 공통 표 스타일 (인쇄와 화면 미리보기가 동일한 마크업 사용) ================= */
  .doc-page { background: #fff; }
  .print-course + .print-course { margin-top: 10mm; }
  table.doc-table { border-collapse: collapse; table-layout: fixed; }
  .status-table.doc-table { width: 210mm; }
  .address-table.doc-table { width: 297mm; }
  .closer-table.doc-table { width: 210mm; }
  .changes-table th, .changes-table td { font-size: 13pt; }
  .changes-table td.chg-type { font-weight: 800; }
  .changes-table td.chg-to { font-weight: 800; color: #b91c1c; }
  .changes-section-title { font-size: 13pt; font-weight: 800; margin: 6mm 0 2mm; }
  table.doc-table thead { display: table-header-group; }
  table.doc-table th, table.doc-table td {
    border: 1px solid #000; padding: 5px 7px; text-align: center; overflow-wrap: break-word; word-break: break-word;
  }
  table.doc-table tbody tr { break-inside: avoid; page-break-inside: avoid; }

  tr.doc-title-row th { background: var(--navy); color: #fff; font-size: 13pt; padding: 8px; }
  tr.doc-title-row .title-main { font-size: 16pt; font-weight: 900; letter-spacing: .4px; }
  tr.doc-col-row th { background: #f3f4f6; font-weight: 700; font-size: 12pt; }

  .status-table td { font-size: 14pt; }
  .status-table td.col-companyno, .status-table td.col-nickname { font-weight: 700; font-size: 14pt; }
  .status-table td.col-shipno { font-weight: 700; font-size: 20pt; }
  .status-table td.col-qty { border: 2px solid #1d4ed8; }
  .status-table td.has-note { background: #fff59d; color: var(--red); font-weight: 700; }
  .status-table tr.missing-row td.col-nickname, .status-table tr.missing-row td.col-companyno { background: #fef2f2; }

  .address-table td, .address-table th { font-size: 12.5pt; }
  .address-table td.col-companyno, .address-table td.col-nickname { font-weight: 700; }
  .address-table td.col-address { text-align: left; }
  .address-table td.col-method { color: var(--blue); font-weight: 700; }
  .address-table td.col-comment { text-align: left; }
  .address-table td.col-comment.has-comment { background: #eafbea; }
  .address-table td.col-comment.has-note { background: #fff59d; color: var(--red); font-weight: 700; }
  .address-table td.col-phone { font-weight: 700; font-size: 13pt; color: var(--red); white-space: normal; }
  .address-table tr.missing-field td.col-address { background: #fef2f2; }
  .address-table tr.origin-row td { background: #fff8e1; font-weight: 700; }
  .address-table tr.cart-row td { background: #eafbea; }
  .address-table tr.cart-row td.col-comment.has-note { background: #fff59d; }

  /* 차량(지원차/자차) 체크 + 총 수거량 기재표 — 현황지·마감자용 수량표 하단 공용 */
  .vehicle-check-table.doc-table {
    width: 210mm; margin-top: -1px; background: #fff;
    break-inside: avoid; page-break-inside: avoid; break-before: avoid; page-break-before: avoid;
  }
  .vehicle-check-table tr.vc-head-row th { background: #f3f4f6; font-weight: 800; font-size: 13pt; padding: 7px 6px; }
  .vehicle-check-table tr.vc-input-row td { height: 14mm; background: #fff; border-width: 2px; }

  .address-footnote {
    width: 297mm; text-align: center; font-size: 12pt; font-weight: 700;
    border: 1px solid #000; border-top: 0; padding: 8px; break-inside: avoid; background: #fff;
  }

  /* 전체 주소지 전용 — A4 세로(portrait) 표. 다른 문서(코스별 주소지 등)의 스타일과 독립적으로 관리 */
  .addressall-table.doc-table { width: 210mm; }
  .addressall-table td, .addressall-table th { font-size: 9pt; }
  .addressall-table thead th { font-size: 9.5pt; }
  .addressall-table td.col-course { font-weight: 700; }
  .addressall-table td.col-companyno, .addressall-table td.col-nickname { font-weight: 700; }
  .addressall-table td.col-address {
    text-align: left; white-space: normal; overflow-wrap: anywhere; word-break: keep-all; line-height: 1.25;
  }
  .addressall-table td.col-method { color: var(--blue); font-weight: 700; }
  .addressall-table td.col-comment {
    text-align: left; white-space: normal; overflow-wrap: anywhere; word-break: keep-all; line-height: 1.25;
  }
  .addressall-table td.col-comment.has-comment { background: #eafbea; }
  .addressall-table td.col-comment.has-note { background: #fff59d; color: var(--red); font-weight: 700; }
  .addressall-table td.col-phone { font-weight: 700; color: var(--red); white-space: normal; overflow-wrap: anywhere; }
  .addressall-table tr.missing-field td.col-address { background: #fef2f2; }
  .addressall-table tr.cart-row td { background: #eafbea; }

  /* 전체 주소지의 코스별 제목 바 — 색상은 공통 courseColor()가 인라인 style로 지정, 여기서는 레이아웃만 */
  .addressall-table tr.doc-title-row th { font-size: 13pt; text-align: left; padding: 8px 10px; }
  .addressall-table tr.doc-col-row th { font-weight: 800; }

  /* 마감자용 수량표 — 배송기사용 문서와 혼동되지 않는 대형 제목 + 단일 연속 표 */
  .closer-header-box {
    width: 210mm; background: #fffef5; border-top: 4px solid #000; border-bottom: 4px solid #000; break-inside: avoid;
  }
  .closer-kicker { text-align: center; font-size: 11pt; font-weight: 800; letter-spacing: 2px; color: #111827; padding-top: 4mm; }
  .closer-main-title {
    font-size: 28pt; font-weight: 900; line-height: 1.15; text-align: center; letter-spacing: -0.5px; padding: 7mm 0 4mm;
  }
  .closer-meta-line { text-align: center; font-size: 12pt; font-weight: 600; color: #374151; padding-bottom: 5mm; }

  .closer-table thead th { background: #111827; color: #fff; font-weight: 800; }
  .closer-table th, .closer-table td { font-size: 12.5pt; }
  .closer-table tbody tr { height: 11mm; }
  .closer-table tbody tr.course-start td { border-top: 2px solid #000; }
  .closer-table td.col-companyno, .closer-table td.col-nickname { font-weight: 800; }
  .closer-table td.col-nickname { text-align: left; }
  .closer-table td.col-bagsize { font-weight: 700; }
  .closer-table td.col-bagfill, .closer-table td.col-towelfill { background: #fff; }
  .closer-table td.col-note { text-align: left; font-size: 11.5pt; }
  .closer-table td.col-note.emphasis { background: #fff59d; color: #000; font-weight: 700; }
  .closer-table .badge-mini { font-size: 9.5pt; padding: 1px 5px; border-radius: 10px; font-weight: 700; margin-left: 4px; }
  .closer-table .badge-mini.add { background: #dcfce7; color: #15803d; }
  .closer-table .badge-mini.edit { background: #fef3c7; color: #92400e; }
  .chk-box { display: inline-block; width: 20px; height: 20px; border: 2px solid #000; vertical-align: middle; }
  .closer-summary { width: 210mm; border: 1px solid #000; border-top: 0; padding: 10px 16px; font-size: 11.5pt; break-inside: avoid; break-before: avoid; background: #fff; }
  .closer-summary .row { padding: 3px 0; break-inside: avoid; }
  .closer-summary .row.closer-footer span { font-weight: 700; margin-right: 26px; display: inline-block; }
  .closer-summary .label { color: #333; font-weight: 700; margin-right: 6px; }

  /* ================= 모달 ================= */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(15,23,42,.5);
    align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box { background: #fff; border-radius: 16px; padding: 24px; width: 440px; max-width: 100%; }
  .modal-title { font-size: 18px; font-weight: 800; color: var(--navy); margin-bottom: 14px; }
  .modal-body { font-size: 14.5px; color: var(--text); line-height: 1.6; margin-bottom: 18px; }
  .modal-field { margin-bottom: 14px; }
  .modal-field label { display: block; font-size: 13px; font-weight: 700; color: var(--text-sub); margin-bottom: 6px; }
  .modal-field input { width: 100%; height: 46px; padding: 0 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .modal-actions button { min-height: 46px; padding: 0 20px; border-radius: 10px; font-weight: 700; font-size: 15px; border: 0; }
  .modal-actions .cancel { background: #eef1f5; color: var(--navy); }
  .modal-actions .confirm { background: var(--blue); color: #fff; }
  .guide-steps { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
  .guide-steps button {
    min-height: 56px; border-radius: 12px; border: 1.5px solid var(--blue); background: #fff; color: var(--blue);
    font-size: 16px; font-weight: 800;
  }
  .guide-steps button:hover { background: var(--blue-bg); }
  .guide-steps button.done { border-color: var(--green); color: var(--green); background: #ecfdf3; }

  /* ================= 인쇄 전용 ================= */
  .print-only { display: none; }
  #printStatus, #printAddress, #printCloser, #printAddressAll, #printChanges { display: none; }

  @page portraitPage { size: A4 portrait; margin: 8mm; }
  @page landscapePage { size: A4 landscape; margin: 7mm; }

  @media print {
    .no-print { display: none !important; }
    html, body { background: #fff !important; overflow: visible !important; height: auto !important; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color-adjust: exact !important; }

    .print-only { display: block !important; }
    #printStatus, #printAddress, #printCloser, #printAddressAll, #printChanges { display: none !important; }
    body.printing-status #printStatus { display: block !important; page: portraitPage; }
    body.printing-address #printAddress { display: block !important; page: landscapePage; }
    body.printing-closer #printCloser { display: block !important; page: portraitPage; }
    body.printing-address-all #printAddressAll { display: block !important; page: portraitPage; }
    body.printing-changes #printChanges { display: block !important; page: portraitPage; }

    .print-course { break-before: page; page-break-before: always; }
    .print-course:first-child { break-before: auto; page-break-before: auto; }

    table.doc-table, table.doc-table * { transform: none !important; zoom: 1 !important; }
    .doc-page, table.doc-table, .address-footnote, .closer-summary, .closer-header-box { width: auto !important; }
  }
</style>
</head>
<body>

<div class="field-shell no-print">
  <header class="app-header">
    <div class="app-header-left">유성클리닝 현황지 출력</div>
    <div class="app-header-right">
      <span class="conn-text pending" id="connText">연결 확인 중</span>
      <button class="icon-btn" id="btnSettings" title="설정">⚙</button>
    </div>
  </header>

  <div class="field-body">
    <aside class="left-panel" id="leftPanel">

      <div class="inline-error" id="inlineError">
        <span id="inlineErrorText"></span>
        <button id="btnRetry">재시도</button>
      </div>

      <div class="field-section">
        <div class="section-label">1. 날짜 선택</div>
        <button class="date-box" id="dateBox"><span class="ic">📅</span><span id="dateBoxText">-</span></button>
        <input type="date" id="datePickerHidden" class="visually-hidden">
        <div class="date-sub-row">
          <button class="sub-btn" id="btnToday"><span>📅</span>오늘</button>

<script>
(function () {
  'use strict';

  // ================= 설정 =================
  var STORAGE_KEYS = {
    gasUrl: 'ysc_gas_url_v2',
    printHistory: 'ysc_print_history_v1',
    lastCourse: 'ysc_field_last_course_v1',
    snapshotSig: 'ysc_snapshot_sig_v1',
    snapshotPending: 'ysc_snapshot_pending_v1'
  };
  // 현황지/마감자용을 출력하면 그 내용을 포장기록 서버(현장입력 시트의 '현황지출력본' 탭)에 한 벌 남긴다.
  // 원본 시트에는 쓰지 않는다. 저장이 실패해도 인쇄에는 영향이 없고, 다음 출력/접속 때 다시 보낸다.
  var SNAPSHOT_URL = 'https://yuseong-packing-production.up.railway.app/api/status-snapshot';
  var DRAFT_KEY_PREFIX = 'ysc_print_draft_';
  var DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbx4L6ZiXjjKkQPo1vcGxp5iuP7MktAo30gn-fCRAQPCdrRb1VQ_yijQ6hvS21NoIrvM/exec';
  var FETCH_TIMEOUT_MS = 30000;
  var ALL_SENTINEL = '__ALL__';
  var MIN_SCALE = 0.32;

  var WEEKDAY_FROM_JS_DAY = ['일', '월', '화', '수', '목', '금', '토'];
  var WEEKDAY_FULL = { '월':'월요일','화':'화요일','수':'수요일','목':'목요일','금':'금요일','토':'토요일','일':'일요일' };

  var BIZ_TYPE_STYLE = {
    '미용실':   { bg: '#ffb74d', color: '#4a2600' },
    '헬스장':   { bg: '#ffe0b2', color: '#c62828' },
    '병원':     { bg: '#90caf9', color: '#0d47a1' },
    '사우나':   { bg: '#81d4fa', color: '#01579b' },
    '모텔':     { bg: '#ce93d8', color: '#4a148c' },
    '마사지':   { bg: '#f48fb1', color: '#880e4f' },
    '만화책방': { bg: '#212121', color: '#ff4081' }
  };
  function bizTypeStyle(t) { return BIZ_TYPE_STYLE[t] || { bg: '#e0e0e0', color: '#333' }; }

  // ================= 상태 =================
  var state = {
    selectedDate: new Date(),
    weekday: '',
    rawCache: {},
    raw: null,
    draft: null,
    merged: null,
    selectedCourse: null,
    docType: 'status_address',
    zoomPct: 100,
    isLoading: false,
    isPrinting: false,
    isResolvingNextBiz: false,
    snapshot: null,          // 이 배송일의 최종 출력본(서버) {date, courses:[...]}
    snapshotStatus: 'idle',  // idle | loading | ok | error
    changes: { items: [], drivers: [], printedAt: '' },
    testMode: false          // true면 가짜 예시 변경내역으로 화면/인쇄 모양만 확인한다(저장·비교 없음)
  };

  // ================= DOM refs =================
  var $ = function (id) { return document.getElementById(id); };
  var connText = $('connText');
  var btnSettings = $('btnSettings');

  var inlineError = $('inlineError');
  var inlineErrorText = $('inlineErrorText');
  var btnRetry = $('btnRetry');

  var dateBox = $('dateBox');
  var dateBoxText = $('dateBoxText');
  var datePickerHidden = $('datePickerHidden');
  var btnToday = $('btnToday');
  var btnNextBiz = $('btnNextBiz');

  var courseGrid = $('courseGrid');
  var courseInfoCard = $('courseInfoCard');
  var docCards = Array.prototype.slice.call(document.querySelectorAll('.primary-doc-btn, .other-doc-btn'));

  var btnPrintMain = $('btnPrintMain');
  var printBtnLabel = $('printBtnLabel');
  var btnEdit = $('btnEdit');
  var btnOpenAdmin = $('btnOpenAdmin');

  var previewBadges = $('previewBadges');
  var previewViewport = $('previewViewport');
  var previewSurface = $('previewSurface');
  var zoomOut = $('zoomOut');
  var zoomIn = $('zoomIn');
  var zoomLabel = $('zoomLabel');

  var printStatus = $('printStatus');
  var printAddress = $('printAddress');
  var printCloser = $('printCloser');
  var printChanges = $('printChanges');
  var printAddressAll = $('printAddressAll');

  var settingsModal = $('settingsModal');
  var gasUrlInput = $('gasUrlInput');
  var settingsCancel = $('settingsCancel');
  var settingsSave = $('settingsSave');

  var guideModal = $('guideModal');
  var guideStatusBtn = $('guideStatusBtn');
  var guideAddressBtn = $('guideAddressBtn');
  var guideClose = $('guideClose');

  var closerAllGuideModal = $('closerAllGuideModal');
  var closerAllStep1Btn = $('closerAllStep1Btn');
  var closerAllStep2Btn = $('closerAllStep2Btn');
  var closerAllDone = $('closerAllDone');

  // ================= 설정 저장소 =================
  function getGasUrl() { return localStorage.getItem(STORAGE_KEYS.gasUrl) || DEFAULT_GAS_URL; }
  function setGasUrl(url) { localStorage.setItem(STORAGE_KEYS.gasUrl, url); }

  btnSettings.addEventListener('click', function () {
    gasUrlInput.value = getGasUrl();
    settingsModal.classList.add('show');
  });
  settingsCancel.addEventListener('click', function () { settingsModal.classList.remove('show'); });
  settingsSave.addEventListener('click', function () {
    var v = gasUrlInput.value.trim();
    if (v) setGasUrl(v);
    settingsModal.classList.remove('show');
  });

  // ================= 날짜/요일 =================
  function isoDate(d) {
    var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  function weekdayFromDate(d) { return WEEKDAY_FROM_JS_DAY[d.getDay()]; }
  function isoWeekNumber(dateObj) {
    var date = new Date(Date.UTC(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate()));
    var dayNum = date.getUTCDay() || 7;
    date.setUTCDate(date.getUTCDate() + 4 - dayNum);
    var yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
    return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
  }
  function fmtDisplayDate(d) { return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + isoWeekNumber(d) + '주차)'; }
  function fmtBigDate(d) {
    var wd = WEEKDAY_FULL[weekdayFromDate(d)] || '';
    return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + wd;
  }

  function getQueryDate_() {
    try {
      var q = new URLSearchParams(window.location.search).get('date');
      if (q && /^\d{4}-\d{2}-\d{2}$/.test(q)) {
        var d = new Date(q + 'T00:00:00');
        if (!isNaN(d.getTime())) return d;
      }
    } catch (e) {}
    return null;
  }

  function refreshDateDisplay() {
    state.weekday = weekdayFromDate(state.selectedDate);
    dateBoxText.textContent = fmtBigDate(state.selectedDate);
    datePickerHidden.value = isoDate(state.selectedDate);
  }

  dateBox.addEventListener('click', function () {
    if (typeof datePickerHidden.showPicker === 'function') {
      try { datePickerHidden.showPicker(); return; } catch (e) {}
    }
    datePickerHidden.focus();
    datePickerHidden.click();
  });
  datePickerHidden.addEventListener('change', function () {
    var v = datePickerHidden.value;
    if (!v) return;
    var d = new Date(v + 'T00:00:00');
    if (isNaN(d.getTime())) return;
    setSelectedDate(d);
  });

  function setSelectedDate(d) {
    state.selectedDate = d;
    refreshDateDisplay();
    clearScreenForDateChange();
    loadDayData(false);
    try {
      var url = new URL(window.location.href);
      url.searchParams.set('date', isoDate(d));
      window.history.replaceState({}, '', url);
    } catch (e) {}
  }

  btnToday.addEventListener('click', function () { setSelectedDate(new Date()); });

  btnNextBiz.addEventListener('click', function () {
    if (state.isResolvingNextBiz) return;
    state.isResolvingNextBiz = true;
    btnNextBiz.disabled = true;
    var attempts = 0;
    function tryDate(d) {
      attempts++;
      var dateIso = isoDate(d);
      var weekday = weekdayFromDate(d);
      var cached = state.rawCache[dateIso];
      if (cached) {
        if (cached.closedDay && attempts < 8) { var nd = new Date(d); nd.setDate(nd.getDate() + 1); tryDate(nd); return; }
        finish(d);
        return;
      }
      callGAS({ action: 'getData', weekday: weekday, date: dateIso })
        .then(function (data) {
          if (data && data.success && data.requestedDate === dateIso) {
            state.rawCache[dateIso] = data;
            if (data.closedDay && attempts < 8) { var nd2 = new Date(d); nd2.setDate(nd2.getDate() + 1); tryDate(nd2); return; }
            finish(d);
          } else if (attempts < 8) {
            var nd3 = new Date(d); nd3.setDate(nd3.getDate() + 1); tryDate(nd3);
          } else { finish(d); }
        })
        .catch(function () { finish(d); });
    }
    function finish(d) {
      state.isResolvingNextBiz = false;
      btnNextBiz.disabled = false;
      setSelectedDate(d);
    }
    var start = new Date(state.selectedDate); start.setDate(start.getDate() + 1);
    tryDate(start);
  });

  // ================= GAS 호출 =================
  function callGAS(payload) {
    var url = getGasUrl();
    var controller = new AbortController();
    var timeoutId = setTimeout(function () { controller.abort(); }, FETCH_TIMEOUT_MS);
    return fetch(url, { method: 'POST', body: JSON.stringify(payload), signal: controller.signal })
      .then(function (res) {
        clearTimeout(timeoutId);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }).finally(function () { clearTimeout(timeoutId); });
  }

  function hideInlineError() { inlineError.classList.remove('show'); }
  function showInlineError(msg) { inlineErrorText.textContent = msg; inlineError.classList.add('show'); }
  btnRetry.addEventListener('click', function () { loadDayData(true); });

  function setConn(kind, text) {
    connText.className = 'conn-text ' + kind;
    connText.textContent = text;
  }

  // ================= 드래프트(로컬 임시저장, 관리 화면과 동일한 키 사용) =================
  function draftKey(dateIso) { return DRAFT_KEY_PREFIX + dateIso; }
  function emptyDraft(dateIso) {
    return { date: dateIso, driverOverrides: {}, courseMoves: {}, order: {}, excluded: {}, added: [], fieldEdits: {} };
  }
  function loadDraft(dateIso) {
    try {
      var raw = localStorage.getItem(draftKey(dateIso));
      if (!raw) return emptyDraft(dateIso);
      var parsed = JSON.parse(raw);
      var d = emptyDraft(dateIso);
      Object.keys(d).forEach(function (k) { if (parsed[k] !== undefined) d[k] = parsed[k]; });
      return d;
    } catch (e) { return emptyDraft(dateIso); }
  }

  // ================= 데이터 불러오기 (날짜 키 캐시 — 요일 키 절대 사용 안 함) =================
  function clearScreenForDateChange() {
    state.raw = null; state.merged = null; state.draft = null;
    state.snapshot = null; state.snapshotStatus = 'idle'; state.changes = { items: [], drivers: [], printedAt: '' };
    updateChangesUI();
    courseGrid.innerHTML = '';
    courseInfoCard.textContent = '데이터를 불러오는 중...';
    previewSurface.innerHTML = '';
    previewBadges.innerHTML = '';
    updatePrintButton();
  }

  function loadDayData(force) {
    var dateIso = isoDate(state.selectedDate);
    var weekday = state.weekday;

    if (!force && state.rawCache[dateIso]) {
      applyRawData(state.rawCache[dateIso], dateIso);
      return;
    }
    if (state.isLoading) return;

    state.isLoading = true;
    hideInlineError();
    setConn('pending', '연결 확인 중');

    callGAS({ action: 'getData', weekday: weekday, date: dateIso })
      .then(function (data) {
        if (!data || !data.success) throw new Error((data && data.message) || '데이터를 불러오지 못했습니다.');
        if (data.requestedDate !== dateIso) {
          throw new Error('날짜 불일치: 요청 ' + dateIso + ' / 응답 ' + data.requestedDate);
        }
        if (isoDate(state.selectedDate) !== dateIso) return;
        state.rawCache[dateIso] = data;
        applyRawData(data, dateIso);
        setConn('ok', '원본 데이터 연결됨');
      })
      .catch(function (err) {
        setConn('err', '데이터 연결 오류');
        var msg = (err && err.name === 'AbortError')
          ? '요청이 너무 오래 걸려 중단됐어요. 다시 시도해주세요.'
          : (err && err.message) ? err.message : 'GAS 연결을 확인해주세요.';
        showInlineError(msg);
      })
      .finally(function () { state.isLoading = false; });
  }

  function applyRawData(data, dateIso) {
    state.raw = data;
    state.draft = loadDraft(dateIso);
    recomputeMerged();
    determineSelectedCourse();
    renderAll();
    loadSnapshot(dateIso);
  }

  // ================= 병합(원본 + 드래프트) — 관리 화면과 동일한 규칙 =================
  function recomputeMerged() { state.merged = computeMerged(state.raw, state.draft); }

  function computeMerged(raw, draft) {
    if (!raw) return null;
    var list = [];
    (raw.items || []).forEach(function (it) {
      var id = 'r' + it.row;
      var clone = {};
      Object.keys(it).forEach(function (k) { clone[k] = it[k]; });
      clone.id = id; clone.isAdded = false; clone.isEdited = false; clone.origCourse = it.course;
      list.push(clone);
    });
    (draft.added || []).forEach(function (a) {
      var clone = {};
      Object.keys(a).forEach(function (k) { clone[k] = a[k]; });
      clone.isAdded = true; clone.isEdited = false; clone.origCourse = a.course;
      list.push(clone);
    });

    var excludedItems = list.filter(function (it) { return !!draft.excluded[it.id]; });
    list = list.filter(function (it) { return !draft.excluded[it.id]; });

    list.forEach(function (it) {
      if (draft.courseMoves[it.id] && draft.courseMoves[it.id] !== it.course) {
        it.course = draft.courseMoves[it.id]; it.isEdited = true;
      }
      var fe = draft.fieldEdits[it.id];
      if (fe) { Object.keys(fe).forEach(function (k) { it[k] = fe[k]; }); it.isEdited = true; }
    });

    var byCourse = {};
    list.forEach(function (it) { if (!byCourse[it.course]) byCourse[it.course] = []; byCourse[it.course].push(it); });
    var courses = Object.keys(byCourse).sort();

    courses.forEach(function (course) {
      var arr = byCourse[course];
      var orderIds = draft.order[course];
      if (orderIds && orderIds.length) {
        var idxMap = {};
        orderIds.forEach(function (id, i) { idxMap[id] = i; });
        arr.sort(function (a, b) {
          var ai = idxMap.hasOwnProperty(a.id) ? idxMap[a.id] : 100000 + (Number(a.orderSuffix) || 0);
          var bi = idxMap.hasOwnProperty(b.id) ? idxMap[b.id] : 100000 + (Number(b.orderSuffix) || 0);
          return ai - bi;
        });
      } else {
        arr.sort(function (a, b) { return (Number(a.orderSuffix) || 0) - (Number(b.orderSuffix) || 0); });
      }
      byCourse[course] = arr;
    });

    var drivers = {};
    courses.forEach(function (course) {
      if (draft.driverOverrides[course]) { drivers[course] = draft.driverOverrides[course]; }
      else {
        var counts = {}, best = '', bestN = 0;
        byCourse[course].forEach(function (it) { if (it.driver) counts[it.driver] = (counts[it.driver] || 0) + 1; });
        Object.keys(counts).forEach(function (name) { if (counts[name] > bestN) { best = name; bestN = counts[name]; } });
        drivers[course] = best || (raw.drivers && raw.drivers[course]) || '';
      }
    });

    var shipSeq = 0;
    courses.forEach(function (course) {
      byCourse[course].forEach(function (it, idx) {
        it.deliveryOrder = course + '-' + String(idx + 1).padStart(2, '0');
        shipSeq++; it.shippingNumber = shipSeq;
      });
    });

    var editedCount = list.filter(function (it) { return it.isEdited || it.isAdded; }).length;

    return {
      dayOfWeek: raw.dayOfWeek, requestedDate: raw.requestedDate, weekday: raw.weekday, origin: raw.origin,
      closedDay: raw.closedDay, courses: courses, byCourse: byCourse, drivers: drivers, items: list,
      excludedItems: excludedItems, totalCount: list.length, excludedCount: excludedItems.length, editedCount: editedCount
    };
  }

  // ================= 코스 선택 (기억 + 기본값 규칙) =================
  function determineSelectedCourse() {
    if (!state.merged || state.merged.closedDay || !state.merged.courses.length) { state.selectedCourse = null; return; }
    var saved = null;
    try { saved = localStorage.getItem(STORAGE_KEYS.lastCourse); } catch (e) {}
    if (saved === ALL_SENTINEL) { state.selectedCourse = ALL_SENTINEL; return; }
    if (saved && state.merged.courses.indexOf(saved) !== -1) { state.selectedCourse = saved; return; }
    state.selectedCourse = state.merged.courses.indexOf('B') !== -1 ? 'B' : state.merged.courses[0];
  }
  function selectCourse(c) {
    state.selectedCourse = c;
    try { localStorage.setItem(STORAGE_KEYS.lastCourse, c); } catch (e) {}
    renderAll();
  }
  function getCoursesToPrint() {
    if (!state.merged) return [];
    if (state.selectedCourse === ALL_SENTINEL) return state.merged.courses.slice();
    if (state.selectedCourse && state.merged.courses.indexOf(state.selectedCourse) !== -1) return [state.selectedCourse];
    return [];
  }
  var ALWAYS_ALL_DOC_TYPES = { closer: true, all_address: true, closer_all_address: true };

  function selectDocType(type) { state.docType = type; if (type !== 'changes') state.testMode = false; renderAll(); }

  // ================= 렌더 총괄 =================
  function renderAll() {
    renderCourseGrid();
    updateInfoCard();
    renderDocCards();
    updatePrintButton();
    renderPreview();
    renderBadges();
  }

  function renderCourseGrid() {
    courseGrid.innerHTML = '';
    if (!state.merged) return;
    if (state.merged.closedDay || !state.merged.courses.length) {
      var empty = document.createElement('div');
      empty.style.cssText = 'grid-column:1/-1;padding:14px;text-align:center;color:var(--text-sub);font-size:14px;font-weight:700;';
      empty.textContent = '이 날짜는 휴무일입니다 — 배정된 코스가 없습니다.';
      courseGrid.appendChild(empty);
      return;
    }
    var allBtn = document.createElement('button');
    allBtn.className = 'course-btn' + (state.selectedCourse === ALL_SENTINEL ? ' selected' : '');
    allBtn.textContent = '전체';
    allBtn.addEventListener('click', function () { selectCourse(ALL_SENTINEL); });
    courseGrid.appendChild(allBtn);
    state.merged.courses.forEach(function (course) {
      var btn = document.createElement('button');
      var isSelected = state.selectedCourse === course;
      btn.className = 'course-btn' + (isSelected ? ' selected' : '');
      btn.textContent = course + '코스';
      if (isSelected) {
        var c = courseColor(course);
        btn.style.background = c; btn.style.borderColor = c; btn.style.color = '#fff';
      }
      btn.addEventListener('click', function () { selectCourse(course); });
      courseGrid.appendChild(btn);
    });
  }

  function updateInfoCard() {
    if (!state.merged) { courseInfoCard.textContent = '데이터를 불러오는 중...'; return; }
    if (state.merged.closedDay || !state.merged.courses.length) { courseInfoCard.textContent = 'ℹ 휴무일 — 인쇄할 수 있는 코스가 없습니다.'; return; }
    if (state.selectedCourse === ALL_SENTINEL) {
      courseInfoCard.textContent = 'ℹ 전체 · ' + state.merged.courses.length + '개 코스 · ' + state.merged.totalCount + '곳';
      return;
    }
    var course = state.selectedCourse;
    if (!course) { courseInfoCard.textContent = 'ℹ 코스를 선택해주세요.'; return; }
    var driver = cleanDriverName(state.merged.drivers[course]) || '기사 미배정';
    var count = (state.merged.byCourse[course] || []).length;
    courseInfoCard.textContent = 'ℹ ' + course + '코스 · ' + driver + ' · ' + count + '곳';
  }

  function renderDocCards() {
    docCards.forEach(function (card) { card.classList.toggle('selected', card.dataset.doc === state.docType); });
  }
  docCards.forEach(function (card) { card.addEventListener('click', function () { selectDocType(card.dataset.doc); }); });

  function courseLabel() {
    if (state.selectedCourse === ALL_SENTINEL) return '전체';
    if (state.selectedCourse) return state.selectedCourse + '코스';
    return '';
  }
  function docLabel(type) {
    return type === 'address' ? '주소지' : type === 'status' ? '현황지' : type === 'closer' ? '마감자용 수량표' : type === 'all_address' ? '전체 주소지' : type === 'closer_all_address' ? '마감자용 수량표+전체주소지' : type === 'changes' ? '출력 후 라벨코스 변경내역' : '현황지+주소지';
  }

  function canPrint() {
    if (!state.merged || state.merged.closedDay) return false;
    if (state.docType === 'changes') return state.testMode || state.changes.items.length + state.changes.drivers.length > 0;
    if (ALWAYS_ALL_DOC_TYPES[state.docType]) return state.merged.courses.length > 0;
    return getCoursesToPrint().length > 0;
  }

  function updatePrintButton() {
    if (state.docType === 'changes') {
      printBtnLabel.textContent = state.testMode ? '변경내역 인쇄 (테스트)' : '변경내역 인쇄';
    } else if (state.docType === 'closer') {
      printBtnLabel.textContent = '마감자용 전체 수량표 인쇄';
    } else if (state.docType === 'all_address') {
      printBtnLabel.textContent = '전체 주소지 인쇄';
    } else if (state.docType === 'closer_all_address') {
      printBtnLabel.textContent = '마감자용 + 전체주소지 출력';
    } else if (state.docType === 'status_address') {
      var cl0 = courseLabel();
      printBtnLabel.textContent = (cl0 ? cl0 + ' ' : '') + '현황지 + 주소지 출력';
    } else {
      var cl = courseLabel();
      var dl = docLabel(state.docType);
      printBtnLabel.textContent = (cl ? cl + ' ' : '') + dl + ' 인쇄';
    }
    var ok = canPrint();
    btnPrintMain.disabled = !ok;
  }

  function renderBadges() {
    previewBadges.innerHTML = '';
    if (!state.merged || state.merged.closedDay) return;
    var items = [];
    if (state.docType === 'closer') {
      items.push({ text: '전체 업체', cls: 'b-solid' });
      items.push({ text: '마감자용 수량표', cls: 'b-soft' });
      items.push({ text: 'A4 세로', cls: '' });
    } else if (state.docType === 'all_address') {
      items.push({ text: '전체 코스', cls: 'b-solid' });
      items.push({ text: '전체 주소지', cls: 'b-soft' });
      items.push({ text: 'A4 세로', cls: '' });
    } else if (state.docType === 'closer_all_address') {
      items.push({ text: '전체 업체', cls: 'b-solid' });
      items.push({ text: '마감자용 + 전체주소지', cls: 'b-soft' });
      items.push({ text: 'A4 세로 2종', cls: '' });
    } else {
      var singleCourse = (state.selectedCourse && state.selectedCourse !== ALL_SENTINEL) ? state.selectedCourse : null;
      items.push({ text: courseLabel(), cls: 'b-solid', course: singleCourse });
      if (state.docType === 'address') { items.push({ text: '주소지', cls: 'b-soft' }); items.push({ text: 'A4 가로', cls: '' }); }
      else if (state.docType === 'status') { items.push({ text: '현황지', cls: 'b-soft' }); items.push({ text: 'A4 세로', cls: '' }); }
      else { items.push({ text: '현황지+주소지', cls: 'b-soft' }); items.push({ text: '세로+가로', cls: '' }); }
    }
    items.forEach(function (o) {
      if (!o.text) return;
      var b = document.createElement('span');
      b.className = 'preview-badge' + (o.cls ? ' ' + o.cls : '');
      b.textContent = o.text;
      if (o.course) { var c = courseColor(o.course); b.style.background = c; b.style.color = '#fff'; }
      previewBadges.appendChild(b);
    });
  }

  // ================= 문서 템플릿 =================
  function td(text, className) {
    var cell = document.createElement('td');
    if (className) cell.className = className;
    cell.textContent = text === undefined || text === null ? '' : String(text);
    return cell;
  }
  function isCodeComment(text) { return /비번|비밀번호|password/i.test(text || ''); }
  function isCartMethod(text) { return /카트/.test(text || ''); }
  function cleanDriverName(name) {
    return String(name || '').replace(/\s*01[016789][\d\-]{7,}\s*$/, '').trim();
  }
  function fmtTitleDate(d, dayOfWeek) { return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + (dayOfWeek || ''); }
  function fmtPrintTime(d) { return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }

  // ===== 마감자용: 포대사이즈 / 특이사항 =====
  var BAG_SIZE_TOKENS = ['특대사이즈', '특대', '대형', '중형', '소형', '업체포대', '미니', '특소', '대', '중', '소'];
  function bagSizeDisplay(raw) {
    var s = String(raw || '').trim();
    if (!s) return '-';
    if (/\d/.test(s)) {
      for (var i = 0; i < BAG_SIZE_TOKENS.length; i++) {
        if (s.indexOf(BAG_SIZE_TOKENS[i]) !== -1) return BAG_SIZE_TOKENS[i];
      }
    }
    return s;
  }
  var NOTE_EMPHASIS_RE = /두번접기|펼치기|펼쳐서|밴딩|별도\s?포장|혼합금지|접지\s?않음/;
  function buildSpecialNote(it) {
    var parts = [];
    function addPart(v) { var s = String(v || '').trim(); if (s && parts.indexOf(s) === -1) parts.push(s); }
    addPart(it.bagDelivery);
    addPart(it.towelDelivery);
    if (it.deliveryComment && NOTE_EMPHASIS_RE.test(it.deliveryComment)) addPart(it.deliveryComment);
    return parts.length ? parts.join(' / ') : '-';
  }
  function noteHasEmphasis(text) { return NOTE_EMPHASIS_RE.test(text || ''); }

  // ================= 코스별 공통 색상 (모든 문서에서 재사용하는 단일 매핑) =================
  var COURSE_COLORS = {
    B: '#2563EB', C: '#16A34A', D: '#7C3AED', E: '#EA580C',
    F: '#0891B2', G: '#DB2777', Z: '#475569'
  };
  var COURSE_DEFAULT_COLOR = '#334155';
  function courseColor(course) { return COURSE_COLORS.hasOwnProperty(course) ? COURSE_COLORS[course] : COURSE_DEFAULT_COLOR; }

  // 제목 바(titleRow)와 표 머리글(colRow)에 코스색을 함께 적용 — 흑백 인쇄 대비용 굵은 상단 테두리 포함
  function applyCourseColorBlock(titleRow, colRow, course) {
    var color = courseColor(course);
    [titleRow, colRow].forEach(function (row) {
      if (!row) return;
      Array.prototype.forEach.call(row.querySelectorAll('th,td'), function (cell) {
        cell.style.background = color;
        cell.style.color = '#ffffff';
      });
    });
    if (titleRow) {
      Array.prototype.forEach.call(titleRow.querySelectorAll('th,td'), function (cell) {
        cell.style.borderTop = '4px solid #000';
      });
    }
  }

  var STATUS_COL_WIDTHS = [11, 10, 14, 12, 16, 16, 9, 12];
  var STATUS_TEMPLATE =
    '<table class="doc-table status-table">' +
      '<colgroup>' + STATUS_COL_WIDTHS.map(function (w) { return '<col style="width:' + w + '%">'; }).join('') + '</colgroup>' +
      '<thead>' +
        '<tr class="doc-title-row"><th colspan="8" class="title-main" data-slot="title"></th></tr>' +
        '<tr class="doc-col-row"><th>배송순서</th><th>업체번호</th><th>약칭</th><th>업종</th><th>포대 배송</th><th>수건 배송</th><th>수거량<br>(중요!)</th><th>출고</th></tr>' +
      '</thead>' +
      '<tbody></tbody>' +
    '</table>';

  var ADDRESS_COL_WIDTHS = [8, 8, 10, 34, 12, 20, 8];
  var ADDRESS_TEMPLATE =
    '<table class="doc-table address-table">' +
      '<colgroup>' + ADDRESS_COL_WIDTHS.map(function (w) { return '<col style="width:' + w + '%">'; }).join('') + '</colgroup>' +
      '<thead>' +
        '<tr class="doc-title-row"><th colspan="7" class="title-main" data-slot="title"></th></tr>' +
        '<tr class="doc-col-row"><th>배송순서</th><th>업체번호</th><th>약칭</th><th>배송주소</th><th>수거방식</th><th>배송 코멘트</th><th>거래처 번호</th></tr>' +
      '</thead>' +
      '<tbody></tbody>' +
    '</table>' +
    '<div class="address-footnote">【메모란】 위치 꿀팁(주차/비번 등) · 배송코멘트를 남겨주시면 차주 현황지에 반영됩니다.</div>';

  // 차량(지원차/자차) 체크 + 총 수거량 기재란 — 기사가 인쇄물에 직접 손으로 체크/기재하는 빈칸
  var VEHICLE_CHECK_TEMPLATE =
    '<table class="doc-table vehicle-check-table">' +
      '<colgroup><col style="width:22%"><col style="width:22%"><col style="width:56%"></colgroup>' +
      '<thead>' +
        '<tr class="vc-head-row"><th>지원차</th><th>자차</th><th>총 수거량 (개)</th></tr>' +
      '</thead>' +
      '<tbody>' +
        '<tr class="vc-input-row"><td class="vc-check"></td><td class="vc-check"></td><td class="vc-total"></td></tr>' +
      '</tbody>' +
    '</table>';

  function buildVehicleCheckTable() {
    var wrap = document.createElement('div');
    wrap.innerHTML = VEHICLE_CHECK_TEMPLATE;
    return wrap.firstElementChild;
  }

  function renderStatusRows(tbody, items) {
    tbody.innerHTML = '';
    items.forEach(function (it) {
      var tr = document.createElement('tr');
      if (!it.nickname || !it.companyNumber) tr.classList.add('missing-row');
      tr.appendChild(td(it.deliveryOrder, 'col-order'));
      tr.appendChild(td(it.companyNumber, 'col-companyno'));
      tr.appendChild(td(it.nickname, 'col-nickname'));
      var bizCell = td(it.businessType, 'col-biztype');
      var style = bizTypeStyle(it.businessType);
      bizCell.style.background = style.bg; bizCell.style.color = style.color; bizCell.style.fontWeight = '700';
      tr.appendChild(bizCell);
      var bagCell = td(it.bagDelivery, 'col-bag'); if (it.bagDelivery) bagCell.classList.add('has-note'); tr.appendChild(bagCell);
      var towelCell = td(it.towelDelivery, 'col-towel'); if (it.towelDelivery) towelCell.classList.add('has-note'); tr.appendChild(towelCell);
      tr.appendChild(td(it.collectionQuantity, 'col-qty'));
      tr.appendChild(td(it.shippingNumber, 'col-shipno'));
      tbody.appendChild(tr);
    });
  }

  function renderAddressRows(tbody, items, origin) {
    tbody.innerHTML = '';
    if (origin && (origin.name || origin.address)) {
      var originTr = document.createElement('tr'); originTr.className = 'origin-row';
      originTr.appendChild(td('출발', 'col-order'));
      originTr.appendChild(td('', 'col-companyno'));
      originTr.appendChild(td(origin.name || '유성(출발지)', 'col-nickname'));
      originTr.appendChild(td(origin.address, 'col-address'));
      originTr.appendChild(td('', 'col-method'));
      originTr.appendChild(td(origin.comment, 'col-comment'));
      originTr.appendChild(td('', 'col-phone'));
      tbody.appendChild(originTr);
    }
    items.forEach(function (it) {
      var tr = document.createElement('tr');
      if (!it.address) tr.classList.add('missing-field');
      if (isCartMethod(it.collectionMethod)) tr.classList.add('cart-row');
      tr.appendChild(td(it.deliveryOrder, 'col-order'));
      tr.appendChild(td(it.companyNumber, 'col-companyno'));
      tr.appendChild(td(it.nickname, 'col-nickname'));
      tr.appendChild(td(it.address, 'col-address'));
      tr.appendChild(td(it.collectionMethod, 'col-method'));
      var commentCell = td(it.deliveryComment, 'col-comment');
      if (it.deliveryComment) commentCell.classList.add(isCodeComment(it.deliveryComment) ? 'has-note' : 'has-comment');
      tr.appendChild(commentCell);
      tr.appendChild(td(it.phone, 'col-phone'));
      tbody.appendChild(tr);
    });
  }

  function buildStatusCourseBlock(course, items, driver, merged) {
    var wrap = document.createElement('div');
    wrap.className = 'print-course';
    wrap.innerHTML = STATUS_TEMPLATE;
    wrap.querySelector('[data-slot="title"]').textContent =
      fmtTitleDate(state.selectedDate, merged.dayOfWeek) + '　' + course + '코스 · ' + (cleanDriverName(driver) || '기사 미배정') + ' 세탁물 현황';
    applyCourseColorBlock(wrap.querySelector('tr.doc-title-row'), wrap.querySelector('tr.doc-col-row'), course);
    renderStatusRows(wrap.querySelector('tbody'), items);
    wrap.appendChild(buildVehicleCheckTable());
    return wrap;
  }
  function buildAddressCourseBlock(course, items, driver, merged) {
    var wrap = document.createElement('div');
    wrap.className = 'print-course';
    wrap.innerHTML = ADDRESS_TEMPLATE;
    wrap.querySelector('[data-slot="title"]').textContent =
      fmtTitleDate(state.selectedDate, merged.dayOfWeek) + '　' + course + '코스 배송주소 (사용 후 폐기)';
    applyCourseColorBlock(wrap.querySelector('tr.doc-title-row'), wrap.querySelector('tr.doc-col-row'), course);
    renderAddressRows(wrap.querySelector('tbody'), items, merged.origin);
    return wrap;
  }

  var CLOSER_COL_WIDTHS = [9, 12, 10, 12, 10, 15, 15, 17];
  var CLOSER_TABLE_TEMPLATE =
    '<table class="doc-table closer-table">' +
      '<colgroup>' + CLOSER_COL_WIDTHS.map(function (w) { return '<col style="width:' + w + '%">'; }).join('') + '</colgroup>' +
      '<thead>' +
        '<tr class="closer-col-row"><th>배송순서</th><th>출고번호</th><th>업체번호</th><th>약칭</th><th>포대사이즈</th><th>포대배송</th><th>수건배송</th><th>특이사항</th></tr>' +
      '</thead>' +
      '<tbody></tbody>' +
    '</table>';

  // 업체 1행 — 코스가 바뀌는 첫 행에만 상단 굵은 테두리로 구분(별도 제목 행/강제 페이지 분리 없음)
  function buildCloserRow(it, isCourseStart) {
    var tr = document.createElement('tr');
    if (isCourseStart) tr.classList.add('course-start');
    tr.appendChild(td(it.deliveryOrder, 'col-order'));
    tr.appendChild(td(it.shippingNumber, 'col-shipno'));
    tr.appendChild(td(it.companyNumber, 'col-companyno'));

    var nickTd = document.createElement('td'); nickTd.className = 'col-nickname';
    nickTd.textContent = it.nickname || '';
    if (it.isAdded) { var addBadge = document.createElement('span'); addBadge.className = 'badge-mini add'; addBadge.textContent = '추가'; nickTd.appendChild(addBadge); }
    else if (it.isEdited) { var editBadge = document.createElement('span'); editBadge.className = 'badge-mini edit'; editBadge.textContent = '수정'; nickTd.appendChild(editBadge); }
    tr.appendChild(nickTd);

    tr.appendChild(td(bagSizeDisplay(it.bagSize), 'col-bagsize'));
    tr.appendChild(td('', 'col-bagfill'));
    tr.appendChild(td('', 'col-towelfill'));

    var note = buildSpecialNote(it);
    var noteTd = td(note, 'col-note');

    tr.appendChild(noteTd);
    return tr;
  }

  // 전체 업체를 코스순 · 배송순서순으로 하나의 연속된 표에 담는다(코스별 제목 문단/별도 표/강제 페이지 분리 없음)
  function buildCloserDoc(allCourses, merged) {
    var container = document.createElement('div');
    container.className = 'closer-doc';

    var allItems = [];
    allCourses.forEach(function (course) { allItems = allItems.concat(merged.byCourse[course] || []); });

    var headerBox = document.createElement('div');
    headerBox.className = 'closer-header-box';
    headerBox.innerHTML =
      '<div class="closer-kicker">세탁팀 마감용</div>' +
      '<div class="closer-main-title">마감자용 세탁 수량 확인표</div>' +
      '<div class="closer-meta-line" data-slot="meta"></div>';
    headerBox.querySelector('[data-slot="meta"]').textContent =
      fmtBigDate(state.selectedDate) + ' · 전체 업체 수: ' + allItems.length + '개 · 인쇄 시각: ' + fmtPrintTime(new Date());
    container.appendChild(headerBox);

    var tableWrap = document.createElement('div');
    tableWrap.innerHTML = CLOSER_TABLE_TEMPLATE;
    var table = tableWrap.firstElementChild;
    var tbody = table.querySelector('tbody');
    allCourses.forEach(function (course, courseIdx) {
      (merged.byCourse[course] || []).forEach(function (it, itemIdx) {
        tbody.appendChild(buildCloserRow(it, courseIdx > 0 && itemIdx === 0));
      });
    });
    container.appendChild(table);
    container.appendChild(buildVehicleCheckTable());

    var summary = document.createElement('div');
    summary.className = 'closer-summary';

    var guideRow = document.createElement('div'); guideRow.className = 'row';
    guideRow.appendChild(document.createTextNode('업체별 포대·밴딩 수량을 기입하고 특이사항을 확인한 뒤 단톡방에 올려주세요.'));
    summary.appendChild(guideRow);

    footerRow.appendChild(s1); footerRow.appendChild(s2); footerRow.appendChild(s3);

  var ADDRESSALL_COL_WIDTHS = [7, 8, 8, 11, 32, 10, 16, 8];
  var ADDRESSALL_TEMPLATE =
    '<table class="doc-table addressall-table">' +
      '<colgroup>' + ADDRESSALL_COL_WIDTHS.map(function (w) { return '<col style="width:' + w + '%">'; }).join('') + '</colgroup>' +
      '<thead>' +
        '<tr class="doc-title-row"><th colspan="8" class="title-main" data-slot="title"></th></tr>' +
        '<tr class="doc-col-row"><th>코스</th><th>배송순서</th><th>업체번호</th><th>약칭</th><th>배송주소</th><th>수거방식</th><th>배송 코멘트</th><th>거래처 번호</th></tr>' +
      '</thead>' +
      '<tbody></tbody>' +

  // 실제 데이터에 존재하는 코스만 렌더링되므로 여기 없는 코스는 자동으로 생략됨
  function buildAddressAllCourseBlock(course, items, merged) {

  function buildAddressAllDoc(merged) {
    var container = document.createElement('div');
    container.className = 'addressall-doc';
    merged.courses.forEach(function (course) {
      container.appendChild(buildAddressAllCourseBlock(course, merged.byCourse[course] || [], merged));
    });
    return container;
  }

  // ================= 화면 미리보기 (실제 인쇄와 동일한 DOM을 별도로 렌더링, 화면 축소는 이 컨테이너에만 적용) =================
  function buildPageFrame(node, flow) {
    var frame = document.createElement('div');
    frame.className = 'page-frame' + (flow ? ' flow-frame' : '');
    node.classList.add('page-card');
    frame.appendChild(node);
    return frame;
  }

  function fitPreviewPages() {
    var frames = Array.prototype.slice.call(previewSurface.querySelectorAll('.page-frame'));
    if (!frames.length) return;
    var vpRect = previewViewport.getBoundingClientRect();
    var availW = Math.max(vpRect.width - 52, 100);
    var availH = Math.max(vpRect.height - 52, 100);
    var zoomMul = state.zoomPct / 100;

    var infos = frames.map(function (f) {
      var card = f.querySelector('.page-card');
      var w = card.scrollWidth, h = card.scrollHeight;
      return { frame: f, card: card, w: w, h: h };
    });

    infos.forEach(function (info) {
      var s = Math.min(availW / info.w, 1);
      if (infos.length === 1 && !info.frame.classList.contains('flow-frame')) s = Math.min(s, availH / info.h, 1);
      s = Math.max(s * zoomMul, MIN_SCALE);
      info.card.style.transform = 'scale(' + s + ')';
      info.frame.style.width = (info.w * s) + 'px';
      info.frame.style.height = (info.h * s) + 'px';
    });
  }

  function renderPreview() {
    previewSurface.innerHTML = '';
    if (!state.merged) {
      var loading = document.createElement('div'); loading.className = 'preview-empty'; loading.textContent = '데이터를 불러오는 중입니다...';
      previewSurface.appendChild(loading); return;
    }
    if (state.merged.closedDay) {
      var closed = document.createElement('div'); closed.className = 'preview-empty'; closed.textContent = '이 날짜는 휴무일입니다 — 인쇄할 문서가 없습니다.';
      previewSurface.appendChild(closed); return;
    }
    if (state.docType === 'changes') {
      var msg = changesEmptyMessage();
      if (msg) {
        var note = document.createElement('div'); note.className = 'preview-empty'; note.textContent = msg;
        previewSurface.appendChild(note); return;
      }
      previewSurface.appendChild(buildPageFrame(buildChangesDoc(), true));
      requestAnimationFrame(fitPreviewPages);
      return;
    }
    if (state.docType === 'closer' || state.docType === 'closer_all_address') {
      var closerNode = buildCloserDoc(state.merged.courses.slice(), state.merged);
      previewSurface.appendChild(buildPageFrame(closerNode, true));
      requestAnimationFrame(fitPreviewPages);
      return;
    }
    if (state.docType === 'all_address') {
      var addrAllNode = buildAddressAllDoc(state.merged);
      previewSurface.appendChild(buildPageFrame(addrAllNode, true));
      requestAnimationFrame(fitPreviewPages);
      return;
    }
    var courses = getCoursesToPrint();
    if (!courses.length) {
      var none = document.createElement('div'); none.className = 'preview-empty'; none.textContent = '코스를 선택해주세요.';
      previewSurface.appendChild(none); return;
    }
    function appendDoc(kind) {
      courses.forEach(function (course) {
        var items = state.merged.byCourse[course];
        var driver = state.merged.drivers[course];
        var node = kind === 'status'
          ? buildStatusCourseBlock(course, items, driver, state.merged)
          : buildAddressCourseBlock(course, items, driver, state.merged);
        previewSurface.appendChild(buildPageFrame(node));
      });
    }
    if (state.docType === 'address') appendDoc('address');
    else if (state.docType === 'status') appendDoc('status');
    else { appendDoc('status'); appendDoc('address'); }

    requestAnimationFrame(fitPreviewPages);
  }

  zoomOut.addEventListener('click', function () { state.zoomPct = Math.max(50, state.zoomPct - 10); zoomLabel.textContent = state.zoomPct + '%'; fitPreviewPages(); });
  zoomIn.addEventListener('click', function () { state.zoomPct = Math.min(160, state.zoomPct + 10); zoomLabel.textContent = state.zoomPct + '%'; fitPreviewPages(); });

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fitPreviewPages, 80);
  });

  // ================= 인쇄 기록 (관리 화면 출력기록 탭과 공유) =================
  // ================= 출력본 남기기 (마감 때 출력한 현황지를 서버에 한 벌 저장) =================
  function readJsonLS(key, fallback) {
    try { var v = JSON.parse(localStorage.getItem(key) || 'null'); return v == null ? fallback : v; } catch (e) { return fallback; }
  }
  function writeJsonLS(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }

  function buildSnapshot(kind, courses) {
    var m = state.merged;
    if (!m || m.closedDay || !courses || !courses.length) return null;
    var out = [];
    courses.forEach(function (course) {
      var arr = (m.byCourse && m.byCourse[course]) || [];
      if (!arr.length) return;
      out.push({
        course: course,
        driver: (m.drivers && m.drivers[course]) || '',
        items: arr.map(function (it) { return { seq: it.deliveryOrder || '', no: it.companyNumber || '', name: it.nickname || '' }; })
      });
    });
    if (!out.length) return null;
    return { date: isoDate(state.selectedDate), kind: kind, courses: out };
  }

  function postSnapshot(snap) {
    // text/plain으로 보내면 브라우저가 사전 확인(preflight) 없이 바로 전송한다.
    return fetch(SNAPSHOT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(snap) })
      .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); });
  }

  function flushPendingSnapshots() {
    var pending = readJsonLS(STORAGE_KEYS.snapshotPending, []);
    if (!pending.length) return;
    writeJsonLS(STORAGE_KEYS.snapshotPending, []);
    pending.forEach(function (snap) {
      postSnapshot(snap).catch(function () { queueSnapshot(snap); });
    });
  }
  function queueSnapshot(snap) {
    var pending = readJsonLS(STORAGE_KEYS.snapshotPending, []);
    pending.push(snap);
    if (pending.length > 5) pending = pending.slice(pending.length - 5);
    writeJsonLS(STORAGE_KEYS.snapshotPending, pending);
  }

  function saveSnapshot(kind, courses) {
    if (kind !== 'status' && kind !== 'closer') return;
    var snap = buildSnapshot(kind, courses);
    if (!snap) return;
    // 같은 날·같은 문서·같은 내용을 연속으로 다시 출력하면 중복으로 쌓지 않는다.
    var sig = snap.date + '|' + kind + '|' + JSON.stringify(snap.courses);
    var sigs = readJsonLS(STORAGE_KEYS.snapshotSig, {});
    var sigKey = snap.date + '|' + kind;
    if (sigs[sigKey] === sig) return;
    postSnapshot(snap).then(function () {
      sigs[sigKey] = sig;
      var keys = Object.keys(sigs);
      if (keys.length > 20) delete sigs[keys[0]];
      writeJsonLS(STORAGE_KEYS.snapshotSig, sigs);
      // 방금 출력한 내용이 새 기준이 되므로 변경내역을 다시 계산한다.
      if (snap.date === isoDate(state.selectedDate)) loadSnapshot(snap.date);
    }).catch(function () { queueSnapshot(snap); });
  }

  // ================= 출력 후 변경내역 (마지막 출력본 vs 지금 화면) =================
  var SNAPSHOT_TIMEOUT_MS = 12000;

  function loadSnapshot(dateIso) {
    state.snapshotStatus = 'loading';
    updateChangesUI();
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, SNAPSHOT_TIMEOUT_MS);
    return fetch(SNAPSHOT_URL + '?date=' + encodeURIComponent(dateIso), { signal: controller.signal })
      .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function (data) {
        if (isoDate(state.selectedDate) !== dateIso) return;  // 그 사이 날짜를 바꿨다
        if (!data || !data.ok) throw new Error('bad response');
        state.snapshot = data;
        state.snapshotStatus = 'ok';
        recomputeChanges();
      })
      .catch(function () {
        if (isoDate(state.selectedDate) !== dateIso) return;
        state.snapshot = null; state.snapshotStatus = 'error';
        state.changes = { items: [], drivers: [], printedAt: '' };
      })
      .then(function () {
        clearTimeout(timer);
        updateChangesUI();
        if (state.docType === 'changes') { renderPreview(); updatePrintButton(); }
      });
  }

  // 인쇄 모양 확인용 예시(실제 데이터가 아니다). 변경내역이 하나도 없는 날에도 출력물이 어떻게 나오는지 볼 수 있다.
  var SAMPLE_CHANGES = {
    printedAt: '2026-10-05 17:40:12',
    items: [
      { no: '24', name: '헬스코인', type: '코스 이동', from: 'B-02', to: 'C-01' },
      { no: '153', name: '비르덴', type: '코스 이동', from: 'E-03', to: 'C-05' },
      { no: '120', name: '더부즈', type: '추가', from: '-', to: 'F-13' },
      { no: '26', name: '보그', type: '제외', from: 'F-01', to: '제외' },
      { no: '61', name: '묘우', type: '순서 변경', from: 'F-05', to: 'F-02' }
    ],
    drivers: [{ course: 'F', from: '홍길동', to: '김철수' }]
  };
  function activeChanges() { return state.testMode ? SAMPLE_CHANGES : state.changes; }

  var CHANGE_TYPE_ORDER = { '코스 이동': 0, '추가': 1, '제외': 2, '순서 변경': 3 };

  function recomputeChanges() {
    var out = { items: [], drivers: [], printedAt: '' };
    var snap = state.snapshot, merged = state.merged;
    if (!snap || !snap.courses || !snap.courses.length || !merged || merged.closedDay) { state.changes = out; return; }

    var base = {}, baseCourses = {};
    snap.courses.forEach(function (c) {
      baseCourses[c.course] = c;
      if (c.printed_at && c.printed_at > out.printedAt) out.printedAt = c.printed_at;
      (c.items || []).forEach(function (it) { if (it.no) base[it.no] = { course: c.course, seq: it.seq, name: it.name }; });
    });
    var now = {};
    merged.courses.forEach(function (course) {
      (merged.byCourse[course] || []).forEach(function (it) {
        if (it.companyNumber) now[it.companyNumber] = { course: course, seq: it.deliveryOrder, name: it.nickname };
      });
    });

    // 같은 코스에 그대로 남은 업체끼리의 상대 순서(1등, 2등...)로 "순서 변경"을 판단한다.
    // 중간 업체 하나가 빠지거나 끼어들 때 뒤 업체 번호가 전부 밀려도 순서 변경으로 치지 않기 위해서다.
    var rankBase = {}, rankNow = {};
    Object.keys(baseCourses).forEach(function (course) {
      var common = (baseCourses[course].items || []).filter(function (it) { return it.no && now[it.no] && now[it.no].course === course; });
      common.forEach(function (it, i) { rankBase[it.no] = i; });
      var nowCommon = (merged.byCourse[course] || []).filter(function (it) { return base[it.companyNumber] && base[it.companyNumber].course === course; });
      nowCommon.forEach(function (it, i) { rankNow[it.companyNumber] = i; });
    });

    Object.keys(now).forEach(function (no) {
      var n = now[no], b = base[no];
      if (b) {
        if (b.course !== n.course) out.items.push({ no: no, name: n.name || b.name, type: '코스 이동', from: b.seq || b.course, to: n.seq || n.course });
        else if (rankBase[no] !== rankNow[no]) out.items.push({ no: no, name: n.name || b.name, type: '순서 변경', from: b.seq, to: n.seq });
      } else if (baseCourses[n.course]) {
        out.items.push({ no: no, name: n.name, type: '추가', from: '-', to: n.seq || n.course });
      }
    });
    Object.keys(base).forEach(function (no) {
      if (!now[no]) out.items.push({ no: no, name: base[no].name, type: '제외', from: base[no].seq || base[no].course, to: '제외' });
    });
    out.items.sort(function (a, b) {
      return (CHANGE_TYPE_ORDER[a.type] - CHANGE_TYPE_ORDER[b.type]) || (parseInt(a.no, 10) - parseInt(b.no, 10) || 0) || (a.no < b.no ? -1 : a.no > b.no ? 1 : 0);
    });

    snap.courses.forEach(function (c) {
      if (merged.courses.indexOf(c.course) === -1) return;
      var was = cleanDriverName(c.driver), is = cleanDriverName(merged.drivers[c.course]);
      if (was !== is) out.drivers.push({ course: c.course, from: was || '미배정', to: is || '미배정' });
    });
    state.changes = out;
  }

  function changesEmptyMessage() {
    if (state.testMode) return '';
    if (state.snapshotStatus === 'loading' || state.snapshotStatus === 'idle') return '출력본과 비교하는 중입니다...';
    if (state.snapshotStatus === 'error') return '출력본을 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 눌러주세요.';
    if (!state.snapshot || !state.snapshot.courses || !state.snapshot.courses.length) {
      return '이 배송일의 출력본이 아직 없습니다. 현황지나 마감자용 수량표를 출력하면 그 내용이 기준으로 저장됩니다.';
    }
    if (!state.changes.items.length && !state.changes.drivers.length) return '마지막 출력본과 비교해 달라진 내용이 없습니다.';
    return '';
  }

  function updateChangesUI() {
    var btn = document.getElementById('changesDocBtn');
    if (!btn) return;
    var badge = document.getElementById('changesBadge'), sub = document.getElementById('changesSub');
    var n = state.changes.items.length + state.changes.drivers.length;
    var has = state.snapshotStatus === 'ok' && n > 0;
    btn.classList.toggle('has-changes', has);
    if (has) {
      badge.textContent = '(있습니다.)';
      sub.textContent = '마지막 출력(' + state.changes.printedAt.replace(/^\d{4}-/, '') + ') 이후 ' + n + '건 달라짐 · 눌러서 확인';
    } else {
      badge.textContent = (state.snapshotStatus === 'loading' || state.snapshotStatus === 'idle') ? ''
        : state.snapshotStatus === 'error' ? '(확인 실패)' : '(없습니다.)';
      sub.textContent = (state.snapshotStatus === 'loading' || state.snapshotStatus === 'idle') ? '출력본과 비교하는 중...'
        : state.snapshotStatus === 'error' ? '출력본 확인 실패 · 눌러서 다시 시도'
        : (!state.snapshot || !state.snapshot.courses.length) ? '출력본 없음 · 출력하면 기준으로 저장'
        : '마지막 출력본과 같음';
    }
  }

  function escHtml(v) {
    return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function buildChangesDoc() {
    var container = document.createElement('div');
    container.className = 'closer-doc changes-doc';
    var c = activeChanges();
    var box = document.createElement('div');
    box.className = 'closer-header-box';
    box.innerHTML =
      '<div class="closer-kicker">' + (state.testMode ? '테스트 출력 · 예시 내용입니다 (실제 데이터 아님)' : '현황지 출력 후') + '</div>' +
      '<div class="closer-main-title">라벨코스 변경내역</div>' +
      '<div class="closer-meta-line" data-slot="meta"></div>';
    box.querySelector('[data-slot="meta"]').textContent =
      fmtBigDate(state.selectedDate) + ' · 출력본 ' + c.printedAt + ' 기준 · 변경 ' + (c.items.length + c.drivers.length) + '건 · 인쇄 ' + fmtPrintTime(new Date());
    container.appendChild(box);

    if (c.items.length) {
      var wrap = document.createElement('div');
      var rows = c.items.map(function (it) {
        return '<tr><td class="col-companyno">' + escHtml(it.no) + '</td><td class="col-nickname">' + escHtml(it.name) + '</td>' +
          '<td class="chg-type">' + escHtml(it.type) + '</td><td>' + escHtml(it.from) + '</td><td class="chg-to">' + escHtml(it.to) + '</td></tr>';
      }).join('');
      wrap.innerHTML =
        '<table class="doc-table closer-table changes-table"><colgroup><col style="width:14%"><col style="width:28%"><col style="width:18%"><col style="width:20%"><col style="width:20%"></colgroup>' +
        '<thead><tr class="closer-col-row"><th>업체번호</th><th>약칭</th><th>구분</th><th>출력본</th><th>지금</th></tr></thead><tbody>' + rows + '</tbody></table>';
      container.appendChild(wrap.firstElementChild);
    }
    if (c.drivers.length) {
      var t = document.createElement('div'); t.className = 'changes-section-title'; t.textContent = '기사 변경';
      container.appendChild(t);
      var wrap2 = document.createElement('div');
      wrap2.innerHTML =
        '<table class="doc-table closer-table changes-table"><colgroup><col style="width:20%"><col style="width:40%"><col style="width:40%"></colgroup>' +
        '<thead><tr class="closer-col-row"><th>코스</th><th>출력본 기사</th><th>지금 기사</th></tr></thead><tbody>' +
        c.drivers.map(function (d) { return '<tr><td class="col-companyno">' + escHtml(d.course) + '</td><td>' + escHtml(d.from) + '</td><td class="chg-to">' + escHtml(d.to) + '</td></tr>'; }).join('') +
        '</tbody></table>';
      container.appendChild(wrap2.firstElementChild);
    }
    return container;
  }

  function printChangesDoc() {
    if (!canPrint()) return;
    printChanges.innerHTML = '';
    printChanges.appendChild(buildChangesDoc());
    // 변경내역 확인표는 출력본(기준)을 남기지 않는다 - 기준은 현황지/마감자용을 출력할 때만 바뀐다.
    doPrint('printing-changes');
  }

  function recordPrint(kind, courses) {
    saveSnapshot(kind, courses);
    try {
      var list = JSON.parse(localStorage.getItem(STORAGE_KEYS.printHistory) || '[]');
      list.push({ date: isoDate(state.selectedDate), kind: kind, courses: courses, at: new Date().toISOString() });
      if (list.length > 300) list = list.slice(list.length - 300);
      localStorage.setItem(STORAGE_KEYS.printHistory, JSON.stringify(list));
    } catch (e) {}
  }

  // ================= 인쇄 대상(별도 컨테이너) 렌더링 =================
  function renderPrintDoc(kind) {
    if (kind === 'closer') {
      printCloser.innerHTML = '';
      var allCourses = state.merged.courses.slice();
      printCloser.appendChild(buildCloserDoc(allCourses, state.merged));
      return;
    }
    if (kind === 'addressAll') {
      printAddressAll.innerHTML = '';
      printAddressAll.appendChild(buildAddressAllDoc(state.merged));
      return;
    }
    var target = kind === 'status' ? printStatus : printAddress;
    target.innerHTML = '';
    var courses = getCoursesToPrint();
    courses.forEach(function (course) {
      var items = state.merged.byCourse[course];
      var driver = state.merged.drivers[course];
      var node = kind === 'status'
        ? buildStatusCourseBlock(course, items, driver, state.merged)
        : buildAddressCourseBlock(course, items, driver, state.merged);
      target.appendChild(node);
    });
  }

  function hasPrintableContent(container) {
    var tbody = container.querySelector('table.doc-table tbody');
    return !!(tbody && tbody.querySelector('tr'));
  }

  function doPrint(bodyClass, afterFn) {
    if (state.isPrinting) return;
    state.isPrinting = true;
    document.body.classList.add(bodyClass);

    var cleanupDone = false, fallbackTimer = null;
    function cleanup() {
      if (cleanupDone) return;
      cleanupDone = true;
      if (fallbackTimer) clearTimeout(fallbackTimer);
      window.removeEventListener('afterprint', cleanup);
      document.body.classList.remove(bodyClass);
      state.isPrinting = false;
      if (afterFn) afterFn();
    }
    window.addEventListener('afterprint', cleanup);
    fallbackTimer = setTimeout(cleanup, 60000);

    var waitForRender = function () {
      return Promise.race([
        new Promise(function (resolve) { requestAnimationFrame(function () { requestAnimationFrame(resolve); }); }),
        new Promise(function (resolve) { setTimeout(resolve, 150); })
      ]);
    };
    var fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready.catch(function () {}) : Promise.resolve();
    fontsReady.then(waitForRender).then(function () { window.print(); }).catch(function () { cleanup(); });
  }

  function printSingle(kind) {
    if (!canPrint()) return;
    renderPrintDoc(kind);
    var container = kind === 'status' ? printStatus : printAddress;
    if (!hasPrintableContent(container)) { alert('인쇄할 내용이 없습니다.'); return; }
    var bodyClass = kind === 'status' ? 'printing-status' : 'printing-address';
    doPrint(bodyClass, function () { recordPrint(kind, getCoursesToPrint()); });
  }

  var btnChangesTest = $('btnChangesTest');
  btnChangesTest.addEventListener('click', function () {
    state.docType = 'changes'; state.testMode = true;
    renderAll();
  });

  btnPrintMain.addEventListener('click', function () {
    if (!canPrint()) return;
    if (state.docType === 'changes') { printChangesDoc(); return; }
    if (state.docType === 'status_address') { guideModal.classList.add('show'); return; }
    if (state.docType === 'closer') { printCloserDoc(); return; }
    if (state.docType === 'all_address') { printAddressAllDoc(); return; }
    if (state.docType === 'closer_all_address') { closerAllGuideModal.classList.add('show'); return; }
    printSingle(state.docType);
  });
  guideStatusBtn.addEventListener('click', function () { printSingle('status'); guideStatusBtn.classList.add('done'); });
  guideAddressBtn.addEventListener('click', function () { printSingle('address'); guideAddressBtn.classList.add('done'); });
  guideClose.addEventListener('click', function () {
    guideModal.classList.remove('show');
    guideStatusBtn.classList.remove('done'); guideAddressBtn.classList.remove('done');
  });

  closerAllStep1Btn.addEventListener('click', function () { printCloserDoc(); closerAllStep1Btn.classList.add('done'); });
  closerAllStep2Btn.addEventListener('click', function () { printAddressAllDoc(); closerAllStep2Btn.classList.add('done'); });
  closerAllDone.addEventListener('click', function () {
    closerAllGuideModal.classList.remove('show');
    closerAllStep1Btn.classList.remove('done'); closerAllStep2Btn.classList.remove('done');
  });

  function printCloserDoc() {
    if (!state.merged || state.merged.closedDay) return;
    renderPrintDoc('closer');
    var expected = state.merged.totalCount;
    var actual = printCloser.querySelectorAll('table.closer-table tbody tr').length;
    if (expected !== actual) {
      alert('마감자용 인쇄 오류: 전체 업체 수(' + expected + ')와 실제 인쇄될 행 수(' + actual + ')가 일치하지 않습니다. 인쇄를 중단했습니다.');
      return;
    }
    if (!hasPrintableContent(printCloser)) { alert('인쇄할 내용이 없습니다.'); return; }
    doPrint('printing-closer', function () { recordPrint('closer', state.merged.courses); });
  }

  function printAddressAllDoc() {
    if (!state.merged || state.merged.closedDay) return;
    renderPrintDoc('addressAll');
    var expected = state.merged.totalCount;
    var actual = printAddressAll.querySelectorAll('table.addressall-table tbody tr').length;
    if (expected !== actual) {
      alert('전체 주소지 인쇄 오류: 화면 데이터 건수(' + expected + ')와 실제 인쇄될 행 수(' + actual + ')가 일치하지 않습니다. 인쇄를 중단했습니다.');
      return;
    }
    if (!hasPrintableContent(printAddressAll)) { alert('인쇄할 내용이 없습니다.'); return; }
    doPrint('printing-address-all', function () { recordPrint('addressAll', state.merged.courses); });
  }

  // ================= 관리·편집 화면 이동 =================
  function openAdmin() { window.location.href = 'admin.html?date=' + isoDate(state.selectedDate); }
  btnEdit.addEventListener('click', openAdmin);
  btnOpenAdmin.addEventListener('click', openAdmin);

  // ================= 초기화 =================
  function init() {
    var qDate = getQueryDate_();
    state.selectedDate = qDate || new Date();
    refreshDateDisplay();
    clearScreenForDateChange();
    loadDayData(false);
    flushPendingSnapshots();
  }

  init();
})();
</script>
</body>
</html>
