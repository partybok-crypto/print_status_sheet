<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유성클리닝 현황지 출력</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #16324a;
    --blue: #2563eb;
    --blue-dark: #1d4ed8;
    --blue-bg: #eef4ff;
    --border: #e2e6ec;
    --bg: #f4f6f8;
    --text: #1e293b;
    --text-sub: #64748b;
    --red: #dc2626;
    --green: #16a34a;
    --left-w: 420px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--bg); color: var(--text);
  }
  button, select, input { font-family: inherit; }
  button { cursor: pointer; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  /* ================= 전체 셸 ================= */
  .field-shell { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .app-header {
    flex: 0 0 64px; height: 64px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 26px; background: #fff; border-bottom: 1px solid var(--border);
  }
  .app-header-left { font-size: 22px; font-weight: 900; color: var(--navy); letter-spacing: -.2px; }
  .app-header-right { display: flex; align-items: center; gap: 18px; }
  .conn-text { font-size: 14.5px; font-weight: 700; }
  .lang-switch { display: flex; gap: 4px; }
  .lang-btn { border: 1px solid #cfd6e0; background: #fff; color: #566; border-radius: 8px; padding: 6px 12px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .lang-btn { transition: transform .18s ease, box-shadow .18s ease, background-color .25s ease, color .25s ease, border-color .25s ease; }
  .lang-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(31,58,104,.25); border-color: #1f3a68; }
  .lang-btn:active { transform: translateY(0) scale(.94); box-shadow: none; }
  .lang-btn.active { background: #1f3a68; border-color: #1f3a68; color: #fff; }
  .lang-btn.pop { animation: langPop .45s ease; }
  @keyframes langPop { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(31,58,104,.5); } 40% { transform: scale(1.18); box-shadow: 0 0 0 8px rgba(31,58,104,.15); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(31,58,104,0); } }
  .conn-text.ok { color: var(--green); }
  .conn-text.err { color: var(--red); }
  .conn-text.pending { color: var(--text-sub); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border);
    background: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:hover { background: #f1f5f9; }

  .field-body { flex: 1; min-height: 0; display: flex; }

  /* ================= 왼쪽 패널 ================= */
  .left-panel {
    flex: 0 0 var(--left-w); width: var(--left-w); background: #fff; border-right: 1px solid var(--border);
    padding: 7px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px;
  }
  @media (max-width: 1100px) { :root { --left-w: 360px; } }
  /* 모바일(폭 820px 이하): 왼쪽 메뉴와 미리보기를 위아래로 쌓고 화면 전체를 스크롤한다 */
  @media screen and (max-width: 820px) {
    html, body { height: auto; overflow: auto; }
    .field-shell { height: auto; min-height: 100vh; overflow: visible; }
    .app-header { flex: none; height: auto; flex-wrap: wrap; gap: 8px; padding: 10px 14px; }
    .app-header-left { font-size: 18px; }
    .app-header-right { gap: 8px; flex-wrap: wrap; }
    .conn-text { font-size: 12.5px; }
    .lang-btn { padding: 5px 9px; font-size: 12.5px; }
    .field-body { flex-direction: column; }
    .left-panel { flex: none; width: auto; border-right: 0; border-bottom: 6px solid var(--bg); overflow: visible; padding: 10px 14px 14px; }
    .right-panel { flex: none; min-height: 70vh; }
    .preview-head { flex: none; height: auto; flex-wrap: wrap; gap: 6px 10px; padding: 8px 12px; }
    .preview-title { font-size: 15px; }
    .preview-viewport { flex: none; min-height: 60vh; padding: 10px; overflow-x: auto; }
    .w2-screen-bar { font-size: 13px; }
  }

  .section-label { font-size: 12px; font-weight: 800; color: var(--text-sub); margin-bottom: 4px; letter-spacing: .2px; }

  .inline-error {
    display: none; align-items: center; gap: 10px; background: #fef2f2; border: 1px solid #fecaca;
    color: var(--red); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; font-weight: 600; margin-bottom: 4px;
  }
  .inline-error.show { display: flex; }
  .inline-error button { margin-left: auto; height: 30px; padding: 0 10px; border-radius: 7px; border: 1px solid #fecaca; background: #fff; color: var(--red); font-weight: 700; font-size: 12.5px; }

  .date-box {
    width: 100%; min-height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 16px;
    border: 1.5px solid var(--border); border-radius: 12px; background: #fff; font-size: 17px; font-weight: 800;
    color: var(--navy); text-align: left;
  }
  .date-box:hover { border-color: var(--blue); }
  .date-box .ic { font-size: 18px; }
  .date-sub-row { display: flex; gap: 8px; margin-top: 4px; }
  .sub-btn {
    flex: 1; min-height: 34px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg);
    font-size: 13.5px; font-weight: 700; color: var(--navy); display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .sub-btn:hover:not(:disabled) { background: #e9edf2; }
  .sub-btn:disabled { opacity: .5; cursor: not-allowed; }

  .course-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
  .course-btn {
    min-height: 34px; border-radius: 10px; border: 1.5px solid var(--border); background: #fff;
    font-size: 14.5px; font-weight: 800; color: var(--navy); white-space: nowrap;
  }
  .course-btn:hover { border-color: var(--blue); }
  .course-btn.selected { background: var(--blue); border-color: var(--blue); color: #fff; }

  .info-card {
    margin-top: 5px; padding: 6px 14px; background: var(--blue-bg); border: 1px solid #cfe0ff; border-radius: 10px;
    font-size: 13.5px; font-weight: 700; color: var(--navy); display: flex; align-items: center; gap: 8px;
  }

  /* 자주 사용하는 출력 — 큰 주요 버튼 2개 */
  .primary-doc-list { display: flex; flex-direction: column; gap: 8px; }
  .primary-doc-btn {
    width: 100%; min-height: 64px; border: 1.5px solid var(--blue); border-radius: 14px; background: #fff;
    color: var(--blue); text-align: left; padding: 8px 16px; display: flex; flex-direction: column;
    justify-content: center; gap: 2px;
  }
  /* 이름표 출력 버튼: 문서 선택 카드가 아니라 창을 여는 버튼이라 .primary-doc-btn 과 클래스를 분리(선택 로직 제외) */
  .nametag-open-btn {
    width: 100%; min-height: 64px; border: 1.5px solid var(--blue); border-radius: 14px; background: #fff;
    color: var(--blue); text-align: left; padding: 8px 16px; display: flex; flex-direction: column;
    justify-content: center; gap: 2px; cursor: pointer;
  }
  .nametag-open-btn .pdb-title { font-size: 17.5px; font-weight: 800; color: inherit; }
  .nametag-open-btn .pdb-title::before { content: '⑥ '; }
  .nametag-open-btn .pdb-sub { font-size: 12.5px; font-weight: 600; color: var(--text-sub); }
  .nametag-open-btn:hover { background: var(--blue-bg); }
  /* 이름표 창: 기본 크기의 약 2배. 화면 높이가 900px보다 낮으면 --s 로 창 전체가 비율대로 줄어 한 화면에 들어온다 */
  .modal-box.nt-box { --s: min(1px, calc(100vh / 900)); width: calc(960 * var(--s)); max-width: 100%; max-height: 96vh; overflow-y: auto; padding: calc(20 * var(--s)) calc(36 * var(--s)) 0; border-radius: calc(26 * var(--s)); }
  .modal-box.nt-box .modal-title { font-size: calc(32 * var(--s)); margin-bottom: calc(10 * var(--s)); }
  .nt-search { display: flex; gap: calc(14 * var(--s)); margin-bottom: calc(8 * var(--s)); }
  .nt-search input { flex: 1; min-width: 0; height: calc(78 * var(--s)); padding: 0 calc(22 * var(--s)); border: 2px solid var(--border); border-radius: calc(18 * var(--s)); font-size: calc(30 * var(--s)); }
  .nt-search button { height: calc(78 * var(--s)); padding: 0 calc(32 * var(--s)); border: 0; border-radius: calc(18 * var(--s)); background: var(--blue); color: #fff; font-weight: 700; font-size: calc(28 * var(--s)); }
  .nt-msg { font-size: calc(22 * var(--s)); color: var(--text-sub); margin: 0 0 calc(8 * var(--s)); min-height: calc(30 * var(--s)); line-height: 1.35; }
  .nt-main { display: flex; gap: calc(28 * var(--s)); align-items: flex-start; }
  .nt-canvas { display: none; width: calc(440 * var(--s)); height: calc(440 * var(--s)); border: 2px solid var(--border); background: #fff; flex: 0 0 auto; }
  .nt-loaded .nt-canvas { display: block; }
  .nt-fields { display: none; flex: 1 1 0; min-width: 0; }
  .nt-loaded .nt-fields { display: block; }
  .nt-fields .modal-field { margin-bottom: calc(8 * var(--s)); }
  .nt-fields .modal-field label { font-size: calc(22 * var(--s)); margin-bottom: calc(4 * var(--s)); }
  .nt-fields .modal-field input { height: calc(64 * var(--s)); font-size: calc(28 * var(--s)); padding: 0 calc(20 * var(--s)); border-radius: calc(16 * var(--s)); }
  .modal-actions.nt-actions { flex-wrap: wrap; gap: calc(18 * var(--s)); margin-top: calc(10 * var(--s)); padding: calc(12 * var(--s)) 0 calc(16 * var(--s)); position: sticky; bottom: 0; background: #fff; border-top: 2px solid var(--border); }
  .modal-actions.nt-actions button { min-height: calc(80 * var(--s)); padding: 0 calc(40 * var(--s)); border-radius: calc(18 * var(--s)); font-size: calc(28 * var(--s)); }
  .nt-actions .confirm:disabled { opacity: .45; }
  .primary-doc-btn .pdb-title { font-size: 17.5px; font-weight: 800; color: inherit; }
  .primary-doc-btn .pdb-sub { font-size: 12.5px; font-weight: 600; color: var(--text-sub); }
  .primary-doc-btn .pdb-title[data-no]::before { content: attr(data-no) ' '; }
  .primary-doc-btn:hover { background: var(--blue-bg); }
  .primary-doc-btn.selected { background: var(--blue-dark); border-color: var(--blue-dark); color: #fff; }
  .primary-doc-btn.selected .pdb-sub { color: rgba(255,255,255,.85); }
  .primary-doc-btn.selected:hover { background: var(--blue-dark); }
  /* 출력본과 달라진 내용이 있을 때 눈에 띄게 */
  .primary-doc-btn.has-changes { border-color: #ea580c; background: #fff7ed; color: #c2410c; }
  .primary-doc-btn.has-changes .pdb-sub { color: #9a3412; }
  .primary-doc-btn.has-changes.selected { background: #c2410c; border-color: #c2410c; color: #fff; }
  .primary-doc-btn.has-changes.selected .pdb-sub { color: rgba(255,255,255,.9); }
  .pdb-badge { margin-left: 4px; font-size: 14px; font-weight: 800; color: #64748b; }
  .primary-doc-btn.has-changes .pdb-badge { color: #c2410c; }
  .primary-doc-btn.selected .pdb-badge { color: rgba(255,255,255,.9); }

  /* 기타 출력 — 작은 단독 출력 버튼 4개 */
  .other-doc-head { display: flex; align-items: baseline; gap: 8px; margin-top: 3px; }
  .other-doc-title { font-size: 12.5px; font-weight: 800; color: var(--text-sub); }
  .other-doc-sub { font-size: 11px; font-weight: 600; color: #94a3b8; }
  .other-doc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; margin-top: 4px; }
  .other-doc-btn {
    min-height: 38px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); border-radius: 10px; background: #fafbfc; font-size: 13px; font-weight: 700;
    line-height: 1.15; text-align: center; color: var(--text-sub); padding: 2px 6px; white-space: nowrap;
  }
  .other-doc-btn:hover { background: #f1f5f9; }
  .other-doc-btn.selected { border-color: var(--blue); background: var(--blue-bg); color: var(--navy); }

  .print-section { margin-top: auto; padding-top: 2px; }
  .print-btn {
    width: 100%; min-height: 48px; background: var(--blue); color: #fff; border: 0; border-radius: 14px;
    font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .print-btn:hover:not(:disabled) { background: var(--blue-dark); }
  .print-btn:disabled { opacity: .45; cursor: not-allowed; }
  .print-sub-row { display: flex; gap: 8px; margin-top: 4px; }
  .print-caption { text-align: center; font-size: 11px; color: var(--text-sub); margin-top: 2px; }

  .admin-open-btn {
    width: 100%; min-height: 34px; margin-top: 4px; border: 1.5px solid var(--blue); background: #fff;
    color: var(--blue); border-radius: 12px; font-weight: 700; font-size: 13.5px;
  }
  .admin-open-btn:hover { background: var(--blue-bg); }

  /* ================= 오른쪽 미리보기 패널 ================= */
  .right-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
  .preview-head {
    flex: 0 0 56px; height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 22px;
    background: #fff; border-bottom: 1px solid var(--border);
  }
  .preview-title { font-size: 17px; font-weight: 900; color: var(--navy); white-space: nowrap; }
  .preview-badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .preview-badge { padding: 4px 11px; border-radius: 20px; font-size: 12.5px; font-weight: 700; background: #eef1f5; color: var(--text-sub); }
  .preview-badge.b-solid { background: var(--blue); color: #fff; }
  .preview-badge.b-soft { background: var(--blue-bg); color: var(--blue); }
  .zoom-controls { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .zoom-controls button {
    width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: #fff;
    font-size: 16px; font-weight: 800; color: var(--navy);
  }
  .zoom-controls button:hover { background: #f1f5f9; }
  .zoom-controls #zoomLabel { min-width: 48px; text-align: center; font-weight: 800; font-size: 13.5px; color: var(--navy); }

  .preview-viewport { flex: 1; min-height: 0; overflow: auto; display: flex; justify-content: center; padding: 26px; }
  .preview-surface { display: flex; flex-direction: column; align-items: center; gap: 18px; margin: auto 0; }
  .page-frame { position: relative; overflow: hidden; }
  .page-card { position: absolute; top: 0; left: 0; transform-origin: top left; background: #fff; outline: 1px solid var(--border); box-shadow: 0 1px 5px rgba(16,24,40,.07); }
  .preview-empty { padding: 70px 30px; text-align: center; color: var(--text-sub); font-size: 16px; font-weight: 700; }

  /* ================= 문서 공통 표 스타일 (인쇄와 화면 미리보기가 동일한 마크업 사용) ================= */
  .doc-page { background: #fff; }
  .print-course + .print-course { margin-top: 10mm; }
  table.doc-table { border-collapse: collapse; table-layout: fixed; }
  .status-table.doc-table { width: 210mm; }
  .address-table.doc-table { width: 297mm; }
  .closer-table.doc-table { width: 210mm; }
  .changes-table th, .changes-table td { font-size: 13pt; }
  .changes-table td.chg-type { font-weight: 800; }
  .changes-table td.chg-to { font-weight: 800; color: #b91c1c; }
  .changes-section-title { font-size: 13pt; font-weight: 800; margin: 6mm 0 2mm; }
  table.doc-table thead { display: table-header-group; }
  table.doc-table th, table.doc-table td {
    border: 1px solid #000; padding: 5px 7px; text-align: center; overflow-wrap: break-word; word-break: break-word;
  }
  table.doc-table tbody tr { break-inside: avoid; page-break-inside: avoid; }

  tr.doc-title-row th { background: var(--navy); color: #fff; font-size: 13pt; padding: 8px; }
  tr.doc-title-row .title-main { font-size: 16pt; font-weight: 900; letter-spacing: .4px; }
  tr.doc-col-row th { background: #f3f4f6; font-weight: 700; font-size: 12pt; }

  .status-table td { font-size: 14pt; }
  .status-table td.col-companyno, .status-table td.col-nickname { font-weight: 700; font-size: 14pt; }
  .status-table td.col-shipno { font-weight: 700; font-size: 20pt; }
  .status-table td.col-qty { border: 2px solid #1d4ed8; }
  .status-table th .th-sub { font-size: 8pt; font-weight: 700; color: #000; }
  .status-table td.col-bag .packed-gray, .status-table td.col-towel .packed-gray { display: block; color: #9ca3af; font-size: 7.5pt; font-weight: 500; line-height: 1.2; }
  .status-table td.col-bag .packed-gray .packed-num, .status-table td.col-towel .packed-gray .packed-num { font-size: 16pt; font-weight: 600; line-height: 1.1; }
  .status-table td.has-note { background: #fff59d; color: var(--red); font-weight: 700; }
  .status-table tr.missing-row td.col-nickname, .status-table tr.missing-row td.col-companyno { background: #fef2f2; }

  .address-table td, .address-table th { font-size: 12.5pt; }
  .address-table td.col-companyno, .address-table td.col-nickname { font-weight: 700; }
  .address-table td.col-address { text-align: left; }
  .address-table td.col-method { color: var(--blue); font-weight: 700; }
  .address-table td.col-comment { text-align: left; }
  .address-table td.col-comment.has-comment { background: #eafbea; }
  .address-table td.col-comment.has-note { background: #fff59d; color: var(--red); font-weight: 700; }
  .address-table td.col-phone { font-weight: 700; font-size: 13pt; color: var(--red); white-space: normal; }
  .address-table tr.missing-field td.col-address { background: #fef2f2; }
  .address-table tr.origin-row td { background: #fff8e1; font-weight: 700; }
  .address-table tr.cart-row td { background: #eafbea; }
  .address-table tr.cart-row td.col-comment.has-note { background: #fff59d; }

  /* 차량(지원차/자차) 체크 + 총 수거량 기재표 — 현황지·마감자용 수량표 하단 공용 */
  .vehicle-check-table.doc-table {
    width: 210mm; margin-top: -1px; background: #fff;
    break-inside: avoid; page-break-inside: avoid; break-before: avoid; page-break-before: avoid;
  }
  .vehicle-check-table tr.vc-head-row th { background: #f3f4f6; font-weight: 800; font-size: 13pt; padding: 7px 6px; }
  .vehicle-check-table tr.vc-input-row td { height: 14mm; background: #fff; border-width: 2px; }

  .address-footnote {
    width: 297mm; text-align: center; font-size: 12pt; font-weight: 700;
    border: 1px solid #000; border-top: 0; padding: 8px; break-inside: avoid; background: #fff;
  }

  /* 전체 주소지 전용 — A4 세로(portrait) 표. 다른 문서(코스별 주소지 등)의 스타일과 독립적으로 관리 */
  .addressall-table.doc-table { width: 210mm; }
  .addressall-table td, .addressall-table th { font-size: 9pt; }
  .addressall-table thead th { font-size: 9.5pt; }
  .addressall-table td.col-course { font-weight: 700; }
  .addressall-table td.col-companyno, .addressall-table td.col-nickname { font-weight: 700; }
  .addressall-table td.col-address {
    text-align: left; white-space: normal; overflow-wrap: anywhere; word-break: keep-all; line-height: 1.25;
  }
  .addressall-table td.col-method { color: var(--blue); font-weight: 700; }
  .addressall-table td.col-comment {
    text-align: left; white-space: normal; overflow-wrap: anywhere; word-break: keep-all; line-height: 1.25;
  }
  .addressall-table td.col-comment.has-comment { background: #eafbea; }
  .addressall-table td.col-comment.has-note { background: #fff59d; color: var(--red); font-weight: 700; }
  .addressall-table td.col-phone { font-weight: 700; color: var(--red); white-space: normal; overflow-wrap: anywhere; }
  .addressall-table tr.missing-field td.col-address { background: #fef2f2; }
  .addressall-table tr.cart-row td { background: #eafbea; }

  /* 전체 주소지의 코스별 제목 바 — 색상은 공통 courseColor()가 인라인 style로 지정, 여기서는 레이아웃만 */
  .addressall-table tr.doc-title-row th { font-size: 13pt; text-align: left; padding: 8px 10px; }
  .addressall-table tr.doc-col-row th { font-weight: 800; }

  /* 마감자용 수량표 — 배송기사용 문서와 혼동되지 않는 대형 제목 + 단일 연속 표 */

<div class="field-shell no-print">
  <header class="app-header">
    <div class="app-header-left" data-i18n="appTitle">유성클리닝 현황지 출력</div>
    <div class="app-header-right">
      <div class="lang-switch" id="langSwitch">

  <div class="field-body">
    <aside class="left-panel" id="leftPanel">

      <div class="inline-error" id="inlineError">

        <button id="btnRetry" data-i18n="retry">재시도</button>

          <button class="sub-btn" id="btnNextBiz"><span>📅</span><span data-i18n="nextBiz">다음 영업일</span></button>
        </div>
      </div>

      <div class="field-section">
        <div class="section-label" data-i18n="sec2">2. 코스 선택</div>
        <div class="course-grid" id="courseGrid"></div>
        <div class="info-card" id="courseInfoCard">데이터를 불러오는 중...</div>
      </div>

      <div class="field-section">
        <div class="section-label" data-i18n="sec3">3. 자주 사용하는 출력</div>
        <div class="primary-doc-list" id="primaryDocList">
          <button class="primary-doc-btn" data-doc="status_address">
            <span class="pdb-title" data-no="①" data-i18n="pdbStatusAddr">현황지 + 주소지</span>
            <span class="pdb-sub" data-i18n="pdbStatusAddrSub">배송기사용 · 2개 문서 연속 출력</span>
          </button>
          <button class="primary-doc-btn" data-doc="wash">
            <span class="pdb-title" data-no="②" data-i18n="pdbWash">세탁공정</span>
            <span class="pdb-sub" data-i18n="pdbWashSub">세탁팀용 · 합세탁 체크표 출력</span>
          </button>
          <button class="primary-doc-btn" data-doc="washCheck">
            <span class="pdb-title" data-no="③" data-i18n="pdbWashCheck">합세탁 체크표</span>
            <span class="pdb-sub" data-i18n="pdbWashCheckSub">마감자용 · 합세탁 가능 여부 체크</span>
          </button>
          <button class="primary-doc-btn" data-doc="closer_all_address">
            <span class="pdb-title" data-no="④" data-i18n="pdbCloserAll">마감자용 수량표 + 전체주소지</span>
            <span class="pdb-sub" data-i18n="pdbCloserAllSub">세탁 마감용 · 2개 문서 연속 출력</span>
          </button>
          <button class="primary-doc-btn" data-doc="changes" id="changesDocBtn">
            <span class="pdb-title" data-no="⑤"><span data-i18n="pdbChanges">출력 후 라벨코스 변경내역</span> <span class="pdb-badge" id="changesBadge"></span></span>
            <span class="pdb-sub" id="changesSub">출력본과 비교하는 중...</span>
          </button>
          <button type="button" class="nametag-open-btn" id="btnNameTag">
            <span class="pdb-title" data-i18n="pdbNameTag">이름표 출력</span>
            <span class="pdb-sub" data-i18n="pdbNameTagSub">업체번호 입력 · 라벨 프린터로 이름표 1장 출력</span>
          </button>
        </div>

        <div class="other-doc-head">
          <span class="other-doc-title" data-i18n="otherTitle">기타 출력</span>
          <span class="other-doc-sub" data-i18n="otherSub">필요할 때만 선택하세요</span>
        </div>
        <div class="other-doc-grid" id="otherDocGrid">
          <button class="other-doc-btn" data-doc="address" data-i18n="odAddress">주소지만</button>
          <button class="other-doc-btn" data-doc="status" data-i18n="odStatus">현황지만</button>
          <button class="other-doc-btn" data-doc="closer" data-i18n="odCloser">마감자용 수량표만</button>
          <button class="other-doc-btn" data-doc="all_address" data-i18n="odAllAddr">전체주소지만</button>
        </div>
      </div>

      <div class="field-section print-section">
        <div class="section-label" data-i18n="sec4">4. 인쇄</div>
        <button class="print-btn" id="btnPrintMain" disabled><span>🖨</span><span id="printBtnLabel">인쇄</span></button>
        <div class="print-sub-row">
          <button class="sub-btn" id="btnEdit"><span>✏</span><span data-i18n="edit">내용 수정</span></button>
          <button class="sub-btn" id="btnChangesTest"><span>🧪</span><span data-i18n="changesTest">변경내역 테스트 출력</span></button>
        </div>
        <div class="print-caption" data-i18n="caption">미리보기와 동일하게 출력됩니다</div>
      </div>

      <button class="admin-open-btn" id="btnOpenAdmin"><span data-i18n="openAdmin">🔗 관리·편집 화면 열기</span></button>
    </aside>

    <main class="right-panel">
      <div class="preview-head">
        <div class="preview-title" data-i18n="previewTitle">인쇄 미리보기</div>
        <div class="preview-badges" id="previewBadges"></div>
        <div class="zoom-controls">
          <button id="zoomOut">−</button>
          <span id="zoomLabel">100%</span>
          <button id="zoomIn">＋</button>
        </div>
      </div>
      <div class="preview-viewport" id="previewViewport">
        <div class="preview-surface" id="previewSurface"></div>
      </div>
    </main>
  </div>
</div>

<!-- 인쇄 대상 문서 컨테이너 — .no-print 조상 밖에 위치해야 인쇄 시 실제로 렌더링됨 -->

  // ================= 날짜/요일 =================
  function isoDate(d) {
    var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  function weekdayFromDate(d) { return WEEKDAY_FROM_JS_DAY[d.getDay()]; }
  function isoWeekNumber(dateObj) {
    var date = new Date(Date.UTC(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate()));
    var dayNum = date.getUTCDay() || 7;
    date.setUTCDate(date.getUTCDate() + 4 - dayNum);
    var yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
    return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
  }
  function fmtDisplayDate(d) { return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + isoWeekNumber(d) + '주차)'; }
  function fmtBigDate(d) {
    var wd = WEEKDAY_FULL[weekdayFromDate(d)] || '';
    return d.getFullYear() + '년 ' + (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + wd;
  }

    function tryDate(d) {
      attempts++;
      var dateIso = isoDate(d);
      var weekday = weekdayFromDate(d);
      var cached = state.rawCache[dateIso];
      if (cached) {
        if (cached.closedDay && attempts < 8) { var nd = new Date(d); nd.setDate(nd.getDate() + 1); tryDate(nd); return; }
        finish(d);
        return;
      }
      callGAS({ action: 'getData', weekday: weekday, date: dateIso })
        .then(function (data) {
          if (data && data.success && data.requestedDate === dateIso) {
            data.__at = Date.now(); state.rawCache[dateIso] = data;
            if (data.closedDay && attempts < 8) { var nd2 = new Date(d); nd2.setDate(nd2.getDate() + 1); tryDate(nd2); return; }
            finish(d);
          } else if (attempts < 8) {
            var nd3 = new Date(d); nd3.setDate(nd3.getDate() + 1); tryDate(nd3);
          } else { finish(d); }
        })
        .catch(function () { finish(d); });
    }
    function finish(d) {
      state.isResolvingNextBiz = false;
      btnNextBiz.disabled = false;
      setSelectedDate(d);

    var start = new Date(state.selectedDate); start.setDate(start.getDate() + 1);

  // ================= GAS 호출 =================
  function callGAS(payload, timeoutMs) {
    var url = getGasUrl();
    var controller = new AbortController();
    var timeoutId = setTimeout(function () { controller.abort(); }, timeoutMs || FETCH_TIMEOUT_MS);
    return fetch(url, { method: 'POST', body: JSON.stringify(payload), signal: controller.signal })
      .then(function (res) {
        clearTimeout(timeoutId);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }).finally(function () { clearTimeout(timeoutId); });
  }

  function hideInlineError() { inlineError.classList.remove('show'); }
  function showInlineError(msg) { inlineErrorText.textContent = msg; inlineError.classList.add('show'); }

  // ================= 드래프트(로컬 임시저장, 관리 화면과 동일한 키 사용) =================
  function draftKey(dateIso) { return DRAFT_KEY_PREFIX + dateIso; }
  function emptyDraft(dateIso) {
    return { date: dateIso, driverOverrides: {}, courseMoves: {}, order: {}, excluded: {}, added: [], fieldEdits: {} };
  }
  function loadDraft(dateIso) {
    try {
      var raw = localStorage.getItem(draftKey(dateIso));
      if (!raw) return emptyDraft(dateIso);
      var parsed = JSON.parse(raw);
      var d = emptyDraft(dateIso);
      Object.keys(d).forEach(function (k) { if (parsed[k] !== undefined) d[k] = parsed[k]; });
      return d;
    } catch (e) { return emptyDraft(dateIso); }
  }

  // ================= 데이터 불러오기 (날짜 키 캐시 — 요일 키 절대 사용 안 함) =================
  function clearScreenForDateChange() {
    state.raw = null; state.merged = null; state.draft = null;
    state.snapshot = null; state.snapshotStatus = 'idle'; state.changes = { items: [], drivers: [], printedAt: '' };
    updateChangesUI();

  // 창을 켜둔 채 시트가 수정돼도 반영되도록, 3분 넘게 지난 뒤 화면으로 돌아오면 다시 불러온다.
  document.addEventListener('visibilitychange', function () {
    if (document.hidden || !state.raw || state.isLoading) return;
    var rc = state.rawCache[isoDate(state.selectedDate)];
    if (!rc || !rc.__at || Date.now() - rc.__at >= 180000) loadDayData(true);
  });

  function loadDayData(force) {
    var dateIso = isoDate(state.selectedDate);
    var weekday = state.weekday;

    var rc = state.rawCache[dateIso];
    if (!force && rc && rc.__at && Date.now() - rc.__at < 180000) {
      applyRawData(state.rawCache[dateIso], dateIso);
      return;
    }
    if (state.isLoading) return;
    if (force) { var wk0 = washKey(); delete state.washHist[wk0.pIso]; delete state.washSrc[wk0.pIso]; delete state.rawCache[wk0.pIso]; state.washMemo = null; }

    state.isLoading = true;
    hideInlineError();
    setConn('pending', 'connPending');

    // 포장수량·출력본은 현황지 데이터와 상관없이 조회되므로 같이 출발시킨다(순서대로 기다리면 느려 보임).
    state.prefetch = { date: dateIso, snap: loadSnapshot(dateIso), packed: loadPackedCount(dateIso) };

    // Apps Script가 가끔 응답 없이 멈춘다 - 오래 기다리지 말고 짧게 끊고 다시 요청한다(보통 두 번째는 바로 된다).
    var ATTEMPT_TIMEOUTS = [10000, 12000, 20000];
    function fetchWithRetry(i) {
      return callGAS({ action: 'getData', weekday: weekday, date: dateIso }, ATTEMPT_TIMEOUTS[i])
        .catch(function (err) {
          if (i + 1 >= ATTEMPT_TIMEOUTS.length || isoDate(state.selectedDate) !== dateIso) throw err;
          return fetchWithRetry(i + 1);
        });
    }
    fetchWithRetry(0)
      .then(function (data) {
        if (!data || !data.success) throw new Error((data && data.message) || t('errLoad'));
        if (data.requestedDate !== dateIso) {
          throw new Error('날짜 불일치: 요청 ' + dateIso + ' / 응답 ' + data.requestedDate);
        }
        if (isoDate(state.selectedDate) !== dateIso) return;
        data.__at = Date.now(); state.rawCache[dateIso] = data;
        try { localStorage.setItem('ps_lastgood_' + dateIso, JSON.stringify({ at: Date.now(), data: data })); } catch (e) {}
        applyRawData(data, dateIso);
        setConn('ok', 'connOk');
      })
      .catch(function (err) {
        // 끝내 못 불러왔으면 이 날짜로 마지막에 성공했던 데이터를 보여주되 오래된 것임을 알린다.
        try {
          var lg = JSON.parse(localStorage.getItem('ps_lastgood_' + dateIso) || 'null');
          if (lg && lg.data && lg.data.requestedDate === dateIso && isoDate(state.selectedDate) === dateIso) {
            applyRawData(lg.data, dateIso);
            var tm = new Date(lg.at);
            setConn('err', 'connErr');
            showInlineError('서버 응답이 없어 ' + (tm.getMonth() + 1) + '/' + tm.getDate() + ' ' + tm.getHours() + ':' + String(tm.getMinutes()).padStart(2, '0') + '에 불러왔던 이전 데이터를 보여줍니다. 출력 전에 「다시 시도」를 눌러 최신으로 바꿔주세요.');
            return;
          }
        } catch (e2) {}
        setConn('err', 'connErr');
        var msg = (err && err.name === 'AbortError')
          ? t('errTimeout')
          : (err && err.message) ? err.message : t('errGas');
        showInlineError(msg);
      })
      .finally(function () { state.isLoading = false; });
  }

  function applyRawData(data, dateIso) {
    state.raw = data;
    state.draft = loadDraft(dateIso);
    recomputeMerged();
    determineSelectedCourse();
    renderAll();
    var pf = state.prefetch;
    if (pf && pf.date === dateIso) {
      // 이미 같이 출발시킨 조회가 있다 - 먼저 끝났으면 지금 반영하고, 아직이면 끝날 때 반영된다.
      state.prefetch = null;
      recomputeChanges();
      updateChangesUI();
    } else {
      loadSnapshot(dateIso);
      loadPackedCount(dateIso);
    }
  }

  // ================= 병합(원본 + 드래프트) — 관리 화면과 동일한 규칙 =================
  function recomputeMerged() { state.merged = computeMerged(state.raw, state.draft); }

  function computeMerged(raw, draft) {
    if (!raw) return null;
    var list = [];
    (raw.items || []).forEach(function (it) {
      var id = 'r' + it.row;
      var clone = {};
      Object.keys(it).forEach(function (k) { clone[k] = it[k]; });
      clone.id = id; clone.isAdded = false; clone.isEdited = false; clone.origCourse = it.course;
      list.push(clone);
    });
    (draft.added || []).forEach(function (a) {
      var clone = {};
      Object.keys(a).forEach(function (k) { clone[k] = a[k]; });
      clone.isAdded = true; clone.isEdited = false; clone.origCourse = a.course;
      list.push(clone);
    });

    var excludedItems = list.filter(function (it) { return !!draft.excluded[it.id]; });
    list = list.filter(function (it) { return !draft.excluded[it.id]; });

    list.forEach(function (it) {
      if (draft.courseMoves[it.id] && draft.courseMoves[it.id] !== it.course) {
        it.course = draft.courseMoves[it.id]; it.isEdited = true;
      }
      var fe = draft.fieldEdits[it.id];
      if (fe) { Object.keys(fe).forEach(function (k) { it[k] = fe[k]; }); it.isEdited = true; }
    });

    var byCourse = {};
    list.forEach(function (it) { if (!byCourse[it.course]) byCourse[it.course] = []; byCourse[it.course].push(it); });
    var courses = Object.keys(byCourse).sort();

    courses.forEach(function (course) {
      var arr = byCourse[course];
      var orderIds = draft.order[course];
      if (orderIds && orderIds.length) {
        var idxMap = {};
        orderIds.forEach(function (id, i) { idxMap[id] = i; });
        arr.sort(function (a, b) {
          var ai = idxMap.hasOwnProperty(a.id) ? idxMap[a.id] : 100000 + (Number(a.orderSuffix) || 0);
          var bi = idxMap.hasOwnProperty(b.id) ? idxMap[b.id] : 100000 + (Number(b.orderSuffix) || 0);
          return ai - bi;
        });
      } else {
        arr.sort(function (a, b) { return (Number(a.orderSuffix) || 0) - (Number(b.orderSuffix) || 0); });
      }
      byCourse[course] = arr;
    });

    var drivers = {};
    courses.forEach(function (course) {
      if (draft.driverOverrides[course]) { drivers[course] = draft.driverOverrides[course]; }
      else {
        var counts = {}, best = '', bestN = 0;
        byCourse[course].forEach(function (it) { if (it.driver) counts[it.driver] = (counts[it.driver] || 0) + 1; });
        Object.keys(counts).forEach(function (name) { if (counts[name] > bestN) { best = name; bestN = counts[name]; } });
        drivers[course] = best || (raw.drivers && raw.drivers[course]) || '';
      }
    });

    var shipSeq = 0;
    courses.forEach(function (course) {
      byCourse[course].forEach(function (it, idx) {
        it.deliveryOrder = course + '-' + String(idx + 1).padStart(2, '0');
        shipSeq++; it.shippingNumber = shipSeq;
      });
    });

    var editedCount = list.filter(function (it) { return it.isEdited || it.isAdded; }).length;

    return {
      dayOfWeek: raw.dayOfWeek, requestedDate: raw.requestedDate, weekday: raw.weekday, origin: raw.origin, washWriter: raw.washWriter || '',
      closedDay: raw.closedDay, courses: courses, byCourse: byCourse, drivers: drivers, items: list,
      excludedItems: excludedItems, totalCount: list.length, excludedCount: excludedItems.length, editedCount: editedCount
    };
  }

  // ================= 코스 선택 (기억 + 기본값 규칙) =================
  function determineSelectedCourse() {
    if (!state.merged || state.merged.closedDay || !state.merged.courses.length) { state.selectedCourse = null; return; }
    var saved = null;
    try { saved = localStorage.getItem(STORAGE_KEYS.lastCourse); } catch (e) {}
    if (saved === ALL_SENTINEL) { state.selectedCourse = ALL_SENTINEL; return; }
    if (saved && state.merged.courses.indexOf(saved) !== -1) { state.selectedCourse = saved; return; }
    state.selectedCourse = state.merged.courses.indexOf('B') !== -1 ? 'B' : state.merged.courses[0];
  }
  function selectCourse(c) {
    state.selectedCourse = c;
    try { localStorage.setItem(STORAGE_KEYS.lastCourse, c); } catch (e) {}
    renderAll();
  }
  function getCoursesToPrint() {
    if (!state.merged) return [];
    if (state.selectedCourse === ALL_SENTINEL) return state.merged.courses.slice();
    if (state.selectedCourse && state.merged.courses.indexOf(state.selectedCourse) !== -1) return [state.selectedCourse];
    return [];
  }
  var ALWAYS_ALL_DOC_TYPES = { closer: true, all_address: true, closer_all_address: true, wash: true, washCheck: true };

  function selectDocType(type) { state.docType = type; if (type !== 'changes') state.testMode = false; renderAll(); }

  function renderAll() {

  function renderCourseGrid() {
    courseGrid.innerHTML = '';
    if (!state.merged) return;
    if (state.merged.closedDay || !state.merged.courses.length) {
      var empty = document.createElement('div');
      empty.style.cssText = 'grid-column:1/-1;padding:14px;text-align:center;color:var(--text-sub);font-size:14px;font-weight:700;';
      empty.textContent = t('closedCourse');
      courseGrid.appendChild(empty);
      return;
    }
    var allBtn = document.createElement('button');
    allBtn.className = 'course-btn' + (state.selectedCourse === ALL_SENTINEL ? ' selected' : '');
    allBtn.textContent = t('all');
    allBtn.addEventListener('click', function () { selectCourse(ALL_SENTINEL); });
    courseGrid.appendChild(allBtn);
    state.merged.courses.forEach(function (course) {

    var course = state.selectedCourse;

    if (state.docType === 'changes') return state.testMode || state.changes.items.length + state.changes.drivers.length > 0;
    if (ALWAYS_ALL_DOC_TYPES[state.docType]) return state.merged.courses.length > 0;

  }
  function isCodeComment(text) { return /비번|비밀번호|password/i.test(text || ''); }
  function isCartMethod(text) { return /카트/.test(text || ''); }
  function cleanDriverName(name) {
    return String(name || '').replace(/\s*01[016789][\d\-]{7,}\s*$/, '').trim();
  }
  function fmtTitleDate(d, dayOfWeek) { return (d.getMonth() + 1) + '월 ' + d.getDate() + '일 ' + (dayOfWeek || ''); }

  var BAG_SIZE_TOKENS = ['특대사이즈', '특대', '대형', '중형', '소형', '업체포대', '미니', '특소', '대', '중', '소'];
  function bagSizeDisplay(raw) {
    var s = String(raw || '').trim();
    if (!s) return '-';
    if (/\d/.test(s)) {
      for (var i = 0; i < BAG_SIZE_TOKENS.length; i++) {
        if (s.indexOf(BAG_SIZE_TOKENS[i]) !== -1) return BAG_SIZE_TOKENS[i];
      }
    }
    return s;
  }
  var NOTE_EMPHASIS_RE = /두번접기|펼치기|펼쳐서|밴딩|별도\s?포장|혼합금지|접지\s?않음/;
  function buildSpecialNote(it) {
    var parts = [];
    function addPart(v) { var s = String(v || '').trim(); if (s && parts.indexOf(s) === -1) parts.push(s); }
    addPart(it.bagDelivery);
    addPart(it.towelDelivery);
    if (it.deliveryComment && NOTE_EMPHASIS_RE.test(it.deliveryComment)) addPart(it.deliveryComment);
    return parts.length ? parts.join(' / ') : '-';
  }
  function noteHasEmphasis(text) { return NOTE_EMPHASIS_RE.test(text || ''); }

  // ================= 코스별 공통 색상 (모든 문서에서 재사용하는 단일 매핑) =================

  // 차량(지원차/자차) 체크 + 총 수거량 기재란 — 기사가 인쇄물에 직접 손으로 체크/기재하는 빈칸

  function renderStatusRows(tbody, items) {

  function buildStatusCourseBlock(course, items, driver, merged) {
    var wrap = document.createElement('div');
    wrap.className = 'print-course';
    wrap.innerHTML = STATUS_TEMPLATE;

    renderAddressRows(wrap.querySelector('tbody'), items, merged.origin);

  var CLOSER_COL_WIDTHS = [8, 11, 9, 12, 9, 14, 14, 9, 14];
  var CLOSER_TABLE_TEMPLATE =
    '<table class="doc-table closer-table">' +
      '<colgroup>' + CLOSER_COL_WIDTHS.map(function (w) { return '<col style="width:' + w + '%">'; }).join('') + '</colgroup>' +
      '<thead>' +
        '<tr class="closer-col-row"><th>배송순서</th><th>출고번호</th><th>업체번호</th><th>약칭</th><th>포대사이즈</th><th>포대배송<br><span class="th-sub">총수량 예상<br>(회색깔은 참고용)</span></th><th>수건배송</th><th>합세탁<br><span class="th-sub">가능 □ 체크</span></th><th>특이사항</th></tr>' +
      '</thead>' +
      '<tbody></tbody>' +

  // 업체 1행 — 코스가 바뀌는 첫 행에만 상단 굵은 테두리로 구분(별도 제목 행/강제 페이지 분리 없음)
  function buildCloserRow(it, isCourseStart) {
    var tr = document.createElement('tr');
    if (isCourseStart) tr.classList.add('course-start');
    tr.appendChild(td(it.deliveryOrder, 'col-order'));
    tr.appendChild(td(it.shippingNumber, 'col-shipno'));
    tr.appendChild(td(it.companyNumber, 'col-companyno'));

    var nickTd = document.createElement('td'); nickTd.className = 'col-nickname';
    nickTd.textContent = it.nickname || '';
    if (it.isAdded) { var addBadge = document.createElement('span'); addBadge.className = 'badge-mini add'; addBadge.textContent = '추가'; nickTd.appendChild(addBadge); }
    else if (it.isEdited) { var editBadge = document.createElement('span'); editBadge.className = 'badge-mini edit'; editBadge.textContent = '수정'; nickTd.appendChild(editBadge); }
    tr.appendChild(nickTd);

    tr.appendChild(td(bagSizeDisplay(it.bagSize), 'col-bagsize'));
    var bagTd = td('', 'col-bagfill');
    var towelTd = td('', 'col-towelfill');
    appendPackedGray(bagTd, towelTd, it.companyNumber);
    tr.appendChild(bagTd);
    tr.appendChild(towelTd);

    // 합세탁 가능 업체: 그룹별 색(A 파랑·B 분홍·C 초록)으로 번호·약칭·합세탁 칸을 칠하고 체크 칸을 둔다
    var gm = /^([ABC])/.exec(String(it.washGroup || it.combinedWash || '').replace(/\s+/g, '').toUpperCase());
    if (!gm && String(it.combinedWash || '').replace(/\s+/g, '') === '가능') {
      gm = /헬스|필라테스/.test(it.businessType || '') ? ['A', 'A'] : /미용실/.test(it.businessType || '') ? ['B', 'B'] : /피부관리|마사지/.test(it.businessType || '') ? ['C', 'C'] : null;
    }
    var combTd = td('', 'col-combine');
    if (gm) {
      // 세탁공정 참고표와 같은 색·이름: 가=파랑, 나=초록, 나-2=청록, 다=노랑
      var gfull = String(it.washGroup || '').replace(/\s+/g, '').toUpperCase();
      if (!/^[ABC]/.test(gfull)) gfull = gm[1];
      var gnum = gfull.slice(1);
      var cls = gfull.charAt(0) === 'A' ? 'a' : gfull.charAt(0) === 'C' ? 'c' : (gnum && gnum !== '1' ? 'b2' : 'b');
      var kor = { A: '가', B: '나', C: '다' }[gfull.charAt(0)] + (gnum && gnum !== '1' ? '-' + gnum : '');
      combTd.classList.add('cmb-' + cls);
      nickTd.classList.add('cmb-' + cls);
      tr.querySelector('.col-companyno').classList.add('cmb-' + cls);
      var lab = document.createElement('div'); lab.className = 'cmb-label'; lab.textContent = '합세탁 ' + kor;
      var bx = document.createElement('span'); bx.className = 'chk-box cmb-box';
      combTd.appendChild(lab); combTd.appendChild(bx);
    }
    tr.appendChild(combTd);

    var note = buildSpecialNote(it);
    var noteTd = td(note, 'col-note');
    if (noteHasEmphasis(note)) noteTd.classList.add('emphasis');
    tr.appendChild(noteTd);
    return tr;
  }

  // 전체 업체를 코스순 · 배송순서순으로 하나의 연속된 표에 담는다(코스별 제목 문단/별도 표/강제 페이지 분리 없음)
  // 포장기록 기준 업체별 포장 수. 못 읽었거나 그 업체가 0건이면 칸을 비워 둔다(틀린 숫자를 찍는 것보다 낫다).
  function grayCount(label, n, hhmm) {
    var gray = document.createElement('span'); gray.className = 'packed-gray';
    gray.appendChild(document.createTextNode(label));
    gray.appendChild(document.createElement('br'));
    var num = document.createElement('span'); num.className = 'packed-num'; num.textContent = n;
    gray.appendChild(num);
    gray.appendChild(document.createTextNode('개'));
    if (hhmm) {
      gray.appendChild(document.createElement('br'));
      var tm = document.createElement('span'); tm.className = 'packed-time'; tm.textContent = hhmm + ' 포장';
      gray.appendChild(tm);
    }
    return gray;
  }
  // 마감자용 수량표와 현황지가 같이 쓰는 회색 참고 수량. 헬스장: 포대배송 칸=옷, 수건배송 칸=수건
  function appendPackedGray(bagTd, towelTd, companyNumber) {
    var packedN = packedCountFor(companyNumber);
    var itemsN = packedItemsFor(companyNumber);
    var clothesN = itemsN['옷'] || 0, towelN = itemsN['수건'] || 0;
    if (clothesN + towelN > 0) {
      var cl = itemInfoFor(companyNumber, '옷'), tw = itemInfoFor(companyNumber, '수건');
      if (clothesN > 0) bagTd.appendChild(grayCount('(옷' + (cl.names ? '·' + cl.names : '') + ')', clothesN, cl.time));
      if (towelN > 0) towelTd.appendChild(grayCount('(수건' + (tw.names ? '·' + tw.names : '') + ')', towelN, tw.time));
    } else if (packedN > 0) {
      var names = packedPackersFor(companyNumber);
      bagTd.appendChild(grayCount(names ? '(' + names + ')' : '(포대+수건)', packedN, packedTimeFor(companyNumber)));
    }
  }

  // 그 업체를 포장한 담당자 이름(여럿이면 · 로 연결). 못 읽었으면 빈 문자열.
  function packedPackersFor(companyNumber) {
    var pc = state.packedCount;
    if (!pc || pc.date !== isoDate(state.selectedDate) || !pc.byPackers) return '';
    var key = String(companyNumber == null ? '' : companyNumber).trim().replace(/^0+/, '') || '0';
    return (pc.byPackers[key] || []).join('·');
  }

  // 헬스장: 품목(옷/수건)별 담당자 이름·포장 시각. 품목별 값이 없으면 업체 전체 값으로 대신한다.
  function itemInfoFor(companyNumber, item) {
    var pc = state.packedCount;
    var key = String(companyNumber == null ? '' : companyNumber).trim().replace(/^0+/, '') || '0';
    var ok = pc && pc.date === isoDate(state.selectedDate);
    var names = ok && pc.byItemPackers && pc.byItemPackers[key] && pc.byItemPackers[key][item];
    var time = ok && pc.byItemTime && pc.byItemTime[key] && pc.byItemTime[key][item];
    var first = ok && pc.byItemTimeFirst && pc.byItemTimeFirst[key] && pc.byItemTimeFirst[key][item];
    return { names: names ? names.join('·') : packedPackersFor(companyNumber), time: time ? timeRange(first, time) : packedTimeFor(companyNumber) };
  }

  // 그 업체를 가장 늦게 포장한 시각(HH:MM). 못 읽었으면 빈 문자열.
  function packedTimeFor(companyNumber) {
    var pc = state.packedCount;
    if (!pc || pc.date !== isoDate(state.selectedDate) || !pc.byTime) return '';
    var key = String(companyNumber == null ? '' : companyNumber).trim().replace(/^0+/, '') || '0';
    var last = pc.byTime[key] || '';
    return last ? timeRange(pc.byTimeFirst && pc.byTimeFirst[key], last) : '';
  }
  function timeRange(first, last) { return first && first !== last ? first + '~' + last : last; }

  function packedCountFor(companyNumber) {
    var pc = state.packedCount;
    if (!pc || pc.date !== isoDate(state.selectedDate)) return 0;
    var key = String(companyNumber == null ? '' : companyNumber).trim().replace(/^0+/, '') || '0';
    return Number(pc.byCompany[key]) || 0;
  }

  // 포장기록에서 품목(옷/수건)을 고른 업체의 품목별 수. 없으면 빈 객체.
  function packedItemsFor(companyNumber) {
    var pc = state.packedCount;
    if (!pc || pc.date !== isoDate(state.selectedDate) || !pc.byItems) return {};
    var key = String(companyNumber == null ? '' : companyNumber).trim().replace(/^0+/, '') || '0';
    return pc.byItems[key] || {};
  }

  function loadPackedCount(dateIso, keepOld) {
    if (!keepOld) state.packedCount = null;
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, 12000);
    return fetch(PACKED_COUNT_URL + '?date=' + encodeURIComponent(dateIso), { signal: controller.signal })
      .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })
      .then(function (data) {
        if (isoDate(state.selectedDate) !== dateIso || !data || !data.ok) return;
        var needRender = !keepOld;
        state.packedCount = { date: dateIso, byCompany: data.by_company || {}, byItems: data.by_company_items || {}, byPackers: data.by_company_packers || {}, byTime: data.by_company_time || {}, byTimeFirst: data.by_company_time_first || {}, byItemTimeFirst: data.by_item_time_first || {}, byItemPackers: data.by_item_packers || {}, byItemTime: data.by_item_time || {} };
        if (state.merged && needRender) renderPreview();
      })
      .catch(function () {})
      .then(function () { clearTimeout(timer); });
  }

  function buildCloserDoc(allCourses, merged) {
    var container = document.createElement('div');
    container.className = 'closer-doc';

    var allItems = [];
    allCourses.forEach(function (course) { allItems = allItems.concat(merged.byCourse[course] || []); });

    var headerBox = document.createElement('div');
    headerBox.className = 'closer-header-box';
    headerBox.innerHTML =
      '<div class="closer-kicker">세탁팀 마감용</div>' +
      '<div class="closer-main-title">마감자용 배송 수량 확인표</div>' +
      '<div class="closer-meta-line" data-slot="meta"></div>';
    headerBox.querySelector('[data-slot="meta"]').textContent =
      fmtBigDate(state.selectedDate) + ' · 전체 업체 수: ' + allItems.length + '개 · 인쇄 시각: ' + fmtPrintTime(new Date());
    container.appendChild(headerBox);

    var tableWrap = document.createElement('div');
    tableWrap.innerHTML = CLOSER_TABLE_TEMPLATE;
    var table = tableWrap.firstElementChild;
    var tbody = table.querySelector('tbody');
    allCourses.forEach(function (course, courseIdx) {
      (merged.byCourse[course] || []).forEach(function (it, itemIdx) {
        tbody.appendChild(buildCloserRow(it, courseIdx > 0 && itemIdx === 0));
      });
    });
    container.appendChild(table);
    container.appendChild(buildVehicleCheckTable());

    var summary = document.createElement('div');
    summary.className = 'closer-summary';

    var guideRow = document.createElement('div'); guideRow.className = 'row';
    guideRow.appendChild(document.createTextNode('업체별 포대·밴딩 수량을 기입하고 특이사항을 확인한 뒤 단톡방에 올려주세요. 색칠된 줄(가 파랑·나 초록·나-2 청록·다 노랑, 세탁공정표와 같은 색)은 합세탁 가능 업체이니 합세탁 칸에 □ 체크하세요.'));
    summary.appendChild(guideRow);

    var footerRow = document.createElement('div'); footerRow.className = 'row closer-footer';
    var s1 = document.createElement('span'); s1.textContent = '작성자: ______________';
    var s2 = document.createElement('span'); s2.textContent = '작성시간: ____시 ____분';
    var s3 = document.createElement('span'); s3.appendChild(document.createTextNode('단톡방 전송 '));
    var chk = document.createElement('span'); chk.className = 'chk-box'; s3.appendChild(chk);
    footerRow.appendChild(s1); footerRow.appendChild(s2); footerRow.appendChild(s3);
    summary.appendChild(footerRow);

    container.appendChild(summary);
    return container;
  }

  // ================= 세탁공정(세탁기 배정표) — 계산은 wash-core.js, 여기는 화면·출력·저장만 =================
  // 수거량은 Apps Script(getWashHistory)가 "업체별 수거량" 탭에서 읽어 온다. 원본 시트에는 절대 쓰지 않는다.
  // 회차 완료 체크는 이 브라우저(localStorage)에만 저장된다 — 다른 작업자 화면과 공유되지 않는다.
  var WASH_START_KEY = 'ysc_wash_start_v1';
  var W2_PAGE_CAP_PX = 1030;      // A4 세로 한 쪽에 쓸 수 있는 높이(여백 제외, 약간 여유)
  var W2_GAP_PX = 9, W2_BORDER_PX = 6;

  // 선택한 날짜 = 세탁하는 날. 그날 세탁할 것은 전 영업일(월요일은 휴무라 건너뜀)에 수거한 것이다.
  function washCollectDate(d) {
    var p = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1);
    if (p.getDay() === 1) p = new Date(p.getFullYear(), p.getMonth(), p.getDate() - 1);
    return p;
  }
  function washKey() {
    var P = washCollectDate(state.selectedDate);
    return { P: P, pIso: isoDate(P), weekday: weekdayFromDate(P) };
  }
  function washDateText() {
    var d = state.selectedDate, pp = washCollectDate(d);
    function f(x) { return (x.getMonth() + 1) + '/' + x.getDate() + '(' + weekdayFromDate(x) + ')'; }
    return '수거 ' + f(pp) + ' → 세탁 ' + f(d);
  }
  function w2El(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  }
  function w2AddTime(hhmm, addMin) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(hhmm || '');
    if (!m) return '';
    var t = (Number(m[1]) * 60 + Number(m[2]) + addMin) % 1440;
    return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
  }
  function washItems(merged) {
    var list = [];
    merged.courses.forEach(function (c) { (merged.byCourse[c] || []).forEach(function (it) { list.push(it); }); });
    return list;
  }

  var WASH_BASE_KEY = 'ysc_wash_base_v1';
  function washLoadBase(dateIso) {
    try { var all = JSON.parse(localStorage.getItem(WASH_BASE_KEY) || '{}'); return all[dateIso] || null; } catch (e) { return null; }
  }
  function washSaveBase(dateIso, sig, plan) {
    if (plan.errors.length) return;
    var cycles = {};
    plan.machines.forEach(function (m) { m.cycles.forEach(function (c) {
      cycles[c.key] = { items: c.items.map(function (it) {
        return { no: it.no, name: it.name, course: it.course, industry: it.industry, group: it.group, unclassified: it.unclassified, solo: it.solo, qty: it.qty, source: it.source };
      }) };
    }); });
    try {
      var all = JSON.parse(localStorage.getItem(WASH_BASE_KEY) || '{}');
      all[dateIso] = { sig: sig, cycles: cycles };
      var keys = Object.keys(all).sort();
      while (keys.length > 30) delete all[keys.shift()];
      localStorage.setItem(WASH_BASE_KEY, JSON.stringify(all));
    } catch (e) {}
  }
  function washStartTime() { try { return localStorage.getItem(WASH_START_KEY) || ''; } catch (e) { return ''; } }
  // ---- 수거량 이력 조회 (Apps Script getWashHistory)
  // 수거일(전 영업일)의 거래처 목록을 따로 불러온다(화면에서 고른 날짜의 목록이 아니다)
  function loadWashSource(pIso, weekday, force) {
    var src = state.washSrc[pIso];
    if (src && src.status === 'ok' && !force) return Promise.resolve(src.merged);
    if (force) delete state.rawCache[pIso];
    function build(raw) { src = { status: 'ok', merged: computeMerged(raw, loadDraft(pIso)) }; state.washSrc[pIso] = src; return src.merged; }
    if (state.rawCache[pIso]) return Promise.resolve(build(state.rawCache[pIso]));
    var T = [12000, 15000, 25000];
    function go(i) { return callGAS({ action: 'getData', weekday: weekday, date: pIso }, T[i]).catch(function (e) { if (i + 1 >= T.length) throw e; return go(i + 1); }); }
    return go(0).then(function (data) {
      if (!data || !data.success) throw new Error((data && data.message) || '수거일 거래처 목록을 불러오지 못했습니다.');
      if (data.requestedDate !== pIso) throw new Error('날짜 불일치: 요청 ' + pIso + ' / 응답 ' + data.requestedDate);
      state.rawCache[pIso] = data;
      return build(data);
    });
  }

  function ensureWashHistory(force) {
    if (!state.merged || state.merged.closedDay) return Promise.resolve();
    var k = washKey(), pIso = k.pIso;
    var rec = state.washHist[pIso], src = state.washSrc[pIso];
    if (rec && !force) {
      if (rec.status === 'loading') return rec.promise;
      if (rec.status === 'ok' && src && src.status === 'ok' && washItems(src.merged).every(function (it) { return rec.requested[String(it.companyNumber)]; })) return Promise.resolve();
      if (rec.status === 'error') return Promise.resolve();   // 오류는 [다시 계산] 버튼으로만 재시도
    }
    rec = { status: 'loading', requested: {}, loadedAt: 0 };
    w2StartPoll();
    state.washHist[pIso] = rec;
    rec.promise = loadWashSource(pIso, k.weekday, force)
      .then(function (pm) {
        var nos = washItems(pm).map(function (it) { return String(it.companyNumber); });
        nos.forEach(function (n) { rec.requested[n] = true; });
        return callGAS({ action: 'getWashHistory', date: pIso, weekday: k.weekday, companies: nos }, 25000);
      })
      .then(function (data) {
        if (!data || !data.success) throw new Error((data && data.message) || '수량 이력 조회에 실패했습니다.');
        if (data.date !== pIso) throw new Error('날짜 불일치: 요청 ' + pIso + ' / 응답 ' + data.date);
        rec.data = data; rec.status = 'ok'; rec.loadedAt = Date.now();
      })
      .catch(function (err) {
        var msg = (err && err.message) || String(err);
        if (/알 수 없는 요청/.test(msg)) msg = 'Apps Script가 아직 세탁공정용으로 업데이트되지 않았습니다(getWashHistory 없음). Code.gs를 새 버전으로 배포해 주세요.';
        else if (err && err.name === 'AbortError') msg = '시트 조회 시간이 초과되었습니다. 잠시 후 [다시 계산]을 눌러 주세요.';
        rec.status = 'error'; rec.error = msg;
      })
      .then(function () {
        if (washKey().pIso === pIso && (state.docType === 'wash' || state.docType === 'status_address_wash')) renderPreview();
      });
    return rec.promise;
  }

  // ---- 계산(기록이 같으면 다시 계산하지 않음) + 날짜·코스 검증
  function washPlanState(selMerged, popts) {
    var wk = washKey(), dateIso = wk.pIso;      // dateIso = 수거일
    var rec = state.washHist[dateIso];
    if (!rec || rec.status === 'loading') return { status: 'loading' };
    if (rec.status === 'error') return { status: 'error', message: rec.error };
    var src = state.washSrc[dateIso];
    if (!src || src.status !== 'ok') return { status: 'loading' };
    var merged = src.merged;                    // 수거일의 거래처 목록
    var items = washItems(merged).concat(((rec.data && rec.data.extras) || []).map(function (e) {
      return { companyNumber: e.companyNumber, nickname: e.nickname, businessType: e.businessType, course: e.course, washGroup: e.washGroup, combinedWash: e.combinedWash, addedExtra: true };
    }));
    var locked = {};
    var sig = JSON.stringify([dateIso, rec.loadedAt, items.map(function (i) { return [i.companyNumber, i.course, i.washGroup, i.businessType, i.combinedWash, i.nickname]; }),
      Object.keys(locked).sort().map(function (k) { return [k, locked[k].items.map(function (x) { return x.no + ':' + x.qty; })]; })]);
    if (state.washMemo && state.washMemo.sig === sig) return state.washMemo.value;
    if (popts && popts.noCompute) return { status: 'computing' };   // 계산은 무거우니 로딩 표시를 먼저 그린 뒤 한다

    var built = WashCore.buildCompanies(items, rec.data);
    // 수량·그룹이 그대로면 직전에 계산한 배정(기준안)을 유지한다 — 한 회차를 체크할 때 다른 회차가 뒤섞이지 않게.
    // 수량이 바뀌었으면 기준안을 버리고, 완료 체크한 회차만 고정한 채 나머지를 새로 계산한다.
    var dataSig = JSON.stringify(built.companies.map(function (c) { return [c.no, c.name, c.course, c.group, c.solo, c.qty, c.source, c.industry]; }));
    var base = washLoadBase(dateIso);
    var frozen = (base && base.sig === dataSig) ? base.cycles : null;
    var plan = WashCore.buildPlan(built.companies, { locked: locked, frozen: frozen });
    if (!frozen) washSaveBase(dateIso, dataSig, plan);
    var errs = built.errors.slice();
    if (rec.data.date !== dateIso) errs.push('수량 이력 날짜(' + rec.data.date + ')가 수거일(' + dateIso + ')과 다릅니다.');
    if (merged.weekday && merged.weekday !== wk.weekday) errs.push('불러온 요일(' + merged.weekday + ')이 수거일의 요일(' + wk.weekday + ')과 다릅니다.');
    if (!rec.data.rowFound) plan.warnings.push('"업체별 수거량" 시트에 ' + dateIso.slice(5) + ' 날짜 행이 없어 그 시트의 값은 쓰지 못했습니다.');
    if (!rec.data.fieldOk) plan.warnings.push('현장입력 시트(기사 앱 수거량)를 읽지 못했습니다 — 기사가 등록한 실제 수량이 반영되지 않았을 수 있습니다. ' + (rec.data.fieldError || ''));
    items.forEach(function (it) { if (!String(it.course || '').replace(/^-+/, '')) errs.push('거래처 ' + it.companyNumber + ' 의 배송 코스가 비어 있습니다.'); });
    if (built.companies.length + built.errors.filter(function (e) { return /중복/.test(e); }).length !== items.length) errs.push('불러온 거래처 수(' + items.length + ')와 배정 대상 수(' + built.companies.length + ')가 다릅니다.');
    if (rec.data.notFound && rec.data.notFound.length) plan.warnings.push('"업체별 수거량" 시트에 열이 없는 거래처(수량 확인 필요): ' + rec.data.notFound.join(', '));
    plan.errors = errs.concat(plan.errors);
    plan.valid = plan.errors.length === 0;
    plan.companies = built.companies;
    var value = { status: 'ok', plan: plan, rec: rec, src: src };
    state.washMemo = { sig: sig, value: value };
    return value;
  }

  // ---- 화면 조각
  // 로딩 표시: 돌아가는 원 + 움직이는 막대 + 경과 초. 화면이 멈춘 게 아니라는 걸 보여준다.
  // (일부러 prefers-reduced-motion 으로 끄지 않는다 — 현장 PC는 그 설정이 켜져 있다)
  function w2Loader(title, sub, steps) {
    var box = w2El('div', 'ld-box');
    box.appendChild(w2El('div', 'ld-spin'));
    box.appendChild(w2El('div', 'ld-title', title));
    box.appendChild(w2El('div', 'ld-bar'));
    var line = w2El('div', 'ld-sub', sub || '');
    box.appendChild(line);
    var t0 = Date.now();
    var timer = setInterval(function () {
      if (!box.isConnected && Date.now() - t0 > 1500) { clearInterval(timer); return; }
      var sec = Math.floor((Date.now() - t0) / 1000);
      var step = steps && steps.length ? steps[Math.min(steps.length - 1, Math.floor(sec / 4))] : '';
      line.textContent = (step ? step + ' · ' : '') + sec + '초 경과' + (sec >= 8 ? ' · 시트가 느릴 때는 최대 30초 걸립니다. 기다려 주세요' : '');
    }, 500);
    return box;
  }
  function w2Message(title, lines, isErr, retry) {
    var box = w2El('div', 'w2-msg' + (isErr ? ' err' : ''));
    box.appendChild(w2El('div', '', title));
    if (lines && lines.length) {
      var ul = w2El('ul');
      lines.forEach(function (l) { ul.appendChild(w2El('li', '', l)); });
      box.appendChild(ul);
    }
    if (retry) {
      var b = w2El('button', '', '다시 계산');
      b.type = 'button';
      b.addEventListener('click', function () { ensureWashHistory(true).then(function () { renderPreview(); }); renderPreview(); });
      box.appendChild(b);
    }
    return box;
  }
  function w2Tag(source) {
    var tag = w2El('span', 'w2-tag ' + (source === 'driver' ? 'w2-tag-driver' : 'w2-tag-ai'), source === 'driver' ? '실제' : '예상');
    return tag;
  }
  function w2BasisText(c) {
    var b = c.basis || {};
    if (c.source === 'driver') return '실제 수량 — ' + ((b && b.from) || '수거량 입력값');
    if (c.source === 'unknown') return '같은 요일 기록이 없어 예상할 수 없음 — 수량 확인 필요';
    return '같은 요일 최근 ' + b.values.length + '회 (' + b.dates.join(', ') + ') 값 ' + b.values.join(', ') + ' → 중앙값 ' + b.median;
  }

  function w2CycleEl(m, c, opts) {
    var el = w2El('div', 'w2-cycle w2-' + c.groupClass);
    el.setAttribute('data-key', c.key);
    var top = w2El('div', 'w2-cycle-top');
    var left = w2El('span');
    left.appendChild(w2El('span', 'w2-cycle-index', c.k + '차'));
    left.appendChild(document.createTextNode(' ' + c.groupLabel));

  function w2PagesFor(merged, plan, opts) {
    var probe = w2El('div', 'w2-doc w2-probe');
    var topEl = w2TopEl(merged, plan, opts);
    var footEl = w2FootEl(plan);
    var sampleMini = w2MiniEl(merged, 1, 9);
    probe.appendChild(topEl); probe.appendChild(sampleMini); probe.appendChild(footEl);
    var colsEl = w2El('div', 'w2-cols');
    var cA = w2El('div', 'w2-col'), cB = w2El('div', 'w2-col');
    colsEl.appendChild(cA); colsEl.appendChild(cB);
    probe.appendChild(colsEl);

    var cols = [[], []];
    plan.machines.forEach(function (m, idx) { if (m.cycles.length) cols[idx % 2].push(m); });
    var cycEls = {};
    var wrapA = w2El('section', 'w2-machine'), wrapB = w2El('section', 'w2-machine');
    wrapA.appendChild(w2MachineHeadEl(plan.machines[0], false));
    cA.appendChild(wrapA);
    wrapB.appendChild(w2MachineHeadEl(plan.machines[0], true));
    cB.appendChild(wrapB);
    var headH = 0;
    plan.machines.forEach(function (m, idx) {
      m.cycles.forEach(function (c) {
        var el = w2CycleEl(m, c, opts);
        cycEls[c.key] = { el: el, h: 0 };
        (idx % 2 ? wrapB : wrapA).appendChild(el);
      });
    });
    document.body.appendChild(probe);
    var topH, miniH, footH;
    try {
      w2FitNames(probe);
      headH = wrapA.firstChild.offsetHeight;
      topH = topEl.offsetHeight; miniH = sampleMini.offsetHeight + 8; footH = footEl.offsetHeight;
      Object.keys(cycEls).forEach(function (k) { cycEls[k].h = cycEls[k].el.offsetHeight; });
    } finally { document.body.removeChild(probe); }

    // 열별로 쪽 나누기: 회차 하나는 쪽 중간에서 끊지 않고, 세탁기 머리글은 첫 회차와 함께 둔다
    function cap(p) { return W2_PAGE_CAP_PX - (p === 0 ? topH + 6 : miniH); }
    var segsByCol = [[], []], usedByCol = [{}, {}], pageCount = 1;
    cols.forEach(function (machines, ci) {
      var p = 0, used = 0, seg = null, started = {};
      machines.forEach(function (m) {
        m.cycles.forEach(function (c) {
          var h = cycEls[c.key].h;
          var same = seg && seg.m === m && seg.page === p;
          var extra = same ? 0 : headH + W2_BORDER_PX + (used > 0 ? W2_GAP_PX : 0);
          if (used > 0 && used + extra + h > cap(p)) { p++; used = 0; seg = null; same = false; extra = headH + W2_BORDER_PX; }
          if (!same) { seg = { m: m, page: p, cycles: [], cont: !!started[m.no] }; segsByCol[ci].push(seg); used += extra; }
          started[m.no] = true;
          seg.cycles.push(c); used += h;
          usedByCol[ci][p] = used;
        });
      });
      pageCount = Math.max(pageCount, p + 1);
    });
    var lastUsed = Math.max(usedByCol[0][pageCount - 1] || 0, usedByCol[1][pageCount - 1] || 0);
    if (lastUsed + footH + 16 > cap(pageCount - 1)) pageCount++;

    var pages = [];
    for (var p = 0; p < pageCount; p++) {
      var page = w2El('div', 'w2-page');
      page.appendChild(p === 0 ? topEl : w2MiniEl(merged, p + 1, pageCount));
      var row = w2El('div', 'w2-cols');
      [0, 1].forEach(function (ci) {
        var col = w2El('div', 'w2-col');
        segsByCol[ci].filter(function (s) { return s.page === p; }).forEach(function (s) {
          var sec = w2El('section', 'w2-machine');
          sec.appendChild(w2MachineHeadEl(s.m, s.cont));
          s.cycles.forEach(function (c, i) {
            var el = cycEls[c.key].el;
            el.classList.toggle('first', i === 0);
            sec.appendChild(el);
          });
          col.appendChild(sec);
        });
        row.appendChild(col);
      });
      page.appendChild(row);
      if (p === pageCount - 1) page.appendChild(footEl);
      pages.push(page);
    }
    return pages;
  }
  function w2MiniEl(merged, p, n) {
    var m = w2El('div', 'w2-mini');

  // ---- 수량 변경 알림: 세탁공정을 보는 동안 1분마다 조용히 다시 읽어, 바뀐 게 있으면 띠로 알린다(자동 재배정은 하지 않음)
  var w2PollTimer = null;
  function w2StartPoll() { if (!w2PollTimer) w2PollTimer = setInterval(w2PollOnce, 60000); }
  function w2QtyLabel(e) { return (e.qty === null ? '?' : e.qty + '포대') + (e.source === 'driver' ? '(기사 등록)' : e.source === 'ai' ? '(기록 예상)' : '(확인 필요)'); }
  function w2Diff(oldData, newData) {
    var out = [];
    Object.keys(newData.companies || {}).forEach(function (no) {
      var a = WashCore.estimateQty((oldData.companies || {})[no]), b = WashCore.estimateQty(newData.companies[no]);
      if (a.qty !== b.qty || a.source !== b.source) out.push({ no: no, from: a, to: b });
    });
    return out;
  }
  function w2PollOnce() {
    if (document.hidden || (state.docType !== 'wash' && state.docType !== 'status_address_wash') || !state.merged) return;
    var wk = washKey(), dateIso = wk.pIso, rec = state.washHist[dateIso];
    if (!rec || rec.status !== 'ok' || rec.polling) return;
    rec.polling = true;
    callGAS({ action: 'getWashHistory', date: dateIso, weekday: wk.weekday, companies: Object.keys(rec.requested) }, 25000)
      .then(function (data) {
        if (!data || !data.success || data.date !== dateIso || state.washHist[dateIso] !== rec) return;
        var diffs = w2Diff(rec.data, data);
        rec.pending = diffs.length ? { data: data, diffs: diffs } : null;
        w2ShowChanged(rec);
      })
      .catch(function () {})
      .then(function () { rec.polling = false; });
  }
  function w2ShowChanged(rec) {
    var slot = document.querySelector('#previewSurface .w2-changed-slot');
    if (!slot) return;
    slot.innerHTML = '';
    if (!rec.pending) return;
    var names = {};
    var sm = state.washSrc[washKey().pIso];
    if (sm && sm.merged) washItems(sm.merged).forEach(function (it) { names[String(it.companyNumber)] = it.nickname; });
    var box = w2El('div', 'w2-changed');
    box.appendChild(w2El('span', '', '⚠ 수거량이 바뀌었습니다 (' + rec.pending.diffs.length + '곳) — 인쇄 전에 다시 계산하세요'));
    var btn = w2El('button', '', '다시 계산');
    btn.type = 'button';
    btn.addEventListener('click', function () {

      var sc = previewViewport.scrollTop; renderPreview(); previewViewport.scrollTop = sc;

    box.appendChild(btn);
    var list = rec.pending.diffs.slice(0, 6).map(function (d) { return d.no + ' ' + (names[d.no] || '') + ' ' + w2QtyLabel(d.from) + ' → ' + w2QtyLabel(d.to); });
    if (rec.pending.diffs.length > 6) list.push('외 ' + (rec.pending.diffs.length - 6) + '곳');
    box.appendChild(w2El('small', '', list.join(' · ')));

      function fallback() {

    var title = (merged.dayOfWeek || '') + ' · 세탁공정 참고표';
    if (ps.status === 'loading') {
      page.appendChild(w2El('div', 'w2-head')).appendChild(w2El('h1', '', title));
      page.appendChild(w2Loader('수거량을 시트에서 불러오는 중입니다', '기사 앱·배송입력 앱 수거량과 최근 기록을 읽는 중', ['수거량 읽는 중', '최근 기록 확인 중', '거의 다 됐습니다']));
      wrap.appendChild(page); return wrap;
    }
    if (ps.status === 'computing') {
      page.appendChild(w2El('div', 'w2-head')).appendChild(w2El('h1', '', title));
      page.appendChild(w2Loader('세탁기 배정표를 만드는 중입니다', '안전 규칙을 지키면서 가장 빨리 끝나는 배정을 찾는 중', ['배정 계산 중', '검증 중']));
      wrap.appendChild(page);
      setTimeout(function () {
        if (state.docType !== 'wash' && state.docType !== 'status_address_wash') return;
        state.washAllow = true;
        try { renderPreview(); } finally { state.washAllow = false; }
      }, 80);
      return wrap;
    }
    if (ps.status === 'error') {
      page.appendChild(w2El('div', 'w2-head')).appendChild(w2El('h1', '', title));
      page.appendChild(w2Message('수거량 이력을 불러오지 못했습니다', [ps.message], true, !opts.print));
      wrap.appendChild(page); return wrap;
    }
    var plan = ps.plan;
    if (!plan.valid) {
      page.appendChild(w2El('div', 'w2-head')).appendChild(w2El('h1', '', title));
      page.appendChild(w2Message('배정표 검증에 실패해 표시하지 않습니다. 아래 내용을 확인하세요.', plan.errors, true, !opts.print));
      wrap.appendChild(page); return wrap;
    }
    if (!opts.print) {
      var scr = w2El('div', 'w2-screen w2-screen-zone');
      scr.appendChild(w2El('div', 'w2-zone-label', '화면 전용 · 인쇄되지 않습니다'));
      scr.appendChild(w2ScreenBar(plan, ps.rec));
      scr.appendChild(w2HelpEl(plan));
      wrap.appendChild(scr);
      wrap.appendChild(w2El('div', 'w2-screen w2-paper-label', '▼ 아래부터 인쇄되는 세탁공정 참고표'));
    }
    var info = { dayOfWeek: merged.dayOfWeek, washWriter: (ps.src && ps.src.merged.washWriter) || '' };
    w2PagesFor(info, plan, opts).forEach(function (p) { wrap.appendChild(p); });
    if (!opts.print) wrap.appendChild(w2BasisEl(plan));
    wrap.setAttribute('data-wash-ok', '1');
    return wrap;
  }

  // ================= 합세탁 체크표(마감자용) 문서 =================
  // J열(combinedWash) 현재 상태: ok=가능(가능·A/B/C), no=단독(불가·단독·X), unk=미확정(공백·체크·신규·확인·그 외)
  function washCheckState(it) {
    var v = String((it && it.combinedWash) || '').replace(/\s+/g, '').toUpperCase();
    if (v === '가능' || v === 'A' || v === 'B' || v === 'C') return 'ok';
    if (v === '불가' || v === '단독' || v === 'X') return 'no';

  var ADDRESSALL_COL_WIDTHS = [7, 8, 8, 11, 32, 10, 16, 8];

  // 실제 데이터에 존재하는 코스만 렌더링되므로 여기 없는 코스는 자동으로 생략됨
