name: Deploy static site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stamp build id (열어 둔 창의 새 버전 확인용)
        run: |
          BID="${GITHUB_SHA::7}"
          sed -i "s/__BUILD_ID__/${BID}/g" index.html admin.html
          BTIME="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          printf '{"build":"%s","time":"%s"}\n' "$BID" "$BTIME" > version.json
          BSHORT="$(TZ=Asia/Seoul date '+%m/%d %H:%M')"
          sed -i "s#__BUILD_TIME__#${BSHORT}#g" index.html admin.html
          cat version.json
          grep -c "$BID" index.html admin.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      # 업로드 직후 바로 배포하면 GitHub가 artifact를 아직 못 찾아 실패하는 일이 반복돼 잠시 기다린다.
      - name: Wait for artifact
        run: sleep 20
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
